<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NiniTo | Index API Test</title>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    padding:20px;

    background:#f4f6f9;

    color:#1f2937;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

}

.container{

    max-width:800px;

    margin:auto;

}

h1{

    margin-top:0;

}

.status{

    padding:15px;

    border-radius:12px;

    margin-bottom:20px;

    background:white;

    border:1px solid #ddd;

}

.test{

    background:white;

    border-radius:14px;

    padding:16px;

    margin-bottom:12px;

    border:1px solid #ddd;

}

.test-title{

    font-weight:bold;

    font-size:16px;

    margin-bottom:8px;

}

.result{

    padding:10px;

    border-radius:8px;

    background:#f3f4f6;

    white-space:pre-wrap;

    word-break:break-word;

    font-size:13px;

    line-height:1.8;

}

.success{

    background:#ecfdf5;

    color:#166534;

}

.error{

    background:#fef2f2;

    color:#991b1b;

}

.loading{

    background:#fff7ed;

    color:#9a3412;

}

button{

    width:100%;

    height:50px;

    border:none;

    border-radius:12px;

    background:#7c3aed;

    color:white;

    font-family:inherit;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    margin-bottom:20px;

}

button:disabled{

    opacity:.6;

}

.small{

    font-size:12px;

    color:#6b7280;

    margin-top:5px;

}

</style>

</head>


<body>


<div class="container">


<h1>
تست API های index.html
</h1>


<div
    id="status"
    class="status"
>

در حال بررسی وضعیت احراز هویت...

</div>


<button
    id="runTests"
>

شروع تست همه API ها

</button>


<div
    id="tests"
></div>


</div>


<script>

/* ============================================================
   CONFIG
============================================================ */

const API_BASE_URL =
    "https://ninitoapp.farzadclever88.workers.dev";


const TOKEN_KEY =
    "NiniToToken";


/* ============================================================
   TOKEN
============================================================ */

function getToken(){

    return localStorage.getItem(
        TOKEN_KEY
    );

}


/* ============================================================
   STATUS
============================================================ */

const statusBox =
    document.getElementById(
        "status"
    );


const testsBox =
    document.getElementById(
        "tests"
    );


function showStatus(
    text,
    type=""
){

    statusBox.textContent =
        text;

    statusBox.className =
        "status " +
        type;

}


/* ============================================================
   TEST CARD
============================================================ */

function createTestCard(
    title,
    path
){

    const div =
        document.createElement(
            "div"
        );

    div.className =
        "test";


    div.innerHTML = `

        <div class="test-title">
            ${title}
        </div>

        <div class="small">
            GET ${path}
        </div>

        <div
            class="result loading"
            id="result-${testsBox.children.length}"
        >
            در انتظار تست...
        </div>

    `;


    testsBox.appendChild(
        div
    );


    return div.querySelector(
        ".result"
    );

}


/* ============================================================
   API TEST
============================================================ */

async function testApi(
    title,
    path
){

    const resultBox =
        createTestCard(
            title,
            path
        );


    resultBox.textContent =
        "در حال ارسال درخواست...";


    try{

        const token =
            getToken();


        if(!token){

            throw new Error(
                "توکن NiniToToken در localStorage پیدا نشد."
            );

        }


        const response =
            await fetch(

                API_BASE_URL +
                path,

                {

                    method:
                        "GET",

                    headers:{

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            token

                    }

                }

            );


        const text =
            await response.text();


        let data;


        try{

            data =
                JSON.parse(
                    text
                );

        }

        catch{

            data =
                text;

        }


        if(!response.ok){

            resultBox.className =
                "result error";


            resultBox.textContent =

                "❌ HTTP " +
                response.status +
                "\n\n" +

                JSON.stringify(
                    data,
                    null,
                    2
                );


            return false;

        }


        if(
            data &&
            data.success === false
        ){

            resultBox.className =
                "result error";


            resultBox.textContent =

                "❌ API ERROR\n\n" +

                JSON.stringify(
                    data,
                    null,
                    2
                );


            return false;

        }


        resultBox.className =
            "result success";


        resultBox.textContent =

            "✅ موفق\n\n" +

            JSON.stringify(
                data,
                null,
                2
            );


        return true;

    }

    catch(error){

        resultBox.className =
            "result error";


        resultBox.textContent =

            "❌ خطا\n\n" +

            (
                error.message ||
                String(error)
            );


        return false;

    }

}


/* ============================================================
   RUN ALL TESTS
============================================================ */

async function runTests(){

    testsBox.innerHTML =
        "";


    const token =
        getToken();


    if(!token){

        showStatus(

            "❌ توکن پیدا نشد. ابتدا از login.html وارد شوید.",

            "error"

        );

        return;

    }


    showStatus(

        "✅ توکن پیدا شد. در حال تست API ها...",

        "loading"

    );


    const tests = [

        [
            "1. اطلاعات کاربر",
            "/api/me"
        ],

        [
            "2. واحدها",
            "/api/units"
        ],

        [
            "3. محصولات",
            "/api/products"
        ],

        [
            "4. قطعات",
            "/api/parts"
        ],

        [
            "5. انبارها",
            "/api/warehouses"
        ],

        [
            "6. BOM ها",
            "/api/boms"
        ],

        [
            "7. برنامه های تولید",
            "/api/planning"
        ],

        [
            "8. موجودی انبار",
            "/api/inventory"
        ]

    ];


    let successCount =
        0;


    for(
        const test of tests
    ){

        const success =
            await testApi(
                test[0],
                test[1]
            );


        if(success){

            successCount++;

        }

    }


    if(
        successCount ===
        tests.length
    ){

        showStatus(

            "✅ تمام API های مورد استفاده index.html با موفقیت پاسخ دادند. " +
            successCount +
            " از " +
            tests.length,

            "success"

        );

    }

    else{

        showStatus(

            "⚠️ " +
            successCount +
            " از " +
            tests.length +
            " API موفق بودند. " +
            "موارد قرمز را بررسی کن.",

            "error"

        );

    }

}


document
    .getElementById(
        "runTests"
    )
    .addEventListener(
        "click",
        runTests
    );


/* ============================================================
   INITIAL STATUS
============================================================ */

if(
    getToken()
){

    showStatus(

        "✅ توکن ورود در localStorage موجود است.",

        "success"

    );

}

else{

    showStatus(

        "❌ توکن ورود پیدا نشد. ابتدا login.html را اجرا کن.",

        "error"

    );

}



 /* ============================================================
   BARCODE API TEST
============================================================ */

async function testBarcode(){

    const barcode =
        prompt(
            "بارکد قطعه را وارد کنید:"
        );


    if(
        barcode === null
    ){

        return;

    }


    if(
        !barcode.trim()
    ){

        alert(
            "بارکد وارد نشده است."
        );

        return;

    }


    const path =
        "/api/parts/barcode?barcode=" +
        encodeURIComponent(
            barcode.trim()
        );


    const resultBox =
        createTestCard(
            "9. جستجوی قطعه با بارکد",
            path
        );


    resultBox.textContent =
        "در حال ارسال درخواست...";


    try{

        const token =
            getToken();


        if(!token){

            throw new Error(
                "توکن NiniToToken پیدا نشد."
            );

        }


        const response =
            await fetch(

                API_BASE_URL +
                path,

                {

                    method:
                        "GET",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            token

                    }

                }

            );


        const text =
            await response.text();


        let data;


        try{

            data =
                JSON.parse(
                    text
                );

        }

        catch{

            data =
                text;

        }


        if(!response.ok){

            resultBox.className =
                "result error";


            resultBox.textContent =

                "❌ HTTP " +
                response.status +
                "\n\n" +

                JSON.stringify(
                    data,
                    null,
                    2
                );


            return;

        }


        if(
            data &&
            data.success === false
        ){

            resultBox.className =
                "result error";


            resultBox.textContent =

                "❌ API ERROR\n\n" +

                JSON.stringify(
                    data,
                    null,
                    2
                );


            return;

        }


        resultBox.className =
            "result success";


        resultBox.textContent =

            "✅ جستجوی بارکد موفق بود.\n\n" +

            JSON.stringify(
                data,
                null,
                2
            );


    }

    catch(error){

        resultBox.className =
            "result error";


        resultBox.textContent =

            "❌ خطا\n\n" +

            (
                error.message ||
                String(error)
            );

    }

}


/* ============================================================
   RESPONSE STRUCTURE TEST
============================================================ */

async function testResponseStructures(){

    const resultBox =
        createTestCard(
            "10. بررسی ساختار پاسخ API ها",
            "بررسی data.items / items"
        );


    resultBox.textContent =
        "در حال بررسی ساختار پاسخ‌ها...";


    const endpoints = [

        [
            "units",
            "/api/units"
        ],

        [
            "products",
            "/api/products"
        ],

        [
            "parts",
            "/api/parts"
        ],

        [
            "warehouses",
            "/api/warehouses"
        ],

        [
            "boms",
            "/api/boms"
        ],

        [
            "planning",
            "/api/planning"
        ],

        [
            "inventory",
            "/api/inventory"
        ]

    ];


    const report = [];


    try{

        const token =
            getToken();


        if(!token){

            throw new Error(
                "توکن پیدا نشد."
            );

        }


        for(
            const endpoint of endpoints
        ){

            const response =
                await fetch(

                    API_BASE_URL +
                    endpoint[1],

                    {

                        method:
                            "GET",

                        headers: {

                            "Content-Type":
                                "application/json",

                            "Authorization":
                                "Bearer " +
                                token

                        }

                    }

                );


            const data =
                await response.json();


            if(
                !response.ok
            ){

                report.push({

                    endpoint:
                        endpoint[0],

                    status:
                        "❌ HTTP " +
                        response.status,

                    structure:
                        "ناموفق"

                });

                continue;

            }


            const items =
                data?.data?.items ||
                data?.items ||
                null;


            if(
                Array.isArray(items)
            ){

                report.push({

                    endpoint:
                        endpoint[0],

                    status:
                        "✅ OK",

                    structure:
                        "items موجود است",

                    count:
                        items.length

                });

            }

            else{

                report.push({

                    endpoint:
                        endpoint[0],

                    status:
                        "⚠️ مشکل",

                    structure:
                        "items آرایه نیست",

                    raw:
                        data

                });

            }

        }


        const failed =
            report.filter(
                item =>
                    item.status !==
                    "✅ OK"
            );


        if(
            failed.length === 0
        ){

            resultBox.className =
                "result success";

        }

        else{

            resultBox.className =
                "result error";

        }


        resultBox.textContent =
            JSON.stringify(
                report,
                null,
                2
            );

    }

    catch(error){

        resultBox.className =
            "result error";


        resultBox.textContent =

            "❌ خطا در بررسی ساختار پاسخ\n\n" +

            (
                error.message ||
                String(error)
            );

    }

}


/* ============================================================
   ADD EXTRA TEST BUTTONS
============================================================ */

const barcodeButton =
    document.createElement(
        "button"
    );


barcodeButton.textContent =
    "تست API جستجوی بارکد";


barcodeButton.style.marginTop =
    "10px";


barcodeButton.addEventListener(
    "click",
    testBarcode
);


document
    .querySelector(".container")
    .appendChild(
        barcodeButton
    );


const structureButton =
    document.createElement(
        "button"
    );


structureButton.textContent =
    "تست ساختار پاسخ همه API ها";


structureButton.addEventListener(
    "click",
    testResponseStructures
);


document
    .querySelector(".container")
    .appendChild(
        structureButton
    );     
</script>

</body>

</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#2563eb"
>

<title>
داشبورد | سامانه نی‌نی‌تو
</title>


<style>

/* ============================================================
   ROOT
============================================================ */

:root{

    --bg:#f4f7fb;
    --card:#ffffff;
    --text:#172033;
    --muted:#64748b;
    --border:#e2e8f0;

    --primary:#2563eb;
    --primary-dark:#1d4ed8;

    --success:#16a34a;
    --warning:#d97706;
    --danger:#dc2626;

    --shadow:
        0 8px 28px rgba(15,23,42,.07);

}


:root[data-theme="dark"]{

    --bg:#0f172a;
    --card:#1e293b;
    --text:#f8fafc;
    --muted:#94a3b8;
    --border:#334155;

    --shadow:
        0 8px 28px rgba(0,0,0,.25);

}


/* ============================================================
   RESET
============================================================ */

*{
    box-sizing:border-box;
}


html{
    scroll-behavior:smooth;
}


body{

    margin:0;

    background:var(--bg);

    color:var(--text);

    font-family:
        Tahoma,
        "Segoe UI",
        Arial,
        sans-serif;

    min-height:100vh;

}


button,
input,
select,
textarea{

    font:inherit;

}


button{
    cursor:pointer;
}


/* ============================================================
   HEADER
============================================================ */

.header{

    position:sticky;

    top:0;

    z-index:100;

    background:var(--card);

    border-bottom:
        1px solid var(--border);

}


.header-inner{

    max-width:1500px;

    margin:auto;

    padding:
        12px 18px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:15px;

}


.brand{

    display:flex;

    align-items:center;

    gap:10px;

}


.logo{

    width:44px;

    height:44px;

    border-radius:13px;

    background:var(--primary);

    color:#fff;

    display:grid;

    place-items:center;

    font-weight:900;

    font-size:21px;

}


.brand-title{

    font-weight:900;

    font-size:15px;

}


.brand-subtitle{

    color:var(--muted);

    font-size:11px;

    margin-top:3px;

}


.header-actions{

    display:flex;

    align-items:center;

    gap:7px;

    flex-wrap:wrap;

}


.user-box{

    padding:
        8px 11px;

    border-radius:9px;

    background:var(--bg);

    border:
        1px solid var(--border);

    font-size:12px;

}


.btn{

    border:0;

    border-radius:9px;

    padding:
        9px 13px;

    background:var(--primary);

    color:#fff;

    font-weight:700;

    font-size:12px;

}


.btn:hover{

    background:var(--primary-dark);

}


.btn.secondary{

    background:var(--card);

    color:var(--text);

    border:
        1px solid var(--border);

}


.btn.secondary:hover{

    background:var(--bg);

}


.btn.danger{

    background:var(--danger);

}


.btn.small{

    padding:
        6px 9px;

    font-size:11px;

}


/* ============================================================
   LAYOUT
============================================================ */

.layout{

    max-width:1500px;

    margin:auto;

    padding:18px;

    display:grid;

    grid-template-columns:
        220px
        minmax(0,1fr);

    gap:18px;

}


.sidebar{

    position:sticky;

    top:78px;

    align-self:start;

    background:var(--card);

    border:
        1px solid var(--border);

    border-radius:15px;

    padding:9px;

    box-shadow:var(--shadow);

}


.sidebar-title{

    color:var(--muted);

    font-size:11px;

    padding:
        8px;

}


.nav-button{

    width:100%;

    border:0;

    background:transparent;

    color:var(--text);

    text-align:right;

    padding:
        10px;

    border-radius:9px;

    margin-bottom:2px;

    font-size:12px;

}


.nav-button:hover,
.nav-button.active{

    background:
        rgba(37,99,235,.10);

    color:var(--primary);

}


/* ============================================================
   MAIN
============================================================ */

main{
    min-width:0;
}


.page-head{

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    gap:12px;

    margin-bottom:15px;

}


.page-head h1{

    margin:0;

    font-size:23px;

}


.page-head p{

    margin:
        4px 0 0;

    color:var(--muted);

    font-size:12px;

}


.status{

    padding:
        7px 11px;

    border-radius:99px;

    background:
        rgba(22,163,74,.10);

    color:var(--success);

    font-size:11px;

    font-weight:700;

}


.status.bad{

    background:
        rgba(220,38,38,.10);

    color:var(--danger);

}


/* ============================================================
   STATS
============================================================ */

.stats{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:12px;

    margin-bottom:15px;

}


.stat{

    background:var(--card);

    border:
        1px solid var(--border);

    border-radius:15px;

    padding:15px;

    box-shadow:var(--shadow);

}


.stat-label{

    color:var(--muted);

    font-size:11px;

}


.stat-value{

    display:block;

    font-size:25px;

    font-weight:900;

    margin-top:4px;

}


/* ============================================================
   CARD
============================================================ */

.card{

    background:var(--card);

    border:
        1px solid var(--border);

    border-radius:15px;

    box-shadow:var(--shadow);

    overflow:hidden;

    margin-bottom:15px;

}


.card-header{

    padding:
        12px 15px;

    border-bottom:
        1px solid var(--border);

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:10px;

}


.card-header h2{

    margin:0;

    font-size:15px;

}


.card-body{

    padding:15px;

}


/* ============================================================
   TABLE
============================================================ */

.table-wrapper{

    overflow:auto;

}


table{

    width:100%;

    border-collapse:collapse;

    min-width:700px;

}


th,
td{

    padding:
        9px 10px;

    border-bottom:
        1px solid var(--border);

    text-align:right;

    white-space:nowrap;

    font-size:12px;

}


th{

    background:var(--bg);

    color:var(--muted);

    font-size:11px;

    position:sticky;

    top:0;

}


tr:hover td{

    background:
        rgba(37,99,235,.035);

}


.empty{

    text-align:center;

    padding:35px;

    color:var(--muted);

    font-size:12px;

}


/* ============================================================
   SEARCH
============================================================ */

.toolbar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:10px;

    flex-wrap:wrap;

    margin-bottom:12px;

}


.search-box{

    display:flex;

    gap:7px;

    flex:1;

    min-width:230px;

}


.search-box input{

    flex:1;

}


input,
select,
textarea{

    width:100%;

    padding:
        10px 11px;

    border:
        1px solid var(--border);

    border-radius:9px;

    background:var(--bg);

    color:var(--text);

    outline:none;

}


input:focus,
select:focus,
textarea:focus{

    border-color:
        var(--primary);

    box-shadow:
        0 0 0 3px
        rgba(37,99,235,.10);

}


select{

    cursor:pointer;

}


/* ============================================================
   GRID CARDS
============================================================ */

.data-grid{

    display:grid;

    grid-template-columns:
        repeat(auto-fill,minmax(240px,1fr));

    gap:12px;

}


.data-card{

    border:
        1px solid var(--border);

    border-radius:12px;

    padding:14px;

    background:var(--card);

}


.data-card-title{

    font-weight:800;

    margin-bottom:7px;

}


.data-card-row{

    display:flex;

    justify-content:space-between;

    gap:10px;

    padding:
        5px 0;

    border-bottom:
        1px dashed var(--border);

    font-size:11px;

}


.data-card-row:last-child{

    border-bottom:0;

}


.data-card-label{

    color:var(--muted);

}


/* ============================================================
   FORM
============================================================ */

.form-grid{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:12px;

}


.form-group label{

    display:block;

    margin-bottom:6px;

    font-size:11px;

    color:var(--muted);

}


.form-actions{

    margin-top:14px;

    display:flex;

    gap:8px;

}


/* ============================================================
   BARCODE
============================================================ */

.barcode-box{

    display:grid;

    grid-template-columns:
        1fr auto;

    gap:8px;

}


.barcode-result{

    margin-top:15px;

}


.result-card{

    border:
        1px solid var(--border);

    border-radius:12px;

    padding:15px;

    background:var(--bg);

}


.result-title{

    font-weight:900;

    font-size:16px;

    margin-bottom:12px;

}


.result-row{

    padding:
        7px 0;

    border-bottom:
        1px dashed var(--border);

    font-size:12px;

}


/* ============================================================
   MESSAGE
============================================================ */

.message{

    position:fixed;

    bottom:18px;

    left:18px;

    z-index:300;

    max-width:420px;

    padding:
        12px 15px;

    border-radius:11px;

    background:var(--card);

    border:
        1px solid var(--border);

    box-shadow:var(--shadow);

    display:none;

    font-size:12px;

}


.message.show{

    display:block;

}


.message.error{

    border-right:
        4px solid var(--danger);

}


.message.warning{

    border-right:
        4px solid var(--warning);

}


.message.success{

    border-right:
        4px solid var(--success);

}


/* ============================================================
   LOADER
============================================================ */

.loader{

    position:fixed;

    inset:0;

    z-index:500;

    background:
        rgba(15,23,42,.35);

    display:none;

    align-items:center;

    justify-content:center;

}


.loader.show{

    display:flex;

}


.loader-box{

    background:var(--card);

    color:var(--text);

    border-radius:15px;

    padding:
        25px 35px;

    text-align:center;

    box-shadow:var(--shadow);

}


.spinner{

    width:34px;

    height:34px;

    margin:
        0 auto 12px;

    border:
        4px solid var(--border);

    border-top-color:
        var(--primary);

    border-radius:50%;

    animation:
        spin .8s linear infinite;

}


@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* ============================================================
   FOOTER
============================================================ */

.footer{

    max-width:1500px;

    margin:auto;

    padding:
        0 18px 25px;

    color:var(--muted);

    font-size:10px;

}


/* ============================================================
   RESPONSIVE
============================================================ */

@media(max-width:1000px){

    .layout{

        grid-template-columns:1fr;

    }

    .sidebar{

        position:static;

        display:flex;

        overflow:auto;

        gap:3px;

    }

    .sidebar-title{

        display:none;

    }

    .nav-button{

        width:auto;

        white-space:nowrap;

    }

    .stats{

        grid-template-columns:
            repeat(2,1fr);

    }

}


@media(max-width:650px){

    .header-inner{

        align-items:flex-start;

    }

    .brand-subtitle{

        display:none;

    }

    .page-head{

        flex-direction:column;

    }

    .stats{

        grid-template-columns:1fr 1fr;

    }

    .form-grid{

        grid-template-columns:1fr;

    }

    .barcode-box{

        grid-template-columns:1fr;

    }

}


</style>

</head>

<script>

"use strict";


/* ============================================================
   CONFIG
============================================================ */

const CONFIG = {

    API:
        "https://ninitoapp.farzadclever88.workers.dev",

    TOKEN_KEY:
        "ninito_token",

    USER_KEY:
        "ninito_user",

    THEME_KEY:
        "ninito_theme",

    LOGIN_PAGE:
        "login.html",

    TIMEOUT:
        20000

};


/* ============================================================
   STATE
============================================================ */

const STATE = {

    user:null,

    units:[],

    products:[],

    parts:[],

    warehouses:[],

    boms:[],

    planning:[],

    production:[],

    inventory:[],

    currentView:
        "dashboard",

    search:"",

    loading:false

};


/* ============================================================
   DOM
============================================================ */

const $ =
    selector =>
        document.querySelector(
            selector
        );


const $$ =
    selector =>
        Array.from(
            document.querySelectorAll(
                selector
            )
        );


/* ============================================================
   ESCAPE
============================================================ */

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* ============================================================
   NUMBER
============================================================ */

function faNumber(value){

    const number =
        Number(value);

    if(
        Number.isFinite(number)
    ){

        return number.toLocaleString(
            "fa-IR"
        );

    }

    return escapeHtml(
        value ?? "-"
    );

}


/* ============================================================
   DATE
============================================================ */

function faDate(value){

    if(!value){

        return "-";

    }

    const text =
        String(value);

    /*
     * اگر Worker تاریخ شمسی برگرداند،
     * همان را بدون تغییر نشان می‌دهیم.
     */

    if(
        /^\d{4}\/\d{1,2}\/\d{1,2}$/
            .test(text)
    ){

        return escapeHtml(
            text
        );

    }

    /*
     * تاریخ ISO میلادی
     * به تاریخ فارسی تبدیل می‌شود.
     */

    const date =
        new Date(text);

    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return escapeHtml(
            text
        );

    }

    try{

        return new Intl.DateTimeFormat(
            "fa-IR-u-ca-persian",
            {
                year:"numeric",
                month:"2-digit",
                day:"2-digit"
            }
        ).format(date);

    }

    catch{

        return escapeHtml(
            text
        );

    }

}


/* ============================================================
   TOKEN
============================================================ */

function getToken(){

    return localStorage.getItem(
        CONFIG.TOKEN_KEY
    );

}


/* ============================================================
   MESSAGE
============================================================ */

function showMessage(
    text,
    type="success"
){

    const box =
        $("#message");

    if(!box){

        return;

    }

    box.textContent =
        text;

    box.className =
        "message " +
        type +
        " show";

    clearTimeout(
        box._timer
    );

    box._timer =
        setTimeout(
            () =>
                box.classList.remove(
                    "show"
                ),
            4500
        );

}


/* ============================================================
   LOADER
============================================================ */

function setLoading(
    state,
    text="در حال ارتباط با سامانه..."
){

    const loader =
        $("#loader");

    const loaderText =
        $("#loaderText");

    if(loader){

        loader.classList.toggle(
            "show",
            Boolean(state)
        );

    }

    if(loaderText){

        loaderText.textContent =
            text;

    }

}


/* ============================================================
   CLEAR AUTH
============================================================ */

function clearAuthentication(){

    localStorage.removeItem(
        CONFIG.TOKEN_KEY
    );

    localStorage.removeItem(
        CONFIG.USER_KEY
    );

    STATE.user =
        null;

}


/* ============================================================
   API REQUEST
============================================================ */

async function apiRequest(
    path,
    options={}
){

    const method =
        options.method ||
        "GET";

    const body =
        options.body ??
        null;

    const auth =
        options.auth !== false;


    const headers = {

        "Accept":
            "application/json"

    };


    if(
        body !== null
    ){

        headers[
            "Content-Type"
        ] =
            "application/json";

    }


    const token =
        getToken();


    if(
        auth &&
        token
    ){

        headers.Authorization =
            "Bearer " +
            token;

    }


    const controller =
        new AbortController();


    const timer =
        setTimeout(
            () =>
                controller.abort(),
            CONFIG.TIMEOUT
        );


    setLoading(
        true,
        options.loadingText ||
        "در حال ارتباط با سامانه..."
    );


    try{

        const response =
            await fetch(

                CONFIG.API +
                path,

                {

                    method,

                    headers,

                    body:
                        body === null
                            ? undefined
                            : JSON.stringify(
                                body
                              ),

                    signal:
                        controller.signal,

                    cache:
                        "no-store"

                }

            );


        clearTimeout(
            timer
        );


        let data;


        try{

            data =
                await response.json();

        }

        catch{

            throw {

                code:
                    "API-JSON",

                message:
                    "پاسخ Worker قابل خواندن نیست.",

                status:
                    response.status

            };

        }


        if(
            response.status ===
            401
        ){

            clearAuthentication();

            showMessage(
                "نشست شما منقضی شده است.",
                "error"
            );


            setTimeout(
                () =>
                    window.location.replace(
                        CONFIG.LOGIN_PAGE
                    ),
                500
            );


            throw {

                code:
                    "AUTH-401",

                message:
                    "نشست کاربر معتبر نیست.",

                status:
                    401

            };

        }


        if(
            !response.ok
        ){

            throw {

                code:
                    data?.error?.code ||
                    "HTTP-" +
                    response.status,

                message:
                    data?.error?.message ||
                    data?.message ||
                    "عملیات در Worker انجام نشد.",

                status:
                    response.status

            };

        }


        if(
            data &&
            data.success === false
        ){

            throw {

                code:
                    data?.error?.code ||
                    "API-ERROR",

                message:
                    data?.error?.message ||
                    data?.message ||
                    "عملیات انجام نشد.",

                status:
                    response.status

            };

        }


        return data;

    }

    catch(error){

        clearTimeout(
            timer
        );


        if(
            error?.name ===
            "AbortError"
        ){

            throw {

                code:
                    "NET-002",

                message:
                    "زمان پاسخ‌گویی Worker به پایان رسید.",

                status:
                    0

            };

        }


        throw error;

    }

    finally{

        setLoading(
            false
        );

    }

}


/* ============================================================
   LOAD API
============================================================ */

async function loadData(
    stateName,
    path,
    label
){

    try{

        const data =
            await apiRequest(

                path,

                {

                    loadingText:
                        "در حال دریافت " +
                        label +
                        "..."

                }

            );


        STATE[stateName] =
            Array.isArray(
                data?.items
            )
            ? data.items
            : [];


        return {

            success:true,

            items:
                STATE[stateName]

        };

    }

    catch(error){

        console.error(
            "LOAD:",
            path,
            error
        );


        STATE[stateName] =
            [];


        return {

            success:false,

            items:[],

            error

        };

    }

}

/* ============================================================
   THEME
============================================================ */

function applyTheme(){

    const theme =
        localStorage.getItem(
            CONFIG.THEME_KEY
        );


    if(
        theme === "dark"
    ){

        document.documentElement
            .dataset
            .theme =
                "dark";

    }

    else{

        delete document.documentElement
            .dataset
            .theme;

    }


    const button =
        $("#themeButton");


    if(button){

        button.textContent =
            theme === "dark"
                ? "تم روز"
                : "تم شب";

    }

}


function toggleTheme(){

    const dark =
        document.documentElement
            .dataset
            .theme ===
        "dark";


    localStorage.setItem(

        CONFIG.THEME_KEY,

        dark
            ? "light"
            : "dark"

    );


    applyTheme();

}


/* ============================================================
   SELECT OPTIONS
============================================================ */

function makeOptions(
    items,
    valueField="id",
    textFunction=(
        item =>
            item.name ||
            item.code ||
            item.id
    )
){

    let html =
        `<option value="">
            انتخاب کنید
        </option>`;


    items.forEach(
        item => {

            html += `

                <option
                    value="${escapeHtml(
                        item[valueField]
                    )}"
                >
                    ${escapeHtml(
                        textFunction(item)
                    )}
                </option>

            `;

        }
    );


    return html;

}

/* ============================================================
   TABLE
============================================================ */

function renderTable(
    columns,
    rows,
    emptyText
){

    if(
        !rows ||
        !rows.length
    ){

        return `

            <div class="empty">
                ${escapeHtml(
                    emptyText
                )}
            </div>

        `;

    }


    return `

<div class="table-wrapper">

<table>

<thead>

<tr>

${columns.map(

    column => `

        <th>
            ${escapeHtml(
                column.label
            )}
        </th>

    `

).join("")}

</tr>

</thead>


<tbody>

${rows.map(

    row => `

<tr>

${columns.map(

    column => {

        const value =
            typeof column.value ===
            "function"

                ? column.value(row)

                : row[
                    column.value
                  ] ??
                  "-";

        return `

            <td>
                ${
                    typeof value ===
                    "string" &&
                    value.includes("<")
                        ? value
                        : escapeHtml(
                            value
                          )
                }
            </td>

        `;

    }

).join("")}

</tr>

`

).join("")}

</tbody>

</table>

</div>

`;

}

============================================================ */

function renderGenericView(
    viewName
){

    const config =
        VIEWS[
            viewName
        ];


    if(!config){

        return;

    }


    const rows =
        STATE[
            config.state
        ] || [];


    $("#main").innerHTML = `

<section class="page-head">

<div>

<h1>
${escapeHtml(
    config.title
)}
</h1>

<p>
${escapeHtml(
    config.description
)}
</p>

</div>

<span class="status">
${faNumber(
    rows.length
)}
 رکورد
</span>

</section>


<section class="card">

<div class="card-header">

<h2>
${escapeHtml(
    config.title
)}
</h2>

<button
    id="refreshView"
    class="btn secondary small"
    type="button"
>
بروزرسانی
</button>

</div>


<div class="card-body">

<div class="toolbar">

<div class="search-box">

<input
    id="viewSearch"
    type="search"
    placeholder="جستجو در اطلاعات..."
    autocomplete="off"
>

</div>


<select
    id="viewMode"
    style="max-width:140px"
>

<option value="table">
نمایش جدول
</option>

<option value="grid">
نمایش کارت
</option>

</select>

</div>


<div id="viewContent"></div>

</div>

</section>

`;


    const search =
        $("#viewSearch");


    const mode =
        $("#viewMode");


    function refresh(){

        const query =
            search.value
                .trim()
                .toLowerCase();


        const filtered =
            rows.filter(
                row => {

                    if(!query){

                        return true;

                    }


                    return Object
                        .values(row)
                        .join(" ")
                        .toLowerCase()
                        .includes(query);

                }
            );


        const content =
            $("#viewContent");


        if(
            mode.value ===
            "grid"
        ){

            content.innerHTML =
                renderDataGrid(
                    filtered,
                    config.columns
                );

        }

        else{

            content.innerHTML =
                renderTable(
                    config.columns,
                    filtered,
                    "اطلاعاتی پیدا نشد."
                );

        }

    }


    search.addEventListener(
        "input",
        refresh
    );


    mode.addEventListener(
        "change",
        refresh
    );


    $("#refreshView")
        .addEventListener(
            "click",
            async () => {

                const result =
                    await loadData(
                        config.state,
                        config.path,
                        config.title
                    );


                if(
                    !result.success
                ){

                    showMessage(
                        result.error?.message ||
                        "بروزرسانی انجام نشد.",
                        "error"
                    );

                }


                renderGenericView(
                    viewName
                );

            }
        );


    refresh();

}

function renderBarcodeView(){

    $("#main").innerHTML = `

<section class="page-head">

جستجوی بارکد
</h1>

<p>
جستجوی قطعه از طریق Worker

<div class="card-header">

<h2>
بارکد قطعه
</h2>

</div>


<div class="card-body">

<div class="barcode-box">

<input
    id="barcodeInput"
    type="text"
    inputmode="numeric"
    placeholder="بارکد را وارد یا اسکن کنید..."
    autocomplete="off"
>


<button
    id="barcodeSearchButton"
    class="btn"
    type="button"
>
جستجو
</button>

</div>


<div
    id="barcodeResult"
    class="barcode-result"
>

<div class="empty">

هنوز جستجویی انجام نشده است.

</div>

</div>

</div>

</section>


<section class="card">

<div class="card-header">

<h2>
انتخاب قطعه
</h2>

</div>

<div class="card-body">

<select
    id="barcodePartSelect"
>
${makeOptions(

    STATE.parts,

    "id",

    item =>
        `${item.code || ""} -
         ${item.name || ""} -
         ${item.barcode || ""}`

)}

</select>

</div>

</section>

`;


    const input =
        $("#barcodeInput");


    const button =
        $("#barcodeSearchButton");


    const partSelect =
        $("#barcodePartSelect");


    async function search(){

        const barcode =
            input.value.trim();


        if(!barcode){

            showMessage(
                "بارکد را وارد کنید.",
                "warning"
            );

            input.focus();

            return;

        }


        try{

            const data =
                await apiRequest(

                    "/api/parts/barcode?barcode=" +
                    encodeURIComponent(
                        barcode
                    ),

                    {

                        loadingText:
                            "در حال جستجوی بارکد..."

                    }

                );


            const part =
                data?.item;


            if(!part){

                throw {

                    message:
                        "قطعه‌ای با این بارکد پیدا نشد."

                };

            }


            renderBarcodeResult(
                part
            );


            if(
                part.id
            ){

                partSelect.value =
                    String(
                        part.id
                    );

            }

        }

        catch(error){

            $("#barcodeResult").innerHTML = `

                <div class="message error"
                     style="display:block;position:static;max-width:none">

                    ${escapeHtml(
                        error.message ||
                        "خطا در جستجوی بارکد."
                    )}

                </div>

            `;

        }

    }


    button.addEventListener(
        "click",
        search
    );


    input.addEventListener(
        "keydown",
        event => {

            if(
                event.key ===
                "Enter"
            ){

                event.preventDefault();

                search();

            }

        }
    );


    partSelect.addEventListener(
        "change",
        () => {

            const id =
                partSelect.value;


            const part =
                STATE.parts.find(
                    item =>
                        String(
                            item.id
                        ) ===
                        String(id)
                );


            if(part){

                input.value =
                    part.barcode ||
                    "";

                renderBarcodeResult(
                    part
                );

            }

        }
    );

}

نقطه سفارش:

<b>
${faNumber(
    part.reorder_point
)}
</b>

</div>

</div>

`;

}


/* ============================================================
   NAVIGATION
============================================================ */

async function openView(
    view
){

    STATE.currentView =
        view;


    $$(".nav-button")
        .forEach(
            button => {

                button.classList.toggle(

                    "active",

                    button.dataset.view ===
                    view

                );

            }
        );


    if(
        view ===
        "dashboard"
    ){

        renderDashboard();

        return;

    }


    if(
        view ===
        "barcode"
    ){

        renderBarcodeView();

        return;

    }


    renderGenericView(
        view
    );

}


/* ============================================================
   LOGOUT
============================================================ */

async function logout(){

    try{

        await apiRequest(

            "/api/logout",

            {

                method:
                    "POST",

                loadingText:
                    "در حال خروج..."

            }

        );

    }

    catch(error){

        console.warn(
            "LOGOUT:",
            error
        );

    }

    finally{

        clearAuthentication();

        window.location.replace(
            CONFIG.LOGIN_PAGE
        );

    }

}


/* ============================================================
   LOAD ALL DATA
============================================================ */

async function loadAllData(){

    /*
     * Promise.all باعث نمی‌شود با شکست یک API
     * بقیه APIها متوقف شوند؛ چون loadData
     * خودش خطا را مدیریت می‌کند.
     */

    const results =
        await Promise.all([

            loadData(
                "units",
                "/api/units",
                "واحدها"
            ),

            loadData(
                "products",
                "/api/products",
                "محصولات"
            ),

            loadData(
                "parts",
                "/api/parts",
                "قطعات"
            ),

            loadData(
                "warehouses",
                "/api/warehouses",
                "انبارها"
            ),

            loadData(
                "boms",
                "/api/boms",
                "BOMها"
            ),

            loadData(
                "planning",
                "/api/planning",
                "برنامه تولید"
            ),

            loadData(
                "production",
                "/api/production",
                "سوابق تولید"
            ),

            loadData(
                "inventory",
                "/api/inventory",
                "موجودی انبار"
            )

        ]);


    return results;

}


/* ============================================================
   EVENTS
============================================================ */

function initializeEvents(){

    $("#themeButton")
        .addEventListener(
            "click",
            toggleTheme
        );


    $("#logoutButton")
        .addEventListener(
            "click",
            logout
        );


    $$(".nav-button")
        .forEach(
            button => {

                button.addEventListener(

                    "click",

                    () =>
                        openView(
                            button.dataset.view
                        )

                );

            }
        );


    document.addEventListener(

        "click",

        event => {

            const button =
                event.target.closest(
                    "[data-go-view]"
                );


            if(
                button
            ){

                openView(
                    button.dataset.goView
                );

            }

        }

    );

}


/* ============================================================
   STARTUP
============================================================ */

async function initializeApplication(){

    /*
     * اول Theme
     */

    applyTheme();


    /*
     * بعد Eventها
     */

    initializeEvents();


    /*
     * Token
     */

    const token =
        getToken();


    if(!token){

        window.location.replace(
            CONFIG.LOGIN_PAGE
        );

        return;

    }


    try{

        /*
         * اول کاربر را بررسی می‌کنیم.
         */

        await loadUser();


        /*
         * سپس تمام داده‌ها.
         */

        const results =
            await loadAllData();


        const failed =
            results.filter(
                result =>
                    !result.success
            );


        const status =
            $("#connectionStatus");


        if(
            failed.length
        ){

            status.textContent =
                "اتصال ناقص";

            status.classList.add(
                "bad"
            );

            showMessage(

                failed.length +
                " سرویس با خطا مواجه شد؛ اطلاعات سایر بخش‌ها نمایش داده شد.",

                "warning"

            );

        }

        else{

            status.textContent =
                "اتصال به Worker موفق";

            status.classList.remove(
                "bad"
            );

        }


        /*
         * در پایان Dashboard.
         */

        await openView(
            "dashboard"
        );

    }

    catch(error){

        console.error(
            "APPLICATION ERROR:",
            error
        );


        const status =
            $("#connectionStatus");


        if(status){

            status.textContent =
                "خطا در اتصال";

            status.classList.add(
                "bad"
            );

        }


        $("#main").innerHTML = `

<section class="page-head">

<div>

<h1>
خطا در اتصال
</h1>

<p>
سامانه نتوانست اطلاعات کاربر یا Worker را دریافت کند.
</p>

</div>

<span class="status bad">
اتصال ناموفق
</span>

</section>


<section class="card">

<div class="card-body">

<div
    style="
        color:var(--danger);
        line-height:2;
        font-size:13px;
    "
>

<b>
${escapeHtml(
    error.code ||
    "ERROR"
)}
</b>

<br>

${escapeHtml(
    error.message ||
    "خطای ناشناخته در ارتباط با سامانه."
)}

</div>


<div
    style="
        margin-top:15px;
        display:flex;
        gap:8px;
    "
>

<button
    id="retryButton"
    class="btn"
    type="button"
>
تلاش مجدد
</button>


<button
    id="loginAgainButton"
    class="btn danger"
    type="button"
>
ورود مجدد
</button>

</div>

</div>

</section>

`;


        $("#retryButton")
            .addEventListener(
                "click",
                initializeApplication
            );


        $("#loginAgainButton")
            .addEventListener(
                "click",
                () => {

                    clearAuthentication();

                    window.location.replace(
                        CONFIG.LOGIN_PAGE
                    );

                }
            );

    }

    finally{

        setLoading(
            false
        );

    }

}


/* ============================================================
   GLOBAL ERROR PROTECTION
============================================================ */

window.addEventListener(

    "error",

    event => {

        console.error(
            "GLOBAL ERROR:",
            event.error ||
            event.message
        );

        setLoading(
            false
        );

    }

);


window.addEventListener(

    "unhandledrejection",

    event => {

        console.error(
            "UNHANDLED PROMISE:",
            event.reason
        );

        setLoading(
            false
        );

    }

);


/* ============================================================
   START
============================================================ */

document.addEventListener(

    "DOMContentLoaded",

    initializeApplication

);

</script>


</body>

</html>

<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>

<meta
    name="theme-color"

>

</title>

    rel="stylesheet"

<style>

/* =========================================================
   THEME
========================================================= */

:root{

    --bg:#f4f7fb;

    --surface:#ffffff;

    --surface-2:#f8fafc;

    --text:#172033;

    --muted:#64748b;

    --border:#e2e8f0;

    --primary:#2563eb;

    --primary-hover:#1d4ed8;

    --success:#16a34a;

    --warning:#d97706;

    --danger:#dc2626;

    --info:#0284c7;

    --shadow:
        0 8px 28px rgba(15,23,42,.08);

    --radius:14px;

    --sidebar-width:240px;

}


:root[data-theme="dark"]{

    --bg:#0f172a;

    --surface:#1e293b;

    --surface-2:#172033;

    --text:#f8fafc;

    --muted:#94a3b8;

    --border:#334155;

    --primary:#60a5fa;

    --primary-hover:#93c5fd;

    --success:#4ade80;

    --warning:#fbbf24;

    --danger:#f87171;

    --info:#38bdf8;

    --shadow:
        0 8px 28px rgba(0,0,0,.25);

}


/* =========================================================
   RESET
========================================================= */

*{

    box-sizing:border-box;

}


html{

    scroll-behavior:smooth;

}


body{

    margin:0;

    min-height:100vh;

    background:var(--bg);

    color:var(--text);

    font-family:
        Tahoma,
        "Segoe UI",
        Arial,
        sans-serif;

}


button,
input,
select,
textarea{

    font:inherit;

}


button{

    cursor:pointer;

}


button:disabled{

    cursor:not-allowed;

    opacity:.55;

}


/* =========================================================
   HEADER
========================================================= */

.header{

    position:sticky;

    top:0;

    z-index:100;

    background:var(--surface);

    border-bottom:
        1px solid var(--border);

}


.header-inner{

    max-width:1600px;

    margin:auto;

    padding:
        11px 18px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

}


.brand{

    display:flex;

    align-items:center;

    gap:11px;

    min-width:0;

}


.logo{

    width:44px;

    height:44px;

    flex:none;

    display:grid;

    place-items:center;

    border-radius:12px;

    background:var(--primary);

    color:#fff;

    font-size:22px;

    font-weight:900;

}


.brand-text{

    min-width:0;

}


.brand-title{

    font-weight:900;

    font-size:16px;

}


.brand-subtitle{

    margin-top:3px;

    color:var(--muted);

    font-size:11px;

}


.header-actions{

    display:flex;

    align-items:center;

    gap:7px;

    flex-wrap:wrap;

}


.current-user{

    padding:
        8px 11px;

    border:
        1px solid var(--border);

    border-radius:10px;

    background:var(--surface-2);

    color:var(--muted);

    font-size:12px;

}


.current-user strong{

    color:var(--text);

}


/* =========================================================
   LAYOUT
========================================================= */

.app-layout{

    max-width:1600px;

    margin:auto;

    padding:18px;

    display:grid;

    grid-template-columns:
        var(--sidebar-width)
        minmax(0,1fr);

    gap:18px;

}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{

    position:sticky;

    top:82px;

    align-self:start;

    background:var(--surface);

    border:
        1px solid var(--border);

    border-radius:var(--radius);

    box-shadow:var(--shadow);

    padding:9px;

}


.sidebar-title{

    padding:
        8px 10px;

    color:var(--muted);

    font-size:11px;

    font-weight:700;

}


.nav-button{

    width:100%;

    display:flex;

    align-items:center;

    gap:8px;

    border:0;

    background:transparent;

    color:var(--text);

    text-align:right;

    padding:
        10px 11px;

    border-radius:9px;

    margin-bottom:2px;

}


.nav-button:hover{

    background:
        rgba(37,99,235,.08);

}


.nav-button.active{

    background:
        rgba(37,99,235,.13);

    color:var(--primary);

    font-weight:800;

}


.nav-icon{

    width:22px;

    text-align:center;

}


/* =========================================================
   MAIN
========================================================= */

.main{

    min-width:0;

}


.page-head{

    display:flex;

    align-items:flex-start;

    justify-content:space-between;

    gap:15px;

    margin-bottom:15px;

}


.page-title{

    margin:0;

    font-size:24px;

}


.page-description{

    margin:
        4px 0 0;

    color:var(--muted);

    font-size:13px;

}


.connection-status{

    flex:none;

    padding:
        7px 11px;

    border-radius:999px;

    background:
        rgba(22,163,74,.12);

    color:var(--success);

    font-size:11px;

    font-weight:800;

}


.connection-status.bad{

    background:
        rgba(220,38,38,.12);

    color:var(--danger);

}


/* =========================================================
   CARD
========================================================= */

.card{

    background:var(--surface);

    border:
        1px solid var(--border);

    border-radius:var(--radius);

    box-shadow:var(--shadow);

    overflow:hidden;

    margin-bottom:15px;

}


.card-header{

    padding:
        13px 15px;

    border-bottom:
        1px solid var(--border);

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

}


.card-title{

    margin:0;

    font-size:15px;

    font-weight:800;

}


.card-body{

    padding:15px;

}


/* =========================================================
   STAT
========================================================= */

.stats{

    display:grid;

    grid-template-columns:
        repeat(5,minmax(0,1fr));

    gap:12px;

    margin-bottom:15px;

}


.stat-card{

    background:var(--surface);

    border:
        1px solid var(--border);

    border-radius:var(--radius);

    box-shadow:var(--shadow);

    padding:15px;

}


.stat-label{

    color:var(--muted);

    font-size:11px;

}


.stat-value{

    display:block;

    margin-top:5px;

    font-size:25px;

    font-weight:900;

}


/* =========================================================
   BUTTON
========================================================= */

.btn{

    min-height:38px;

    border:0;

    border-radius:9px;

    padding:
        8px 13px;

    background:var(--primary);

    color:#fff;

    font-weight:700;

}


.btn:hover{

    background:var(--primary-hover);

}


.btn.secondary{

    background:var(--surface);

    color:var(--text);

    border:
        1px solid var(--border);

}


.btn.success{

    background:var(--success);

}


.btn.warning{

    background:var(--warning);

}


.btn.danger{

    background:var(--danger);

}


.btn.small{

    min-height:32px;

    padding:
        5px 9px;

    font-size:11px;

}


.toolbar{

    display:flex;

    flex-wrap:wrap;

    gap:7px;

}


/* =========================================================
   FORM
========================================================= */

.form-grid{

    display:grid;

    grid-template-columns:
        repeat(3,minmax(0,1fr));

    gap:13px;

}


.form-group{

    min-width:0;

}


.form-group.full{

    grid-column:
        1 / -1;

}


.form-label{

    display:block;

    margin-bottom:6px;

    font-size:12px;

    font-weight:800;

}


.required{

    color:var(--danger);

}


.form-control{

    width:100%;

    min-height:40px;

    padding:
        8px 10px;

    border:
        1px solid var(--border);

    border-radius:9px;

    outline:none;

    background:var(--surface-2);

    color:var(--text);

}


.form-control:focus{

    border-color:var(--primary);

    box-shadow:
        0 0 0 3px
        rgba(37,99,235,.12);

}


textarea.form-control{

    min-height:90px;

    resize:vertical;

}


.form-help{

    display:block;

    margin-top:4px;

    color:var(--muted);

    font-size:10px;

}


.form-error{

    display:block;

    margin-top:4px;

    color:var(--danger);

    font-size:11px;

}


.number-words{

    margin-top:5px;

    min-height:17px;

    color:var(--muted);

    font-size:10px;

}


/* =========================================================
   TABLE
========================================================= */

.table-container{

    width:100%;

    overflow-x:auto;

}


.data-table{

    width:100%;

    min-width:760px;

    border-collapse:collapse;

}


.data-table th,
.data-table td{

    padding:
        9px 10px;

    border-bottom:
        1px solid var(--border);

    text-align:right;

    white-space:nowrap;

    font-size:12px;

}


.data-table th{

    background:var(--surface-2);

    color:var(--muted);

    font-size:11px;

}


.data-table tbody tr:hover{

    background:
        rgba(37,99,235,.035);

}


/* =========================================================
   BADGE
========================================================= */

.badge{

    display:inline-flex;

    align-items:center;

    padding:
        4px 8px;

    border-radius:999px;

    font-size:10px;

    font-weight:800;

}


.badge.success{

    background:
        rgba(22,163,74,.12);

    color:var(--success);

}


.badge.warning{

    background:
        rgba(217,119,6,.12);

    color:var(--warning);

}


.badge.danger{

    background:
        rgba(220,38,38,.12);

    color:var(--danger);

}


.badge.info{

    background:
        rgba(2,132,199,.12);

    color:var(--info);

}


/* =========================================================
   EMPTY
========================================================= */

.empty-state{

    padding:40px 15px;

    text-align:center;

    color:var(--muted);

}


.empty-icon{

    font-size:32px;

    margin-bottom:8px;

}


/* =========================================================
   ERROR
========================================================= */

.error-box{

    padding:13px;

    border:
        1px solid
        rgba(220,38,38,.25);

    border-radius:10px;

    background:
        rgba(220,38,38,.08);

    color:var(--danger);

    font-size:12px;

}


.success-box{

    padding:13px;

    border:
        1px solid
        rgba(22,163,74,.25);

    border-radius:10px;

    background:
        rgba(22,163,74,.08);

    color:var(--success);

    font-size:12px;

}


/* =========================================================
   MODAL
========================================================= */

.modal-backdrop{

    position:fixed;

    inset:0;

    z-index:200;

    display:none;

    align-items:center;

    justify-content:center;

    padding:15px;

    background:
        rgba(0,0,0,.5);

}


.modal-backdrop.show{

    display:flex;

}


.modal{

    width:
        min(850px,100%);

    max-height:
        calc(100vh - 30px);

    overflow:auto;

    background:var(--surface);

    color:var(--text);

    border-radius:15px;

    box-shadow:
        0 25px 80px rgba(0,0,0,.25);

}


.modal-header{

    padding:14px 16px;

    border-bottom:
        1px solid var(--border);

    display:flex;

    align-items:center;

    justify-content:space-between;

}


.modal-header h2{

    margin:0;

    font-size:17px;

}


.modal-close{

    width:34px;

    height:34px;

    border:0;

    border-radius:8px;

    background:var(--surface-2);

    color:var(--text);

    font-size:20px;

}


.modal-body{

    padding:16px;

}


.modal-footer{

    padding:13px 16px;

    border-top:
        1px solid var(--border);

    display:flex;

    justify-content:flex-start;

    gap:7px;

}


/* =========================================================
   PAGINATION
========================================================= */

.pagination{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:5px;

    padding:13px;

    flex-wrap:wrap;

}


.page-btn{

    min-width:34px;

    height:34px;

    border:
        1px solid var(--border);

    border-radius:8px;

    background:var(--surface);

    color:var(--text);

}


.page-btn.active{

    background:var(--primary);

    border-color:var(--primary);

    color:#fff;

}


/* =========================================================
   MESSAGE
========================================================= */

.message-container{

    position:fixed;

    left:18px;

    bottom:18px;

    z-index:500;

    width:
        min(430px,calc(100vw - 36px));

}


.message{

    display:none;

    padding:12px 14px;

    border-radius:11px;

    background:var(--surface);

    color:var(--text);

    border:
        1px solid var(--border);

    box-shadow:var(--shadow);

    font-size:12px;

}


.message.show{

    display:block;

}


.message.success{

    border-right:
        4px solid var(--success);

}


.message.error{

    border-right:
        4px solid var(--danger);

}


.message.warning{

    border-right:
        4px solid var(--warning);

}


/* =========================================================
   GLOBAL LOADER
========================================================= */

.global-loader{

    position:fixed;

    inset:0;

    z-index:1000;

    display:none;

    align-items:center;

    justify-content:center;

    background:
        rgba(0,0,0,.38);

}


.global-loader.show{

    display:flex;

}


.loader-box{

    min-width:220px;

    padding:22px;

    border-radius:15px;

    background:var(--surface);

    color:var(--text);

    text-align:center;

}


.spinner{

    width:34px;

    height:34px;

    margin:
        0 auto 10px;

    border:
        4px solid var(--border);

    border-top-color:var(--primary);

    border-radius:50%;

    animation:
        spin .8s linear infinite;

}


@keyframes spin{

    to{

        transform:rotate(360deg);

    }

}


/* =========================================================
   BARCODE
========================================================= */

.barcode-row{

    display:grid;

    grid-template-columns:
        minmax(0,1fr)
        auto;

    gap:7px;

}


.barcode-result{

    margin-top:12px;

}


/* =========================================================
   FOOTER
========================================================= */

.footer{

    max-width:1600px;

    margin:auto;

    padding:
        0 18px 25px;

    color:var(--muted);

    font-size:10px;

}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1100px){

    .stats{

        grid-template-columns:
            repeat(3,minmax(0,1fr));

    }

    .form-grid{

        grid-template-columns:
            repeat(2,minmax(0,1fr));

    }

}


@media(max-width:850px){

    .app-layout{

        grid-template-columns:1fr;

    }

    .sidebar{

        position:static;

        display:flex;

        overflow-x:auto;

        gap:3px;

    }

    .sidebar-title{

        display:none;

    }

    .nav-button{

        width:auto;

        white-space:nowrap;

        flex:none;

    }

}


@media(max-width:650px){

    .header-inner{

        align-items:flex-start;

    }

    .brand-subtitle,
    .current-user{

        display:none;

    }

    .stats{

        grid-template-columns:
            repeat(2,minmax(0,1fr));

    }

    .form-grid{

        grid-template-columns:1fr;

    }

    .form-group.full{

        grid-column:auto;

    }

    .page-head{

        flex-direction:column;

    }

    .toolbar{

        width:100%;

    }

    .toolbar .btn{

        flex:1;

    }

}


</style>

</head>

/* ============================================================
   HTML ESCAPE
============================================================ */

function escapeHtml(value){

    return String(
        value ?? ""
    ).replace(
        /[&<>"']/g,
        character => ({

            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"

        }[character])
    );

}


/* ============================================================
   NUMBER
============================================================ */

function toNumber(value){

    if(
        value === null ||
        value === undefined ||
        value === ""
    ){

        return 0;

    }


    const normalized =
        String(value)
            .replace(
                /,/g,
                ""
            )
            .replace(
                /٬/g,
                ""
            )
            .replace(
                /،/g,
                ""
            )
            .replace(
                /۰/g,
                "0"
            )
            .replace(
                /۱/g,
                "1"
            )
            .replace(
                /۲/g,
                "2"
            )
            .replace(
                /۳/g,
                "3"
            )
            .replace(
                /۴/g,
                "4"
            )
            .replace(
                /۵/g,
                "5"
            )
            .replace(
                /۶/g,
                "6"
            )
            .replace(
                /۷/g,
                "7"
            )
            .replace(
                /۸/g,
                "8"
            )
            .replace(
                /۹/g,
                "9"
            );


    const number =
        Number(normalized);


    return Number.isFinite(number)
        ? number
        : 0;

}


function formatNumber(value){

    return toNumber(value)
        .toLocaleString(
            "fa-IR"
        );

}

/* ============================================================
   API ERROR
============================================================ */

function normalizeApiError(
    data,
    status
){

    const apiError =
        data &&
        data.error
            ? data.error
            : null;


    if(apiError){

        return {

            code:
                apiError.code ||
                "API-ERROR",

            message:
                apiError.message ||
                "خطایی در سامانه رخ داد.",

            status

        };

    }


    const messages = {

        400:
            "درخواست ارسال‌شده معتبر نیست.",

        401:
            "نشست شما معتبر نیست. لطفاً دوباره وارد شوید.",

        403:
            "شما مجوز انجام این عملیات را ندارید.",

        404:
            "اطلاعات یا مسیر موردنظر پیدا نشد.",

        409:
            "این اطلاعات با داده‌های موجود تداخل دارد.",

        422:
            "اطلاعات واردشده معتبر نیست.",

        500:
            "خطای داخلی سامانه رخ داده است.",

        502:
            "Worker پاسخ معتبر دریافت نکرد.",

        503:
            "سرویس سامانه موقتاً در دسترس نیست."

    };


    return {

        code:
            "HTTP-" +
            String(status || "UNKNOWN"),

        message:
            messages[status] ||
            "عملیات در سامانه انجام نشد.",

        status

    };

}


/* ============================================================
   API REQUEST
============================================================ */

async function apiRequest(
    path,
    options = {}
){

    const method =
        options.method ||
        "GET";


    const auth =
        options.auth !== false;


    const body =
        options.body !== undefined
            ? options.body
            : null;


    const token =
        STATE.token ||
        readToken();


    const headers = {

        "Accept":
            "application/json"

    };


    if(
        body !== null &&
        !(body instanceof FormData)
    ){

        headers[
            "Content-Type"
        ] =
            "application/json";

    }


    if(
        auth &&
        token
    ){

        headers.Authorization =
            "Bearer " +
            token;

    }


    const controller =
        new AbortController();


    const timeout =
        setTimeout(
            () => controller.abort(),
            CONFIG.TIMEOUT
        );


    setLoading(
        true,
        options.loadingText ||
        "در حال ارتباط با سامانه..."
    );


    try{

        const response =
            await fetch(
                CONFIG.API + path,
                {

                    method,

                    headers,

                    body:
                        body === null
                            ? undefined
                            : (
                                body instanceof FormData
                                    ? body
                                    : JSON.stringify(body)
                            ),

                    signal:
                        controller.signal,

                    cache:
                        "no-store"

                }
            );


        let data = null;


        try{

            data =
                await response.json();

        }

        catch{

            data = null;

        }


        if(
            response.status === 401
        ){

            clearAuthentication();


            if(
                !options.skipAuthRedirect
            ){

                showMessage(
                    "نشست شما منقضی شده است. در حال انتقال به صفحه ورود...",
                    "error"
                );


                setTimeout(
                    () => {

                        window.location.href =
                            CONFIG.LOGIN_PAGE;

                    },
                    700
                );

            }


            throw normalizeApiError(
                data,
                401
            );

        }


        if(!response.ok){

            throw normalizeApiError(
                data,
                response.status
            );

        }


        if(
            data &&
            data.success === false
        ){

            throw {

                code:
                    data.error?.code ||
                    "API-ERROR",

                message:
                    data.error?.message ||
                    "عملیات انجام نشد.",

                status:
                    response.status

            };

        }


        return data || {};

    }

    catch(error){

        if(
            error &&
            error.code
        ){

            throw error;

        }


        if(
            error &&
            error.name ===
            "AbortError"
        ){

            throw {

                code:
                    "NET-TIMEOUT",

                message:
                    "زمان پاسخ‌گویی Worker به پایان رسید.",

                status:0

            };

        }


        throw {

            code:
                "NET-ERROR",

            message:
                "ارتباط با Worker برقرار نشد. اتصال اینترنت و آدرس Worker را بررسی کنید.",

            status:0,

            original:
                error

        };

    }

    finally{

        clearTimeout(
            timeout
        );

        setLoading(
            false
        );

    }

}

/* ============================================================
   NUMBER TO PERSIAN WORDS
============================================================ */

const PERSIAN_ONES = [

    "",
    "یک",
    "دو",
    "سه",
    "چهار",
    "پنج",
    "شش",
    "هفت",
    "هشت",
    "نه"

];


const PERSIAN_TEENS = [

    "ده",
    "یازده",
    "دوازده",
    "سیزده",
    "چهارده",
    "پانزده",
    "شانزده",
    "هفده",
    "هجده",
    "نوزده"

];


const PERSIAN_TENS = [

    "",
    "",
    "بیست",
    "سی",
    "چهل",
    "پنجاه",
    "شصت",
    "هفتاد",
    "هشتاد",
    "نود"

];


const PERSIAN_HUNDREDS = [

    "",
    "صد",
    "دویست",
    "سیصد",
    "چهارصد",
    "پانصد",
    "ششصد",
    "هفتصد",
    "هشتصد",
    "نهصد"

];


const PERSIAN_SCALES = [

    "",
    "هزار",
    "میلیون",
    "میلیارد",
    "تریلیون"

];


function threeDigitWords(
    number
){

    number =
        Math.floor(number);


    if(number === 0){

        return "";

    }


    const parts = [];


    const hundreds =
        Math.floor(
            number / 100
        );


    const rest =
        number % 100;


    if(hundreds){

        parts.push(
            PERSIAN_HUNDREDS[
                hundreds
            ]
        );

    }


    if(rest){

        if(rest < 10){

            parts.push(
                PERSIAN_ONES[
                    rest
                ]
            );

        }

        else if(rest < 20){

            parts.push(
                PERSIAN_TEENS[
                    rest - 10
                ]
            );

        }

        else{

            const tens =
                Math.floor(
                    rest / 10
                );


            const ones =
                rest % 10;


            if(tens){

                parts.push(
                    PERSIAN_TENS[
                        tens
                    ]
                );

            }


            if(ones){

                parts.push(
                    PERSIAN_ONES[
                        ones
                    ]
                );

            }

        }

    }


    return parts.join(
        " و "
    );

}

    

function numberToPersianWords(
    value
){

    let number =
        toNumber(value);


    if(number === 0){

        return "صفر";

    }


    if(number < 0){

        return (
            "منفی " +
            numberToPersianWords(
                Math.abs(number)
            )
        );

    }


    if(
        !Number.isInteger(number)
    ){

        return "عدد اعشاری";

    }


    const groups = [];


    while(number > 0){

        groups.push(
            number % 1000
        );

        number =
            Math.floor(
                number / 1000
            );

    }


    const result = [];


    for(
        let i = groups.length - 1;
        i >= 0;
        i--
    ){

        if(!groups[i]){

            continue;

        }


        const text =
            threeDigitWords(
                groups[i]
            );


        if(
            PERSIAN_SCALES[i]
        ){

            result.push(
                text +
                " " +
                PERSIAN_SCALES[i]
            );

        }

        else{

            result.push(
                text
            );

        }

    }


    return result.join(
        " و "
    );

}

/* ============================================================

============================================================ */

function populateSelect(
    selector,
    items,
    valueField,
    labelFunction,
    placeholder = "انتخاب کنید"
){

    const selects =
        $$(selector);


    selects.forEach(
        select => {

            const oldValue =
                select.value;


            select.innerHTML =
                "";


            const first =
                document.createElement(
                    "option"
                );


            first.value =
                "";


            first.textContent =
                placeholder;


            select.appendChild(
                first
            );


            items.forEach(
                item => {

                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        item[valueField];


                    option.textContent =
                        labelFunction(item);


                    select.appendChild(
                        option
                    );

                }
            );


            if(oldValue){

                select.value =
                    oldValue;

            }

        }
    );

}

/*
 * تبدیل میلادی به جلالی
 * الگوریتم داخلی تا Frontend برای تبدیل تاریخ
 * به سرویس دیگری وابسته نباشد.
 */

function gregorianToJalali(
    gy,
    gm,
    gd
){

    const gdm = [

        0,
        31,
        59,
        90,
        120,
        151,
        181,
        212,
        243,
        273,
        304,
        334

    ];


    let jy;


    if(gy > 1600){

        jy = 979;

        gy -= 1600;

    }

    else{

        jy = 0;

        gy -= 621;

    }


    const gy2 =
        gm > 2
            ? gy + 1
            : gy;


    let days =
        (
            365 * gy
        )
        +
        Math.floor(
            (gy2 + 3) / 4
        )
        -
        Math.floor(
            (gy2 + 99) / 100
        )
        +
        Math.floor(
            (gy2 + 399) / 400
        )
        -
        80
        +
        gd
        +
        gdm[gm - 1];


    jy +=
        33 *
        Math.floor(
            days / 12053
        );


    days %=
        12053;


    jy +=
        4 *
        Math.floor(
            days / 1461
        );


    days %=
        1461;


    if(days > 365){

        jy +=
            Math.floor(
                (days - 1) / 365
            );


        days =
            (days - 1) % 365;

    }


    const jm =
        days < 186
            ? 1 +
              Math.floor(
                  days / 31
              )
            : 7 +
              Math.floor(
                  (days - 186) / 30
              );


    const jd =
        1 +
        (
            days < 186
                ? days % 31
                : (days - 186) % 30
        );


    return {

        jy,
        jm,
        jd

    };

}


function jalaliToGregorian(
    jy,
    jm,
    jd
){

    jy =
        Number(jy);

    jm =
        Number(jm);

    jd =
        Number(jd);


    let gy;


    if(jy > 979){

        gy = 1600;

        jy -= 979;

    }

    else{

        gy = 621;

    }


    let days =
        365 * jy
        +
        Math.floor(
            jy / 33
        ) * 8
        +
        Math.floor(
            (
                jy % 33
                + 3
            ) / 4
        )
        +
        78
        +
        jd
        +
        (
            jm < 7
                ? (jm - 1) * 31
                : (jm - 7) * 30 + 186
        );


    gy +=
        400 *
        Math.floor(
            days / 146097
        );


    days %=
        146097;


    if(days > 36524){

        gy +=
            100 *
            Math.floor(
                --days / 36524
            );


        days %=
            36524;


        if(days >= 365){

            days++;

        }

    }


    gy +=
        4 *
        Math.floor(
            days / 1461
        );


    days %=
        1461;


    if(days > 365){

        gy +=
            Math.floor(
                (days - 1) / 365
            );


        days =
            (days - 1) % 365;

    }


    let gd =
        days + 1;


    const leap =
        (
            gy % 4 === 0 &&
            gy % 100 !== 0
        )
        ||
        gy % 400 === 0;


    const monthDays = [

        0,

        31,

        leap ? 29 : 28,

        31,

        30,

        31,

        30,

        31,

        31,

        30,

        31,

        30,

        31

    ];


    let gm = 1;


    while(
        gd >
        monthDays[gm]
    ){

        gd -=
            monthDays[gm];

        gm++;

    }


    return {

        gy,
        gm,
        gd

    };

}

    .replace(
        /۳/g,
        "3"
    )
    .replace(
        /۴/g,
        "4"
    )
    .replace(
        /۵/g,
        "5"
    )
    .replace(
        /۶/g,
        "6"
    )
    .replace(
        /۷/g,
        "7"
    )
    .replace(
        /۸/g,
        "8"
    )
    .replace(
        /۹/g,
        "9"
    );

}


/*
 * برای Backend فعلی:
 * تاریخ را به YYYY-MM-DD می‌فرستیم.
 */

function jalaliDisplayToApi(
    value
){

    value =
        normalizeDateDigits(
            value
        ).replace(
            /\//g,
            "-"
        );


    if(
        !/^\d{4}-\d{1,2}-\d{1,2}$/.test(
            value
        )
    ){

        return "";

    }


    const parts =
        value.split("-")
            .map(Number);


    const g =
        jalaliToGregorian(
            parts[0],
            parts[1],
            parts[2]
        );


    return [
        g.gy,
        pad2(g.gm),
        pad2(g.gd)

    ].join("-");

}


function apiDateToJalali(
    value
){

    if(!value){

        return "";

    }


    const match =
        String(value)
            .match(
                /^(\d{4})-(\d{1,2})-(\d{1,2})/
            );


    if(!match){

        return String(value);

    }


    const g =
        gregorianToJalali(
            Number(match[1]),
            Number(match[2]),
            Number(match[3])
        );


    return [
        g.jy,
        pad2(g.jm),
        pad2(g.jd)

    ].join("/");

}

function setFieldError(
    form,
    fieldName,
    message
){

    const field =
        form.elements[fieldName];


    if(field){

        field.classList.add(
            "has-error"
        );

    }


    const error =
        form.querySelector(
            `[data-error-for="${fieldName}"]`
        );


    if(error){

        error.textContent =
            message;

    }

}


function requiredValue(
    form,
    fieldName,
    label
){

    const field =
        form.elements[fieldName];


    if(!field){

        return null;

    }


    const value =
        String(
            field.value ?? ""
        ).trim();


    if(!value){

        setFieldError(
            form,
            fieldName,
            `${label} الزامی است.`
        );


        return null;

    }


    return value;

}

   FORM VALUE
============================================================ */

function numericValue(
    form,
    fieldName
){

    const field =
        form.elements[fieldName];


    if(!field){

        return 0;

    }


    return toNumber(
        field.value
    );

}


function selectNumericValue(
    form,
    fieldName
){

    const field =
        form.elements[fieldName];


    if(
        !field ||
        !field.value
    ){

        return null;

    }


    const value =
        Number(field.value);


    return Number.isFinite(value)
        ? value
        : null;

}


/* ============================================================
   DATE VALUE
============================================================ */

function dateValue(
    form,
    fieldName,
    required = false
){

    const field =
        form.elements[fieldName];


    if(!field){

        return null;

    }


    const value =
        field.value.trim();


    if(
        required &&
        !value
    ){

        setFieldError(
            form,
            fieldName,
            "تاریخ الزامی است."
        );


        return null;

    }


    if(!value){

        return null;

    }


    const apiDate =
        jalaliDisplayToApi(
            value
        );


    if(!apiDate){

        setFieldError(
            form,
            fieldName,
            "تاریخ واردشده معتبر نیست."
        );


        return null;

    }


    return apiDate;

}


/* ============================================================
   FORM DATA OBJECT
============================================================ */

function formObject(
    form
){

    const result = {};


    Array.from(
        form.elements
    ).forEach(
        element => {

            if(
                !element.name ||
                element.disabled
            ){

                return;

            }


            if(
                element.type ===
                "checkbox"
            ){

                result[
                    element.name
                ] =
                    element.checked;

            }

            else if(
                element.type ===
                "radio"
            ){

                if(element.checked){

                    result[
                        element.name
                    ] =
                        element.value;

                }

            }

            else{

                result[
                    element.name
                ] =
                    element.value;

            }

        }
    );


    return result;

}

/* ============================================================
   TABLE BUILDER
============================================================ */

function buildTable(
    columns,
    rows,
    options = {}
){

    if(!rows.length){

        return emptyState(
            options.empty ||
            "اطلاعاتی ثبت نشده است."
        );

    }


    let html = `

        <div class="table-container">

            <table class="data-table">

                <thead>

                    <tr>

    `;


    columns.forEach(
        column => {

            html += `
                <th>
                    ${escapeHtml(
                        column.label
                    )}
                </th>
            `;

        }
    );


    if(options.actions){

        html += `
            <th>
                عملیات
            </th>
        `;

    }


    html += `

                    </tr>

                </thead>

                <tbody>

    `;


    rows.forEach(
        row => {

            html += "<tr>";


            columns.forEach(
                column => {

                    let value;


                    if(
                        typeof column.value ===
                        "function"
                    ){

                        value =
                            column.value(row);

                    }

                    else{

                        value =
                            row[
                                column.value
                            ];

                    }


                    if(
                        column.type ===
                        "number"
                    ){

                        value =
                            formatNumber(
                                value
                            );

                    }


                    if(
                        column.type ===
                        "date"
                    ){

                        value =
                            apiDateToJalali(
                                value
                            );

                    }


                    if(
                        column.type ===
                        "badge"
                    ){

                        value =
                            statusBadge(
                                value
                            );

                    }


                    html += `
                        <td>
                            ${
                                column.raw
                                    ? String(
                                        value ?? ""
                                      )
                                    : escapeHtml(
                                        value ??
                                        "-"
                                      )
                            }
                        </td>
                    `;

                }
            );


            if(options.actions){

                html += `

                    <td>

                        <div class="toolbar">

                            <button
                                type="button"
                                class="btn small secondary"
                                data-action="edit"
                                data-id="${row.id}"
                            >
                                ویرایش
                            </button>

                            <button
                                type="button"
                                class="btn small danger"
                                data-action="delete"
                                data-id="${row.id}"
                            >
                                حذف
                            </button>

                        </div>

                    </td>

                `;

            }


            html += "</tr>";

        }
    );


    html += `

                </tbody>

            </table>

        </div>

    `;


    return html;

}


/* ============================================================
   STATUS BADGE
============================================================ */

function statusBadge(
    status
){

    const value =
        String(
            status ||
            ""
        );


    let type =
        "info";


    if(
        /فعال|active|completed|complete|done|approved/i
            .test(value)
    ){

        type =
            "success";

    }

    else if(
        /غیرفعال|inactive|cancel|rejected|error/i
            .test(value)
    ){

        type =
            "danger";

    }

    else if(
        /pending|در انتظار|draft|پیش‌نویس/i
            .test(value)
    ){

        type =
            "warning";

    }


    return `

        <span class="badge ${type}">

            ${escapeHtml(
                value || "-"
            )}

        </span>

    `;

}

/* ============================================================
   DELETE ENTITY
============================================================ */

async function deleteEntity(
    entityName,
    id
){

    const config =
        ENTITY_CONFIG[
            entityName
        ];


    if(!config){

        return;

    }


    const item =
        STATE[
            entityName
        ].find(
            x =>
                Number(x.id) ===
                Number(id)
        );


    const name =
        item?.name ||
        item?.code ||
        id;


    if(
        !window.confirm(
            `آیا از حذف «${name}» اطمینان دارید؟`
        )
    ){

        return;

    }


    try{

        await apiRequest(
            `${config.endpoint}/${encodeURIComponent(id)}`,
            {

                method:"DELETE",

                loadingText:
                    "در حال حذف اطلاعات..."

            }
        );


        showMessage(
            "اطلاعات با موفقیت حذف شد.",
            "success"
        );


        await loadCollection(
            entityName,
            config.endpoint,
            config.title
        );


        await openView(
            entityName
        );

    }

    catch(error){

        showMessage(
            error.message ||
            "حذف اطلاعات انجام نشد.",
            "error"
        );

    }

}

async function submitBomForm(
    event,
    editing
){

    event.preventDefault();


    const form =
        event.currentTarget;


    clearFormErrors(form);


    const code =
        requiredValue(
            form,
            "code",
            "کد BOM"
        );


    const productId =
        selectNumericValue(
            form,
            "product_id"
        );


    if(!productId){

        setFieldError(
            form,
            "product_id",
            "محصول را انتخاب کنید."
        );

    }


    if(
        !code ||
        !productId
    ){

        return;

    }


    const effectiveFrom =
        dateValue(
            form,
            "effective_from"
        );


    const effectiveTo =
        dateValue(
            form,
            "effective_to"
        );


    const data = {

        code,

        product_id:
            productId,

        version:
            Math.max(
                1,
                Math.floor(
                    numericValue(
                        form,
                        "version"
                    ) || 1
                )
            ),

        effective_from:
            effectiveFrom,

        effective_to:
            effectiveTo

    };


    try{

        const result =
            await apiRequest(
                editing
                    ? `/api/boms/${encodeURIComponent(form.id.value)}`
                    : "/api/boms",
                {

                    method:
                        editing
                            ? "PUT"
                            : "POST",

                    body:data,

                    loadingText:
                        editing
                            ? "در حال ویرایش BOM..."
                            : "در حال ایجاد BOM..."

                }
            );


        showMessage(
            result.message ||
            "BOM با موفقیت ذخیره شد."
        );


        closeModal();


        await loadCollection(
            "boms",
            "/api/boms",
            "BOMها"
        );


        refreshAllDropdowns();


        renderBomsView();

    }

    catch(error){

        showMessage(
            error.message,
            "error"
        );

    }

}

/* ============================================================
   SUBMIT BOM DETAIL
============================================================ */

async function submitBomDetailForm(event) {

    event.preventDefault();

    const form =
        event.currentTarget;

    clearFormErrors(form);


    /* ---------------------------------------------------------
       BOM
    --------------------------------------------------------- */

    const bomId =
        Number(
            form.elements.bom_id.value
        );


    /* ---------------------------------------------------------
       PART
    --------------------------------------------------------- */

    const partId =
        selectNumericValue(
            form,
            "part_id"
        );


    if (!bomId) {

        showMessage(
            "BOM معتبر انتخاب نشده است.",
            "error"
        );

        return;
    }


    if (!partId) {

        setFieldError(
            form,
            "part_id",
            "قطعه را انتخاب کنید."
        );

    }


    /* ---------------------------------------------------------
       CONSUMPTION FACTOR
    --------------------------------------------------------- */

    const factor =
        numericValue(
            form,
            "consumption_factor"
        );


    if (factor <= 0) {

        setFieldError(
            form,
            "consumption_factor",
            "ضریب مصرف باید بیشتر از صفر باشد."
        );

    }


    if (
        !partId ||
        factor <= 0
    ) {

        return;
    }


    /* ---------------------------------------------------------
       SCRAP
    --------------------------------------------------------- */

    const scrap =
        Math.max(
            0,
            Math.min(
                100,
                numericValue(
                    form,
                    "scrap_percent"
                )
            )
        );


    /* ---------------------------------------------------------
       API
    --------------------------------------------------------- */

    try {

        const result =
            await apiRequest(
                "/api/bom-details",
                {

                    method: "POST",

                    body: {

                        bom_id:
                            bomId,

                        part_id:
                            partId,

                        consumption_factor:
                            factor,

                        scrap_percent:
                            scrap

                    },

                    loadingText:
                        "در حال افزودن قطعه به BOM..."

                }
            );


        showMessage(
            result?.message ||
            "جزء BOM با موفقیت ثبت شد."
        );


        closeModal();


        await loadBomDetails(
            bomId
        );

    }
    catch (error) {

        showMessage(
            error.message ||
            "ثبت جزء BOM انجام نشد.",
            "error"
        );

    }

}

============================================================ */

async function submitProductionForm(
    event
){

    event.preventDefault();


    const form =
        event.currentTarget;


    clearFormErrors(form);


    const planningId =
        selectNumericValue(
            form,
            "planning_daily_id"
        );


    const quantity =
        numericValue(
            form,
            "produced_quantity"
        );


    const productionDate =
        dateValue(
            form,
            "production_date",
            true
        );


    if(!planningId){

        setFieldError(
            form,
            "planning_daily_id",
            "برنامه تولید را انتخاب کنید."
        );

    }


    if(quantity <= 0){

        setFieldError(
            form,
            "produced_quantity",
            "مقدار تولید باید بیشتر از صفر باشد."
        );

    }


    if(
        !planningId ||
        quantity <= 0 ||
        !productionDate
    ){

        return;

    }


    const warehouseId =
        selectNumericValue(
            form,
            "warehouse_id"
        );


    try{

        const result =
            await apiRequest(
                "/api/production",
                {

                    method:"POST",

                    body:{

                        planning_daily_id:
                            planningId,

                        produced_quantity:
                            quantity,

                        production_date:
                            productionDate,

                        warehouse_id:
                            warehouseId

                    },

                    loadingText:
                        "در حال ثبت تولید و بروزرسانی موجودی..."

                }
            );


        showMessage(
            result.message ||
            "تولید با موفقیت ثبت شد."
        );


        closeModal();


        await Promise.all([

            loadCollection(
                "planning",
                "/api/planning",
                "برنامه تولید"
            ),

            loadCollection(
                "production",
                "/api/production",
                "سوابق تولید"
            ),

            loadCollection(
                "inventory",
                "/api/inventory",
                "موجودی انبار"
            )

        ]);


        refreshAllDropdowns();


        renderProductionView();

    }

    catch(error){

        showMessage(
            error.message,
            "error"
        );

    }

}

/* ============================================================
   INVENTORY MOVEMENT SUBMIT
============================================================ */

async function submitInventoryMovement(
    event,
    type
){

    event.preventDefault();


    const form =
        event.currentTarget;


    clearFormErrors(form);


    const warehouseId =
        selectNumericValue(
            form,
            "warehouse_id"
        );


    const partId =
        selectNumericValue(
            form,
            "part_id"
        );


    const quantity =
        numericValue(
            form,
            "quantity"
        );


    if(!warehouseId){

        setFieldError(
            form,
            "warehouse_id",
            "انبار را انتخاب کنید."
        );

    }


    if(!partId){

        setFieldError(
            form,
            "part_id",
            "قطعه را انتخاب کنید."
        );

    }


    if(quantity <= 0){

        setFieldError(
            form,
            "quantity",
            "مقدار باید بیشتر از صفر باشد."
        );

    }


    if(
        !warehouseId ||
        !partId ||
        quantity <= 0
    ){

        return;

    }


    const endpoint =
        type === "receipt"
            ? "/api/inventory/receipt"
            : "/api/inventory/issue";


    try{

        const result =
            await apiRequest(
                endpoint,
                {

                    method:"POST",

                    body:{

                        warehouse_id:
                            warehouseId,

                        part_id:
                            partId,

                        quantity,

                        reference_type:
                            "manual",

                        description:
                            form.description.value
                                .trim() ||
                            (
                                type ===
                                "receipt"
                                    ? "ورود مواد اولیه"
                                    : "خروج مواد اولیه"
                            )

                    },

                    loadingText:
                        type === "receipt"
                            ? "در حال ثبت ورود موجودی..."
                            : "در حال ثبت خروج موجودی..."

                }
            );


        showMessage(
            result.message ||
            (
                type === "receipt"
                    ? "ورود موجودی ثبت شد."
                    : "خروج موجودی ثبت شد."
            )
        );


        closeModal();


        await loadCollection(
            "inventory",
            "/api/inventory",
            "موجودی انبار"
        );


        renderInventoryView();

    }

    catch(error){

        showMessage(
            error.message,
            "error"
        );

    }

}

function renderBarcodeView(){

    $("#mainContent").innerHTML = `

        ${pageHeader(
            "جستجوی بارکد",
            "جستجوی مستقیم قطعه از Worker"
        )}


        <section class="card">

            <div class="card-header">

                <h2 class="card-title">
                    جستجوی قطعه
                </h2>

            </div>


            <div class="card-body">

                <div class="barcode-row">

                    <input
                        type="text"
                        id="barcodeInput"
                        class="form-control"
                        inputmode="numeric"
                        autocomplete="off"
                        placeholder="بارکد را وارد یا اسکن کنید"
                    >


                    <button
                        type="button"
                        class="btn"
                        id="barcodeSearchButton"
                    >
                        جستجو
                    </button>

                </div>


                <div
                    class="barcode-result"
                    id="barcodeResult"
                >

                    ${emptyState(
                        "هنوز جستجویی انجام نشده است."
                    )}

                </div>

            </div>

        </section>

    `;


    const input =
        $("#barcodeInput");


    const button =
        $("#barcodeSearchButton");


    async function search(){

        const barcode =
            input.value.trim();


        if(!barcode){

            showMessage(
                "بارکد را وارد یا اسکن کنید.",
                "warning"
            );


            input.focus();


            return;

        }


        try{

            const data =
                await apiRequest(
                    "/api/parts/barcode?barcode=" +
                    encodeURIComponent(
                        barcode
                    ),
                    {

                        loadingText:
                            "در حال جستجوی بارکد..."

                    }
                );


            const part =
                data.item;


            if(!part){

                $("#barcodeResult")
                    .innerHTML =
                        emptyState(
                            "قطعه‌ای با این بارکد پیدا نشد."
                        );


                return;

            }


            $("#barcodeResult")
                .innerHTML = `

                    <div class="success-box">

                        <strong>
                            ${escapeHtml(
                                part.name
                            )}
                        </strong>

                        <div style="margin-top:8px">

                            کد قطعه:
                            ${escapeHtml(
                                part.code
                            )}

                        </div>


                        <div style="margin-top:5px">

                            واحد:
                            ${escapeHtml(
                                part.unit_name
                            )}

                        </div>


                        <div style="margin-top:5px">

                            بارکد:
                            ${escapeHtml(
                                part.barcode
                            )}

                        </div>


                        ${
                            part.min_stock !==
                            undefined
                                ? `
                                    <div style="margin-top:5px">
                                        حداقل موجودی:
                                        ${formatNumber(
                                            part.min_stock
                                        )}
                                    </div>
                                  `
                                : ""
                        }


                        ${
                            part.reorder_point !==
                            undefined
                                ? `
                                    <div style="margin-top:5px">
                                        نقطه سفارش:
                                        ${formatNumber(
                                            part.reorder_point
                                        )}
                                    </div>
                                  `
                                : ""
                        }

                    </div>

                `;

        }

        catch(error){

            $("#barcodeResult")
                .innerHTML = `

                    <div class="error-box">

                        ${escapeHtml(
                            error.message
                        )}

                    </div>

                `;

        }

    }


    button.addEventListener(
        "click",
        search
    );


    input.addEventListener(
        "keydown",
        event => {

            if(
                event.key ===
                "Enter"
            ){

                event.preventDefault();

                search();

            }

        }
    );


    /*
     * Barcode Scannerهای سخت‌افزاری معمولاً
     * Enter را بعد از Scan ارسال می‌کنند.
     */


    input.focus();

}

async function refreshEntity(
    entityName
){

    const config =
        ENTITY_CONFIG[
            entityName
        ];


    if(!config){

        return;

    }


    await loadCollection(
        entityName,
        config.endpoint,
        config.title
    );


    refreshAllDropdowns();


    await renderEntityView(

    );

/* ============================================================
   VIEW ROUTER
============================================================ */

async function openView(
    view
){

    STATE.currentView =
        view;


    $$(".nav-button")
        .forEach(
            button => {

                button.classList.toggle(
                    "active",
                    button.dataset.view ===
                    view
                );

            }
        );


    switch(view){

        case "dashboard":

            renderDashboard();

            break;


        case "units":

            await renderEntityView(
                "units"
            );

            break;


        case "products":

            await renderEntityView(
                "products"
            );

            break;


        case "parts":

            await renderEntityView(
                "parts"
            );

            break;


        case "warehouses":

            await renderEntityView(
                "warehouses"
            );

            break;


        case "boms":

            await renderBomsView();

            break;


        case "planning":

            renderPlanningView();

            break;


        case "production":

            renderProductionView();

            break;


        case "inventory":

            renderInventoryView();

            break;


        case "barcode":

            renderBarcodeView();

            break;


        default:

            renderDashboard();

    }

}

function initializeNavigation(){

    $$(".nav-button")

                        if(!view){

                        }


                        try{

                                view
                            );

                        }

                        catch(error){

                            );


                            showMessage(
                                "بارگذاری این بخش با خطا مواجه شد.",
                                "error"
                            );

                    }
                );

            }
        );

}


/* ============================================================
   LOGOUT
============================================================ */

async function logoutUser(){

    const confirmed =
        window.confirm(
            "آیا می‌خواهید از سامانه خارج شوید؟"
        );


    if(!confirmed){

        return;

    }


    try{

        if(
            STATE.token ||
            readToken()
        ){

            await apiRequest(
                "/api/logout",
                {

                    method:"POST",

                    loadingText:
                        "در حال خروج از سامانه...",

                    skipAuthRedirect:true

                }
            );

        }

    }

    catch(error){

        /*
         * Logout محلی حتی اگر Worker
         * در دسترس نباشد باید انجام شود.
         */

        console.warn(
            "LOGOUT:",
            error
        );

    }

    finally{

        clearAuthentication();


        window.location.href =
            CONFIG.LOGIN_PAGE;

    }

}


/* ============================================================
   AUTH CHECK
============================================================ */

function requireAuthentication(){

    const token =
        STATE.token ||
        readToken();


    if(!token){

        window.location.replace(
            CONFIG.LOGIN_PAGE
        );


        return false;

    }


    STATE.token =
        token;


    return true;

}

/* ============================================================
   CONNECTION STATUS
============================================================ */

function setConnectionStatus(
    connected,
    text = null
){

    const element =
        $("#connectionStatus");


    if(!element){

        return;

    }


    element.classList.toggle(
        "bad",
        !connected
    );


    element.textContent =
        text ||
        (
            connected
                ? "اتصال به Worker موفق"
                : "اتصال ناموفق"
        );

}


/* ============================================================
   INITIALIZE APPLICATION
============================================================ */

async function initializeApplication(){

    /*
     * اول Theme و UI آماده است.
     * سپس Authentication.
     * بعد API.
     * بنابراین خطای API باعث سفید شدن صفحه نمی‌شود.
     */

    applyTheme();


    if(
        !requireAuthentication()
    ){

        return;

    }


    initializeNavigation();


    $("#themeButton")
        .addEventListener(
            "click",
            toggleTheme
        );


    $("#logoutButton")
        .addEventListener(
            "click",
            logoutUser
        );


    try{

        setConnectionStatus(
            false,
            "در حال اتصال..."
        );


        await loadCurrentUser();


        const results =
            await loadAllData();


        const failed =
            results.filter(
                result =>
                    !result.ok
            );


        refreshAllDropdowns();


        if(failed.length){

            setConnectionStatus(
                false,
                `${failed.length} سرویس نیاز به بررسی دارد`
            );


            /*
             * مهم:
             * اینجا برنامه را متوقف نمی‌کنیم.
             * داشبورد با داده‌های موجود باز می‌شود.
             */

            showMessage(
                `${failed.length} بخش با خطا مواجه شد. بخش‌های دیگر قابل استفاده هستند.`,
                "warning"
            );

        }

        else{

            setConnectionStatus(
                true,
                "اتصال به Worker موفق"
            );

        }


        await openView(
            "dashboard"
        );

    }

    catch(error){

        console.error(
            "APPLICATION STARTUP ERROR",
            error
        );


        renderStartupError(
            error
        );

    }

    finally{

        /*
         * اگر به هر دلیلی loader باز مانده باشد،
         * اینجا بسته می‌شود.
         */

        STATE.loadingCount =
            0;


        $("#globalLoader")
            .classList.remove(
                "show"
            );

    }

}


/* ============================================================
   GLOBAL ERROR PROTECTION
============================================================ */

window.addEventListener(
    "error",
    event => {

        console.error(
            "GLOBAL ERROR:",
            event.error ||
            event.message
        );


        STATE.loadingCount =
            0;


        $("#globalLoader")
            ?.classList.remove(
                "show"
            );

    }
);


window.addEventListener(
    "unhandledrejection",
    event => {

        console.error(
            "UNHANDLED PROMISE:",
            event.reason
        );


        STATE.loadingCount =
            0;


        $("#globalLoader")
            ?.classList.remove(
                "show"
            );

    }
);


/* ============================================================
   MODAL EVENTS
============================================================ */

$("#modalClose")
    .addEventListener(
        "click",
        closeModal
    );


$("#appModal")
    .addEventListener(
        "click",
        event => {

            if(
                event.target ===
                $("#appModal")
            ){

                closeModal();

            }

        }
    );


document.addEventListener(
    "keydown",
    event => {

        if(
            event.key ===
            "Escape"
        ){

            closeModal();

        }

    }
);


/* ============================================================
   DOM READY
============================================================ */

if(
    document.readyState ===
    "loading"
){

    document.addEventListener(
        "DOMContentLoaded",
        initializeApplication,
        {
            once:true
        }
    );

}

else{

    initializeApplication();

}

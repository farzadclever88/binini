<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2563eb"><title>سامانه نی‌نی‌تو</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#64748b;--border:#e2e8f0;--p:#2563eb;--ok:#16a34a;--bad:#dc2626;--shadow:0 8px 28px #0f172a12}
:root[data-theme=dark]{--bg:#0f172a;--card:#1e293b;--text:#f8fafc;--muted:#94a3b8;--border:#334155;--shadow:0 8px 28px #0005}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}
.header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--border)}.headerin{max-width:1500px;margin:auto;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:12px;background:var(--p);color:white;display:grid;place-items:center;font-weight:900}.sub{font-size:11px;color:var(--muted);margin-top:3px}
.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.user{padding:8px 10px;border:1px solid var(--border);background:var(--bg);border-radius:9px;font-size:12px}
.layout{max-width:1500px;margin:auto;padding:18px;display:grid;grid-template-columns:235px 1fr;gap:18px}.side{position:sticky;top:78px;align-self:start;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:9px;box-shadow:var(--shadow)}.side-title{font-size:11px;color:var(--muted);padding:8px}
.nav{display:block;width:100%;border:0;background:transparent;color:var(--text);text-align:right;padding:10px;border-radius:9px;margin:2px 0}.nav:hover,.nav.active{background:#2563eb18;color:var(--p);font-weight:bold}
.head{display:flex;justify-content:space-between;gap:12px;margin-bottom:15px}.head h1{margin:0;font-size:23px}.head p{margin:4px 0;color:var(--muted);font-size:13px}.status{padding:6px 10px;border-radius:99px;background:#16a34a18;color:var(--ok);font-size:12px;font-weight:bold}.status.bad{background:#dc262618;color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:15px}.stat,.card{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}.stat{padding:15px}.stat small{color:var(--muted)}.stat b{display:block;font-size:25px;margin-top:4px}.card{overflow:hidden;margin-bottom:15px}.cardhead{padding:13px 15px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}.cardhead h2{margin:0;font-size:16px}.body{padding:15px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;font-weight:bold}.field label span{color:var(--bad)}.field input,.field select,.field textarea,.search input{width:100%;padding:10px;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--text);outline:0}.field textarea{min-height:80px;resize:vertical}.formactions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{border:0;border-radius:9px;padding:9px 13px;background:var(--p);color:#fff;cursor:pointer;font-weight:bold}.btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}.btn.danger{background:var(--bad)}
.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:9px 10px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap;font-size:12px}th{background:var(--bg);color:var(--muted);font-size:11px}.empty{text-align:center;padding:28px;color:var(--muted)}.note{padding:10px;border-radius:9px;background:var(--bg);border:1px solid var(--border);font-size:12px;color:var(--muted);margin-bottom:12px}.error{padding:12px;border-radius:10px;background:#dc262615;color:var(--bad);border:1px solid #dc262630}
.message{position:fixed;bottom:18px;left:18px;z-index:100;display:none;max-width:440px;padding:12px 15px;border-radius:11px;background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow)}.message.show{display:block}
.loader{position:fixed;inset:0;z-index:90;background:#0004;display:none;place-items:center}.loader.show{display:grid}.loaderbox{background:var(--card);padding:25px 32px;border-radius:15px;text-align:center}.spin{width:34px;height:34px;border:4px solid var(--border);border-top-color:var(--p);border-radius:50%;animation:s .8s linear infinite;margin:auto auto 10px}@keyframes s{to{transform:rotate(360deg)}}
@media(max-width:1050px){.stats{grid-template-columns:repeat(3,1fr)}.grid3{grid-template-columns:repeat(2,1fr)}}@media(max-width:850px){.layout{grid-template-columns:1fr}.side{position:static;display:flex;overflow:auto}.side-title{display:none}.nav{white-space:nowrap;width:auto}.grid2,.grid3{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.user{display:none}.head{flex-direction:column}}
</style>
</head>
<body>
<header class="header"><div class="headerin">
<div class="brand"><div class="logo">ن</div><div><b>سامانه نی‌نی‌تو</b><div class="sub">مدیریت تولید، BOM و انبار</div></div></div>
<div class="actions"><div class="user">کاربر: <b id="currentUser">...</b></div><button id="theme" class="btn secondary">تم شب</button><button id="logout" class="btn danger">خروج</button></div>
</div></header>

<div class="layout"><aside class="side">
<div class="side-title">منوی سامانه</div>
<button class="nav active" data-view="dashboard">داشبورد</button>
<button class="nav" data-view="units">واحدها</button>
<button class="nav" data-view="products">محصولات</button>
<button class="nav" data-view="parts">قطعات</button>
<button class="nav" data-view="warehouses">انبارها</button>
<button class="nav" data-view="boms">BOM</button>
<button class="nav" data-view="bomdetails">اجزای BOM</button>
<button class="nav" data-view="planning">برنامه تولید</button>
<button class="nav" data-view="production">ثبت تولید</button>
<button class="nav" data-view="inventory">موجودی</button>
<button class="nav" data-view="barcode">بارکد</button>
</aside><main id="main"></main></div>
<div id="message" class="message"></div><div id="loader" class="loader"><div class="loaderbox"><div class="spin"></div><div id="loaderText">در حال ارتباط...</div></div></div>

<script>
"use strict";
const CONFIG={API:"https://ninitoapp.farzadclever88.workers.dev",TOKEN_KEY:"ninito_token",THEME_KEY:"ninito_theme",LOGIN:"Login.html",TIMEOUT:20000};
const S={user:null,units:[],products:[],parts:[],warehouses:[],boms:[],bomdetails:[],planning:[],production:[],inventory:[],view:"dashboard"};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const faDate=v=>String(v??"-").replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
const n=v=>Number.isFinite(Number(v))?Number(v).toLocaleString("fa-IR"):esc(v??"-");
const token=()=>localStorage.getItem(CONFIG.TOKEN_KEY);
function msg(t,type="ok"){let x=$("#message");x.textContent=t;x.className="message show";x.style.borderRight="4px solid "+(type==="error"?"#dc2626":type==="warning"?"#d97706":"#16a34a");clearTimeout(x.tt);x.tt=setTimeout(()=>x.classList.remove("show"),4500)}
function load(on,t="در حال ارتباط..."){$("#loaderText").textContent=t;$("#loader").classList.toggle("show",on)}
function setTheme(){let d=localStorage.getItem(CONFIG.THEME_KEY)==="dark";document.documentElement.dataset.theme=d?"dark":"";$("#theme").textContent=d?"تم روز":"تم شب"}
function toggleTheme(){localStorage.setItem(CONFIG.THEME_KEY,localStorage.getItem(CONFIG.THEME_KEY)==="dark"?"light":"dark");setTheme()}
function clearAuth(){localStorage.removeItem(CONFIG.TOKEN_KEY);S.user=null}

async function api(path,o={}){
 const h={"Content-Type":"application/json",...(o.headers||{})},t=token();if(o.auth!==false&&t)h.Authorization="Bearer "+t;
 const c=new AbortController(),timer=setTimeout(()=>c.abort(),CONFIG.TIMEOUT);if(o.loadingText)load(true,o.loadingText);
 let r;try{r=await fetch(CONFIG.API+path,{method:o.method||"GET",headers:h,body:o.body==null?undefined:JSON.stringify(o.body),signal:c.signal,cache:"no-store"})}
 catch(e){clearTimeout(timer);load(false);throw{code:e.name==="AbortError"?"NET-002":"NET-001",message:e.name==="AbortError"?"زمان پاسخ Worker تمام شد.":"ارتباط با Worker برقرار نشد."}}
 clearTimeout(timer);load(false);let d;try{d=await r.json()}catch{throw{code:"API-JSON",message:"پاسخ Worker معتبر نیست."}}
 if(r.status===401){clearAuth();msg("نشست شما معتبر نیست.","error");setTimeout(()=>location.href=CONFIG.LOGIN,400);throw{code:"AUTH-401",message:"نشست معتبر نیست."}}
 if(!r.ok||d.success===false)throw{code:d?.error?.code||"HTTP-"+r.status,message:d?.error?.message||"عملیات انجام نشد."};
 return d
}
async function get(name,path,label){try{let d=await api(path,{loadingText:"در حال دریافت "+label+"..."});S[name]=Array.isArray(d.items)?d.items:[];return true}catch(e){console.error(path,e);S[name]=[];return false}}
async function user(){let d=await api("/api/me",{loadingText:"در حال بررسی کاربر..."});S.user=d.user||null;$("#currentUser").textContent=S.user?.full_name||S.user?.username||"کاربر"}
async function logout(){try{await api("/api/logout",{method:"POST",loadingText:"در حال خروج..."})}catch(e){}finally{clearAuth();location.href=CONFIG.LOGIN}}

function select(cls,items,ph="انتخاب کنید"){return `<select name="${cls}" class="${cls}" required><option value="">${ph}</option>${items.map(x=>`<option value="${x.id}">${esc(x.code||"")} - ${esc(x.name||x.product_name||"")}</option>`).join("")}</select>`}
function field(label,name,type="text",req=true,extra=""){return `<div class="field"><label>${label}${req?" <span>*</span>":""}</label><input name="${name}" type="${type}" ${req?"required":""} ${extra}></div>`}
function sel(label,name,cls,items,req=true){return `<div class="field"><label>${label}${req?" <span>*</span>":""}</label>${select(cls,items,"انتخاب کنید")}</div>`}
function btn(t="ثبت"){return `<div class="formactions"><button class="btn" type="submit">${t}</button><button class="btn secondary" type="reset">پاک کردن</button></div>`}
function tbl(cols,rows,empty="اطلاعاتی وجود ندارد."){if(!rows.length)return `<div class="empty">${empty}</div>`;return `<div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th>${c.l}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${typeof c.v==="function"?c.v(r):esc(r[c.v]??"-")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
function shell(title,sub,html){$("#main").innerHTML=`<section class="head"><div><h1>${title}</h1><p>${sub}</p></div></section><section class="card"><div class="cardhead"><h2>ورود اطلاعات</h2></div><div class="body">${html}</div></section>`}

async function post(path,data,text,reloads=[]){try{let d=await api(path,{method:"POST",body:data,loadingText:"در حال ثبت اطلاعات..."});msg(d.message||text);for(let x of reloads)await get(x[0],x[1],x[2]);return true}catch(e){msg(e.message||"خطا","error");return false}}

function units(){shell("واحدها","تعریف واحد سازمانی یا تولیدی",`<form id="f"><div class="grid2">${field("کد","code")} ${field("نام واحد","name")}</div>${btn("ثبت واحد")}</form>`);$("#f").onsubmit=async e=>{e.preventDefault();let f=e.currentTarget;if(await post("/api/units",{code:f.code.value.trim(),name:f.name.value.trim()},"واحد ثبت شد.",[["units","/api/units","واحدها"]]))units()}}
function products(){shell("محصولات","تعریف محصول و اتصال به واحد",`<form id="f"><div class="grid3">${field("کد محصول","code")}${field("نام محصول","name")}${sel("واحد","unit_id","unit-select",S.units)}</div>${btn("ثبت محصول")}</form>`);$("#f").onsubmit=async e=>{e.preventDefault();let f=e.currentTarget;if(await post("/api/products",{code:f.code.value.trim(),name:f.name.value.trim(),unit_id:Number(f.unit_id.value)},"محصول ثبت شد.",[["products","/api/products","محصولات"]]))products()}}
function parts(){shell("قطعات","تعریف قطعه، بارکد و حدود موجودی",`<form id="f"><div class="grid3">${field("کد قطعه","code")}${field("نام قطعه","name")}${sel("واحد","unit_id","unit-select",S.units)}${field("بارکد","barcode","text",false)}${field("حداقل موجودی","min_stock","number",false,'min="0" step="any" value="0"')}${field("نقطه سفارش","reorder_point","number",false,'min="0" step="any" value="0"')}</div>${btn("ثبت قطعه")}</form>`);$("#f").onsubmit=async e=>{e.preventDefault();let f=e.currentTarget;if(await post("/api/parts",{code:f.code.value.trim(),name:f.name.value.trim(),unit_id:Number(f.unit_id.value),barcode:f.barcode.value.trim(),min_stock:Number(f.min_stock.value||0),reorder_point:Number(f.reorder_point.value||0)},"قطعه ثبت شد.",[["parts","/api/parts","قطعات"]]))parts()}}
function warehouses(){shell("انبارها","تعریف انبار",`<form id="f"><div class="grid3">${field("کد انبار","code")}${field("نام انبار","name")}${field("نوع انبار","warehouse_type","text",false)}</div>${btn("ثبت انبار")}</form>`);$("#f").onsubmit=async e=>{e.preventDefault();let f=e.currentTarget;if(await post("/api/warehouses",{code:f.code.value.trim(),name:f.name.value.trim(),warehouse_type:f.warehouse_type.value.trim()},"انبار ثبت شد.",[["warehouses","/api/warehouses","انبارها"]]))warehouses()}}
function boms(){shell("BOM","ایجاد نسخه BOM برای محصول",`<form id="f"><div class="grid3">${field("کد BOM","code")}${sel("محصول","product_id","product-select",S.products)}${field("نسخه","version","number",true,'min="1" value="1"')}${field("شروع اعتبار","effective_from","date",false)}${field("پایان اعتبار","effective_to","date",false)}</div><div class="note">تاریخ به API به صورت میلادی YYYY-MM-DD ارسال می‌شود؛ نمایش جدول فارسی است.</div>${btn("ایجاد BOM")}</form>`);$("#f").onsubmit=async e=>{e.preventDefault();let f=e.currentTarget;if(await post("/api/boms",{code:f.code.value.trim(),product_id:Number(f.product_id.value),version:Number(f.version.value||1),effective_from:f.effective_from.value,effective_to:f.effective_to.value},"BOM ایجاد شد.",[["boms","/api/boms","BOM ها"]]))boms()}}
function bomdetails(){shell("اجزای BOM","افزودن قطعه به BOM",`<form id="f"><div class="grid3">${sel("BOM","bom_id","bom-select",S.boms)}${sel("قطعه","part_id","part-select",S.parts)}${field("ضریب مصرف","consumption_factor","number",true,'min="0" step="any" value="1"')}${field("ضایعات درصد","scrap_percent","number",false,'min="0" step="any" value="0"')}</div>${btn("افزودن جزء")}</form><div id="details" class="empty">BOM را انتخاب کنید.</div>`);let f=$("#f");f.bom_id.onchange=()=>details(f.bom_id.value);f.onsubmit=async e=>{e.preventDefault();if(await post("/api/bom-details",{bom_id:Number(f.bom_id.value),part_id:Number(f.part_id.value),consumption_factor:Number(f.consumption_factor.value),scrap_percent:Number(f.scrap_percent.value||0)},"جزء BOM ثبت شد."))details(f.bom_id.value)}}
async function details(id){if(!id)return;try{let d=await api("/api/bom-details?bom_id="+encodeURIComponent(id),{loadingText:"در حال دریافت اجزای BOM..."});S.bomdetails=d.items||[];$("#details").innerHTML=tbl([{l:"کد قطعه",v:"part_code"},{l:"قطعه",v:"part_name"},{l:"بارکد",v:"barcode"},{l:"واحد",v:"unit_name"},{l:"ضریب",v:r=>n(r.consumption_factor)},{l:"ضایعات",v:r=>n(r.scrap_percent)+" %"}],S.bomdetails,"جزئی ثبت نشده است.")}catch(e){msg(e.message,"error")}}
function planning(){shell("برنامه تولید","ثبت برنامه تولید روزانه",`<form id="f"><div class="grid3">${field("تاریخ برنامه","plan_date","date")}${sel("BOM","bom_id","bom-select",S.boms)}${field("مقدار برنامه","planned_quantity","number",true,'min="0" step="any"')}</div>${btn("ثبت برنامه")}</form>`);$("#f").onsubmit=async e=>{e.preventDefault();let f=e.currentTarget;if(await post("/api/planning",{plan_date:f.plan_date.value,bom_id:Number(f.bom_id.value),planned_quantity:Number(f.planned_quantity.value)},"برنامه ثبت شد.",[["planning","/api/planning","برنامه تولید"]]))planning()}}
function production(){shell("ثبت تولید","ثبت تولید بر اساس برنامه روزانه",`<form id="f"><div class="grid3">${sel("برنامه تولید","planning_daily_id","planning-select",S.planning)}${field("مقدار تولید","produced_quantity","number",true,'min="0" step="any"')}${field("تاریخ تولید","production_date","date")}${sel("انبار مقصد","warehouse_id","warehouse-select",S.warehouses,false)}</div>${btn("ثبت تولید")}</form>`);$("#f").onsubmit=async e=>{e.preventDefault();let f=e.currentTarget;if(await post("/api/production",{planning_daily_id:Number(f.planning_daily_id.value),produced_quantity:Number(f.produced_quantity.value),production_date:f.production_date.value,warehouse_id:f.warehouse_id.value?Number(f.warehouse_id.value):null},"تولید ثبت شد.",[["planning","/api/planning","برنامه"],["production","/api/production","تولید"],["inventory","/api/inventory","موجودی"]]))production()}}
function inventory(){shell("موجودی انبار","ورود و خروج دستی مواد اولیه",`<div class="grid2"><form id="r" class="card"><div class="cardhead"><h2>ورود موجودی</h2></div><div class="body"><div class="grid2">${sel("انبار","warehouse_id","warehouse-select",S.warehouses)}${sel("قطعه","part_id","part-select",S.parts)}${field("مقدار","quantity","number",true,'min="0" step="any"')}${field("شرح","description","text",false)}</div>${btn("ثبت ورود")}</div></form><form id="i" class="card"><div class="cardhead"><h2>خروج موجودی</h2></div><div class="body"><div class="grid2">${sel("انبار","warehouse_id","warehouse-select",S.warehouses)}${sel("قطعه","part_id","part-select",S.parts)}${field("مقدار","quantity","number",true,'min="0" step="any"')}${field("شرح","description","text",false)}</div>${btn("ثبت خروج")}</div></form></div>`);let go=async(f,type)=>{let d={warehouse_id:Number(f.warehouse_id.value),part_id:Number(f.part_id.value),quantity:Number(f.quantity.value),reference_type:"manual",description:f.description.value.trim()||(type==="receipt"?"ورود مواد اولیه":"خروج مواد اولیه")};if(await post(type==="receipt"?"/api/inventory/receipt":"/api/inventory/issue",d,type==="receipt"?"ورود ثبت شد.":"خروج ثبت شد.",[["inventory","/api/inventory","موجودی"]]))inventory()};$("#r").onsubmit=e=>{e.preventDefault();go(e.currentTarget,"receipt")};$("#i").onsubmit=e=>{e.preventDefault();go(e.currentTarget,"issue")}}
function barcode(){shell("جستجوی بارکد","یافتن قطعه از Worker",`<div class="search" style="display:flex;gap:8px"><input id="b" placeholder="بارکد را وارد یا اسکن کنید"><button id="bs" class="btn" type="button">جستجو</button></div><div id="br" class="empty">هنوز جستجویی انجام نشده است.</div>`);let run=async()=>{let b=$("#b").value.trim();if(!b)return msg("بارکد را وارد کنید.","warning");try{let d=await api("/api/parts/barcode?barcode="+encodeURIComponent(b),{loadingText:"در حال جستجوی بارکد..."}),x=d.item;$("#br").innerHTML=x?`<div class="note"><b>${esc(x.name)}</b><br>کد: ${esc(x.code)}<br>واحد: ${esc(x.unit_name)}<br>بارکد: ${esc(x.barcode)}</div>`:"<div class='empty'>قطعه‌ای پیدا نشد.</div>"}catch(e){msg(e.message,"error")}};$("#bs").onclick=run;$("#b").onkeydown=e=>{if(e.key==="Enter")run()}}

const V={units:["واحدها","units",[{l:"کد",v:"code"},{l:"نام",v:"name"},{l:"وضعیت",v:"status"}]],products:["محصولات","products",[{l:"کد",v:"code"},{l:"نام",v:"name"},{l:"واحد",v:"unit_name"},{l:"وضعیت",v:"status"}]],parts:["قطعات","parts",[{l:"کد",v:"code"},{l:"نام",v:"name"},{l:"واحد",v:"unit_name"},{l:"بارکد",v:"barcode"},{l:"حداقل",v:r=>n(r.min_stock)},{l:"نقطه سفارش",v:r=>n(r.reorder_point)}]],warehouses:["انبارها","warehouses",[{l:"کد",v:"code"},{l:"نام",v:"name"},{l:"نوع",v:"warehouse_type"},{l:"وضعیت",v:"status"}]],boms:["BOM ها","boms",[{l:"کد",v:"code"},{l:"محصول",v:"product_name"},{l:"نسخه",v:"version"},{l:"از",v:r=>faDate(r.effective_from)},{l:"تا",v:r=>faDate(r.effective_to)},{l:"وضعیت",v:"status"}]],planning:["برنامه تولید","planning",[{l:"تاریخ",v:r=>faDate(r.plan_date)},{l:"BOM",v:"bom_code"},{l:"محصول",v:"product_name"},{l:"برنامه",v:r=>n(r.planned_quantity)},{l:"تولید",v:r=>n(r.produced_quantity)},{l:"وضعیت",v:"status"}]],production:["سوابق تولید","production",[{l:"تاریخ",v:r=>faDate(r.production_date)},{l:"محصول",v:"product_name"},{l:"مقدار",v:r=>n(r.produced_quantity)},{l:"انبار",v:"warehouse_name"},{l:"وضعیت",v:"status"}]],inventory:["موجودی","inventory",[{l:"انبار",v:"warehouse_name"},{l:"نوع",v:"item_type"},{l:"شرح",v:"item_name"},{l:"مقدار",v:r=>n(r.quantity)},{l:"بروزرسانی",v:r=>faDate(r.updated_at)}]]};

function listView(v){let x=V[v],rows=S[x[1]]||[];$("#main").innerHTML=`<section class="head"><div><h1>${x[0]}</h1><p>اطلاعات مستقیم از Worker</p></div><span class="status">${n(rows.length)} رکورد</span></section><section class="card"><div class="cardhead"><h2>${x[0]}</h2></div>${tbl(x[2],rows)}</section>`}
function dashboard(){$("#main").innerHTML=`<section class="head"><div><h1>داشبورد</h1><p>نمای کلی سامانه نی‌نی‌تو</p></div><span class="status">متصل</span></section><section class="stats">${[["واحدها",S.units.length],["محصولات",S.products.length],["قطعات",S.parts.length],["BOM",S.boms.length],["موجودی",S.inventory.length]].map(x=>`<div class="stat"><small>${x[0]}</small><b>${n(x[1])}</b></div>`).join("")}</section><section class="card"><div class="cardhead"><h2>برنامه تولید</h2></div>${tbl(V.planning[2],S.planning)}</section><section class="card"><div class="cardhead"><h2>موجودی انبار</h2></div>${tbl(V.inventory[2],S.inventory)}</section>`}
async function open(v){S.view=v;$$(".nav").forEach(b=>b.classList.toggle("active",b.dataset.view===v));if(v==="dashboard")return dashboard();if(v==="barcode")return barcode();if(v==="units")return units();if(v==="products")return products();if(v==="parts")return parts();if(v==="warehouses")return warehouses();if(v==="boms")return boms();if(v==="bomdetails")return bomdetails();if(v==="planning")return planning();if(v==="production")return production();if(v==="inventory")return inventory();listView(v)}

async function start(){
 setTheme();if(!token()){location.href=CONFIG.LOGIN;return}
 $("#theme").onclick=toggleTheme;$("#logout").onclick=logout;$$(".nav").forEach(b=>b.onclick=()=>open(b.dataset.view));
 try{
  await user();
  const jobs=[["units","/api/units","واحدها"],["products","/api/products","محصولات"],["parts","/api/parts","قطعات"],["warehouses","/api/warehouses","انبارها"],["boms","/api/boms","BOM"],["planning","/api/planning","برنامه"],["production","/api/production","تولید"],["inventory","/api/inventory","موجودی"]];
  const r=await Promise.all(jobs.map(x=>get(...x)));if(r.some(x=>!x))msg("برخی سرویس‌ها پاسخ ندادند؛ سایر بخش‌ها فعال هستند.","warning");dashboard();
 }catch(e){$("#main").innerHTML=`<section class="head"><div><h1>خطا در اتصال</h1><p>Worker پاسخ معتبر نداد.</p></div></section><div class="error"><b>${esc(e.code||"ERROR")}</b><br>${esc(e.message||"خطای ناشناخته")}</div><button class="btn" onclick="start()">تلاش مجدد</button>`}finally{load(false)}
}
window.addEventListener("error",e=>{console.error(e);load(false)});window.addEventListener("unhandledrejection",e=>{console.error(e.reason);load(false)});
document.addEventListener("DOMContentLoaded",start);
</script>
</body></html>

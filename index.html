
<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>داشبورد | سامانه نی‌نی‌تو</title>

<style>
:root{
  --bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#64748b;
  --border:#e2e8f0;--primary:#2563eb;--primary2:#1d4ed8;
  --danger:#dc2626;--warning:#d97706;--ok:#16a34a;
  --shadow:0 8px 28px rgba(15,23,42,.07);--radius:15px;
}
:root[data-theme="dark"]{
  --bg:#0f172a;--card:#1e293b;--text:#f8fafc;--muted:#94a3b8;
  --border:#334155;--shadow:0 8px 28px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Tahoma,"Segoe UI",sans-serif;font-size:14px
}
button,input,select{font:inherit}
button{cursor:pointer}
.header{
  position:sticky;top:0;z-index:40;background:var(--card);
  border-bottom:1px solid var(--border)
}
.header-in{
  max-width:1500px;margin:auto;padding:12px 18px;
  display:flex;justify-content:space-between;align-items:center;gap:12px
}
.brand{display:flex;align-items:center;gap:10px}
.logo{
  width:43px;height:43px;border-radius:12px;background:var(--primary);
  color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px
}
.brand-title{font-weight:900}.sub{font-size:11px;color:var(--muted);margin-top:3px}
.actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.user{
  padding:8px 11px;background:var(--bg);border:1px solid var(--border);
  border-radius:9px;font-size:12px
}
.btn{
  border:0;border-radius:9px;padding:9px 13px;background:var(--primary);
  color:#fff;font-weight:700
}
.btn:hover{background:var(--primary2)}
.btn.secondary{
  background:var(--card);color:var(--text);border:1px solid var(--border)
}
.btn.danger{background:var(--danger)}
.btn.small{padding:7px 10px;font-size:12px}
.layout{
  max-width:1500px;margin:auto;padding:18px;
  display:grid;grid-template-columns:225px minmax(0,1fr);gap:18px
}
.side{
  position:sticky;top:78px;align-self:start;background:var(--card);
  border:1px solid var(--border);border-radius:var(--radius);
  padding:9px;box-shadow:var(--shadow)
}
.side-title{font-size:11px;color:var(--muted);padding:8px}
.nav{
  width:100%;border:0;background:transparent;color:var(--text);
  text-align:right;padding:10px;border-radius:9px;margin:1px 0
}
.nav:hover,.nav.active{background:#2563eb18;color:var(--primary);font-weight:700}
.head{
  display:flex;justify-content:space-between;align-items:flex-start;
  gap:12px;margin-bottom:15px
}
.head h1{margin:0;font-size:23px}.head p{margin:4px 0 0;color:var(--muted);font-size:12px}
.status{
  padding:7px 11px;border-radius:99px;background:#16a34a18;color:var(--ok);
  font-size:11px;font-weight:700;white-space:nowrap
}
.status.bad{background:#dc262618;color:var(--danger)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:15px}
.stat,.card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:var(--shadow)
}
.stat{padding:15px}.stat small{color:var(--muted)}.stat b{display:block;font-size:25px;margin-top:5px}
.card{overflow:hidden;margin-bottom:15px}
.card-head{
  padding:13px 15px;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;gap:10px
}
.card-head h2{margin:0;font-size:15px}
.body{padding:15px}
.toolbar{
  padding:12px 15px;border-bottom:1px solid var(--border);
  display:flex;gap:8px;align-items:center;flex-wrap:wrap
}
.search{display:flex;gap:7px;flex:1;min-width:220px}
.search input,.field input,.field select{
  width:100%;padding:9px 10px;border:1px solid var(--border);
  border-radius:9px;background:var(--bg);color:var(--text);outline:none
}
.search input:focus,.field input:focus,.field select:focus{border-color:var(--primary)}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:720px}
th,td{
  padding:9px 10px;border-bottom:1px solid var(--border);
  text-align:right;white-space:nowrap;font-size:12px
}
th{background:var(--bg);color:var(--muted);font-size:11px}
tr:hover td{background:#2563eb08}
.empty{text-align:center;padding:35px;color:var(--muted)}
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:12px;padding:15px
}
.entity-card{
  border:1px solid var(--border);border-radius:12px;padding:13px;background:var(--bg)
}
.entity-title{font-weight:800;margin-bottom:7px}.entity-meta{font-size:12px;color:var(--muted);line-height:1.9}
.badge{
  display:inline-block;padding:3px 7px;border-radius:99px;font-size:10px;
  background:#2563eb16;color:var(--primary)
}
.form-grid{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px
}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
.field.full{grid-column:1/-1}
.form-actions{display:flex;gap:7px;margin-top:12px}
.error{
  padding:13px;border-radius:10px;background:#dc262615;color:var(--danger);
  border:1px solid #dc262630;margin:12px 15px
}
.message{
  position:fixed;bottom:18px;left:18px;z-index:90;display:none;
  max-width:430px;padding:12px 15px;border-radius:11px;background:var(--card);
  border:1px solid var(--border);box-shadow:var(--shadow)
}
.message.show{display:block}.message.success{border-right:4px solid var(--ok)}
.message.warning{border-right:4px solid var(--warning)}
.message.error{border-right:4px solid var(--danger)}
.loader{
  position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.28);
  display:none;place-items:center
}
.loader.show{display:grid}
.loader-box{background:var(--card);padding:22px 30px;border-radius:15px;text-align:center;min-width:210px}
.spin{
  width:32px;height:32px;border:4px solid var(--border);border-top-color:var(--primary);
  border-radius:50%;animation:spin .8s linear infinite;margin:auto auto 10px
}
@keyframes spin{to{transform:rotate(360deg)}}
.modal{
  position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.35);
  display:none;place-items:center;padding:18px
}
.modal.show{display:grid}
.modal-box{
  width:min(760px,100%);max-height:90vh;overflow:auto;background:var(--card);
  border-radius:16px;border:1px solid var(--border);box-shadow:var(--shadow)
}
.modal-head{
  padding:13px 15px;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between
}
.modal-body{padding:15px}
.close{border:0;background:transparent;color:var(--muted);font-size:22px}
.footer{max-width:1500px;margin:auto;padding:0 18px 25px;color:var(--muted);font-size:11px}
.hidden{display:none!important}
@media(max-width:1100px){
  .stats{grid-template-columns:repeat(3,1fr)}
  .form-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:850px){
  .layout{grid-template-columns:1fr}
  .side{position:static;display:flex;overflow:auto;gap:3px}
  .side-title{display:none}.nav{white-space:nowrap;width:auto}
}
@media(max-width:600px){
  .header-in{align-items:flex-start}.sub{display:none}
  .head{flex-direction:column}.stats{grid-template-columns:repeat(2,1fr)}
  .form-grid{grid-template-columns:1fr}
  .form-actions{flex-wrap:wrap}
}
</style>

<!-- ============================================================
     JAVASCRIPT — فقط این بخش، در انتهای body
============================================================ -->
<script>
"use strict";

/* ============================================================
   CONFIGURATION
   مطابق Worker فعلی نی‌نی‌تو
============================================================ */
const CONFIG = Object.freeze({
  API_BASE_URL: "https://ninitoapp.farzadclever88.workers.dev",
  TOKEN_KEY: "ninito_token",
  THEME_KEY: "ninito_theme",
  REQUEST_TIMEOUT: 20000
});

/* ============================================================
   STATE
============================================================ */
const STATE = {
  user: null,
  units: [],
  products: [],
  parts: [],
  warehouses: [],
  boms: [],
  bomDetails: [],
  planning: [],
  production: [],
  inventory: [],
  view: "dashboard"
};

/* ============================================================
   DOM
============================================================ */
const $ = (selector, parent = document) => parent.querySelector(selector);
const $$ = (selector, parent = document) => [...parent.querySelectorAll(selector)];

/* ============================================================
   HELPERS
============================================================ */
function esc(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function numberFa(value){
  const n = Number(value);
  return Number.isFinite(n)
    ? n.toLocaleString("fa-IR")
    : esc(value ?? "-");
}

function dateFa(value){
  if(!value) return "-";

  const s = String(value);

  /* اگر Worker تاریخ ISO برگرداند */
  const d = new Date(s);

  if(!Number.isNaN(d.getTime()) && /T|\d{2}:\d{2}/.test(s)){
    return new Intl.DateTimeFormat("fa-IR",{
      year:"numeric",
      month:"2-digit",
      day:"2-digit",
      hour:"2-digit",
      minute:"2-digit"
    }).format(d);
  }

  /* تاریخ YYYY-MM-DD */
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(m){
    try{
      return new Intl.DateTimeFormat("fa-IR",{
        year:"numeric",month:"2-digit",day:"2-digit"
      }).format(new Date(
        Number(m[1]),Number(m[2])-1,Number(m[3])
      ));
    }catch{}
  }

  return esc(s);
}

function todayISO(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function getToken(){
  return localStorage.getItem(CONFIG.TOKEN_KEY);
}

function clearAuthentication(){
  localStorage.removeItem(CONFIG.TOKEN_KEY);
  STATE.user = null;
}

function showMessage(text,type="success"){
  const box = $("#message");
  if(!box) return;

  box.textContent = text || "پیام";
  box.className = "message show " + type;

  clearTimeout(box._timer);
  box._timer = setTimeout(()=>{
    box.classList.remove("show");
  },5000);
}

function setLoading(active,text="در حال ارتباط با سامانه..."){
  const loader = $("#loader");
  if(!loader) return;

  $("#loaderText").textContent = text;
  loader.classList.toggle("show",Boolean(active));
}

function setStatus(text,bad=false){
  const el = $("#status");
  if(!el) return;
  el.textContent = text;
  el.classList.toggle("bad",bad);
}

/* ============================================================
   THEME
============================================================ */
function applyTheme(){
  const theme = localStorage.getItem(CONFIG.THEME_KEY) || "light";

  if(theme === "dark"){
    document.documentElement.dataset.theme = "dark";
    $("#themeBtn").textContent = "تم روز";
  }else{
    delete document.documentElement.dataset.theme;
    $("#themeBtn").textContent = "تم شب";
  }
}

function toggleTheme(){
  const dark = document.documentElement.dataset.theme === "dark";

  if(dark){
    localStorage.setItem(CONFIG.THEME_KEY,"light");
  }else{
    localStorage.setItem(CONFIG.THEME_KEY,"dark");
  }

  applyTheme();
}

/* ============================================================
   API
   تنها تابع ارتباط با Worker
============================================================ */
async function apiRequest(path,options={}){
  const {
    method = "GET",
    body = null,
    auth = true,
    loadingText = "در حال ارتباط با سامانه..."
  } = options;

  const headers = {
    "Content-Type":"application/json",
    ...(options.headers || {})
  };

  const t = getToken();

  if(auth && t){
    headers.Authorization = "Bearer " + t;
  }

  const controller = new AbortController();

  const timeout = setTimeout(()=>{
    controller.abort();
  },CONFIG.REQUEST_TIMEOUT);

  setLoading(true,loadingText);

  try{
    let response;

    try{
      response = await fetch(
        CONFIG.API_BASE_URL + path,
        {
          method,
          headers,
          body: body === null
            ? undefined
            : JSON.stringify(body),
          signal: controller.signal,
          cache:"no-store"
        }
      );
    }catch(error){
      if(error?.name === "AbortError"){
        throw {
          code:"NET-002",
          message:"زمان پاسخ‌گویی Worker به پایان رسید."
        };
      }

      throw {
        code:"NET-001",
        message:"ارتباط با Worker برقرار نشد. آدرس Worker یا اتصال اینترنت را بررسی کنید."
      };
    }

    let data = null;

    try{
      data = await response.json();
    }catch{
      throw {
        code:"API-JSON",
        message:"پاسخ Worker قابل خواندن نیست."
      };
    }

    if(response.status === 401){
      clearAuthentication();

      throw {
        code:data?.error?.code || "AUTH-401",
        message:data?.error?.message || "نشست شما معتبر نیست.",
        status:401
      };
    }

    if(!response.ok){
      throw {
        code:data?.error?.code || `HTTP-${response.status}`,
        message:data?.error?.message || "عملیات در Worker انجام نشد.",
        details:data?.error?.details || null,
        status:response.status
      };
    }

    if(data?.success === false){
      throw {
        code:data?.error?.code || "API-ERROR",
        message:data?.error?.message || "عملیات انجام نشد.",
        details:data?.error?.details || null
      };
    }

    return data;

  }finally{
    clearTimeout(timeout);
    setLoading(false);
  }
}

/* ============================================================
   API WRAPPERS
============================================================ */
const apiGet = (path,options={}) =>
  apiRequest(path,{...options,method:"GET"});

const apiPost = (path,data,options={}) =>
  apiRequest(path,{...options,method:"POST",body:data});

const apiDelete = (path,options={}) =>
  apiRequest(path,{...options,method:"DELETE"});

/* ============================================================
   AUTH
============================================================ */
async function loadCurrentUser(){
  const t = getToken();

  if(!t){
    location.href = "Login.html";
    return null;
  }

  const data = await apiGet("/api/me",{
    loadingText:"در حال بررسی حساب کاربری..."
  });

  STATE.user = data?.data?.user || data?.user || null;

  if(!STATE.user){
    throw {
      code:"AUTH-USER",
      message:"اطلاعات کاربر از Worker دریافت نشد."
    };
  }

  $("#currentUser").textContent =
    STATE.user.full_name ||
    STATE.user.username ||
    "کاربر";

  return STATE.user;
}

async function logout(){
  try{
    await apiPost("/api/logout",null,{
      loadingText:"در حال خروج از سامانه..."
    });
  }catch(error){
    console.warn("LOGOUT",error);
  }finally{
    clearAuthentication();
    location.href = "Login.html";
  }
}

/* ============================================================
   DATA LOADERS
   هر Loader مستقل است تا خطای یک جدول مانع جدول‌های دیگر نشود.
============================================================ */
const DATASETS = {
  units:{
    path:"/api/units",
    label:"واحدها"
  },
  products:{
    path:"/api/products",
    label:"محصولات"
  },
  parts:{
    path:"/api/parts",
    label:"قطعات"
  },
  warehouses:{
    path:"/api/warehouses",
    label:"انبارها"
  },
  boms:{
    path:"/api/boms",
    label:"BOMها"
  },
  planning:{
    path:"/api/planning",
    label:"برنامه تولید"
  },
  production:{
    path:"/api/production",
    label:"سوابق تولید"
  },
  inventory:{
    path:"/api/inventory",
    label:"موجودی انبار"
  }
};

async function loadDataset(name){
  const cfg = DATASETS[name];

  if(!cfg) return {ok:false};

  try{
    const data = await apiGet(cfg.path,{
      loadingText:"در حال دریافت " + cfg.label + "..."
    });

    const items =
      data?.data?.items ||
      data?.items ||
      [];

    STATE[name] = Array.isArray(items) ? items : [];

    return {ok:true,items:STATE[name]};

  }catch(error){
    console.error("LOAD",name,error);
    return {ok:false,error};
  }
}

async function loadAllDatasets(){
  const names = Object.keys(DATASETS);
  const results = await Promise.all(
    names.map(name=>loadDataset(name))
  );

  return results;
}

/* ============================================================
   TABLE / GRID
============================================================ */
function renderTable(columns,rows,empty="اطلاعاتی وجود ندارد."){
  if(!rows.length){
    return `<div class="empty">${esc(empty)}</div>`;
  }

  return `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            ${columns.map(c=>`<th>${esc(c.label)}</th>`).join("")}
          </tr>
        </thead>
        <tbody>
          ${rows.map(row=>`
            <tr>
              ${columns.map(c=>{
                let value =
                  typeof c.value === "function"
                    ? c.value(row)
                    : row[c.value];

                return `<td>${value ?? "-"}</td>`;
              }).join("")}
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;
}

function renderGrid(rows,config){
  if(!rows.length){
    return `<div class="empty">${esc(config.empty || "اطلاعاتی وجود ندارد.")}</div>`;
  }

  return `
    <div class="grid">
      ${rows.map(row=>`
        <article class="entity-card">
          <div class="entity-title">
            ${esc(config.title(row))}
          </div>
          <div class="entity-meta">
            ${config.meta(row)}
          </div>
        </article>
      `).join("")}
    </div>
  `;
}

/* ============================================================
   VIEW CONFIGURATION
============================================================ */
const VIEWS = {
  units:{
    title:"واحدها",
    state:"units",
    path:"/api/units",
    cols:[
      {label:"کد",value:"code"},
      {label:"نام",value:"name"},
      {label:"وضعیت",value:"status"}
    ],
    grid:{
      title:r=>r.name || r.code || "واحد",
      meta:r=>`
        کد: ${esc(r.code || "-")}<br>
        وضعیت: ${esc(r.status || "-")}
      `
    }
  },

  products:{
    title:"محصولات",
    state:"products",
    path:"/api/products",
    cols:[
      {label:"کد",value:"code"},

/* ============================================================
   SEARCH + VIEW MODE
============================================================ */
const VIEW_MODE = {
  list:"list",
  grid:"grid"
};

function filterRows(rows,query){
  const q = String(query || "").trim().toLowerCase();

  if(!q) return rows;

  return rows.filter(row=>
    Object.values(row).some(value=>
      String(value ?? "").toLowerCase().includes(q)
    )
  );
}

function viewHeader(title,count){
  return `
    <section class="head">
      <div>
        <h1>${esc(title)}</h1>
        <p>اطلاعات دریافت‌شده مستقیم از Cloudflare Worker و D1</p>
      </div>
      <span class="status">${numberFa(count)} رکورد</span>
    </section>
  `;
}

function renderDataView(viewName,query=""){
  const cfg = VIEWS[viewName];
  if(!cfg) return;

  const rows = filterRows(STATE[cfg.state] || [],query);

  $("#main").innerHTML = `
    ${viewHeader(cfg.title,rows.length)}

    <section class="card">
      <div class="toolbar">
        <div class="search">
          <input
            id="viewSearch"
            type="search"
            placeholder="جستجو در ${esc(cfg.title)}..."
            value="${esc(query)}"
          >
          <button id="searchBtn" class="btn small" type="button">جستجو</button>
        </div>

        <button id="listModeBtn" class="btn secondary small" type="button">لیست</button>
        <button id="gridModeBtn" class="btn secondary small" type="button">کارت</button>
        <button id="refreshBtn" class="btn secondary small" type="button">بروزرسانی</button>
      </div>

      <div id="viewContent">
        ${STATE._mode === VIEW_MODE.grid
          ? renderGrid(rows,cfg.grid)
          : renderTable(cfg.cols,rows,`در ${cfg.title} اطلاعاتی وجود ندارد.`)
        }
      </div>
    </section>
  `;

  $("#searchBtn").onclick=()=>{
    renderDataView(viewName,$("#viewSearch").value);
  };

  $("#viewSearch").onkeydown=e=>{
    if(e.key==="Enter"){
      e.preventDefault();
      $("#searchBtn").click();
    }
  };

  $("#listModeBtn").onclick=()=>{
    STATE._mode=VIEW_MODE.list;
    renderDataView(viewName,$("#viewSearch").value);
  };

  $("#gridModeBtn").onclick=()=>{
    STATE._mode=VIEW_MODE.grid;
    renderDataView(viewName,$("#viewSearch").value);
  };

  $("#refreshBtn").onclick=async()=>{
    const result = await loadDataset(cfg.state);

    if(!result.ok){
      showMessage(
        result.error?.message || "بروزرسانی انجام نشد.",
        "error"
      );
      return;
    }

    renderDataView(viewName,$("#viewSearch").value);
    showMessage("اطلاعات با موفقیت بروزرسانی شد.","success");
  };
}

async function openBomDetails(bomId){
  try{
    const data = await apiGet(
      "/api/bom-details?bom_id="+encodeURIComponent(bomId),
      {loadingText:"در حال دریافت اجزای BOM..."}
    );

    STATE.bomDetails =
      data?.data?.items ||
      data?.items ||
      [];

    const bom = STATE.boms.find(x=>Number(x.id)===Number(bomId));

    $("#modalTitle").textContent =
      "اجزای BOM " + (bom?.code || bomId);

    $("#modalBody").innerHTML =
      renderTable([
        {label:"کد قطعه",value:"part_code"},
        {label:"قطعه",value:"part_name"},
        {label:"بارکد",value:"barcode"},
        {label:"واحد",value:"unit_name"},
        {label:"ضریب مصرف",value:r=>numberFa(r.consumption_factor)},
        {label:"ضایعات",value:r=>numberFa(r.scrap_percent)+" %"},
        {label:"وضعیت",value:"status"}
      ],STATE.bomDetails,"برای این BOM جزئی ثبت نشده است.");

    $("#modal").classList.add("show");

  }catch(error){
    showMessage(error.message || "دریافت اجزای BOM انجام نشد.","error");
  }
}

============================================================ */
function barcodeView(){
  $("#main").innerHTML = `
    ${viewHeader("جستجوی بارکد",0)}

    <section class="card">
      <div class="body">
        <div class="search">
          <input
            id="barcodeInput"
            type="search"
            inputmode="numeric"
            placeholder="بارکد قطعه را وارد یا اسکن کنید"
          >
          <button id="barcodeSearchBtn" class="btn" type="button">جستجو</button>
        </div>

        <div id="barcodeResult" class="empty">
          هنوز جستجویی انجام نشده است.
        </div>
      </div>
    </section>
  `;

  const run=async()=>{
    const barcode=$("#barcodeInput").value.trim();

    if(!barcode){
      showMessage("بارکد را وارد یا اسکن کنید.","warning");
      return;
    }

    try{
      const data=await apiGet(
        "/api/parts/barcode?barcode="+encodeURIComponent(barcode),
        {loadingText:"در حال جستجوی بارکد..."}
      );

      const part=data?.data?.item || data?.item;

      if(!part){
        $("#barcodeResult").innerHTML=
          `<div class="empty">قطعه‌ای با این بارکد پیدا نشد.</div>`;
        return;
      }

      $("#barcodeResult").innerHTML=`
        <div class="entity-card" style="margin-top:15px">
          <div class="entity-title">${esc(part.name || "قطعه")}</div>
          <div class="entity-meta">
            کد: ${esc(part.code || "-")}<br>
            واحد: ${esc(part.unit_name || "-")}<br>
            بارکد: ${esc(part.barcode || "-")}<br>
            حداقل موجودی: ${numberFa(part.min_stock)}<br>
            نقطه سفارش: ${numberFa(part.reorder_point)}
          </div>
        </div>
      `;

    }catch(error){
      $("#barcodeResult").innerHTML=
        `<div class="error">${esc(error.message || "خطا در جستجوی بارکد")}</div>`;
    }
  };

  $("#barcodeSearchBtn").onclick=run;
  $("#barcodeInput").onkeydown=e=>{
    if(e.key==="Enter"){
      e.preventDefault();
      run();
    }
  };
}

/* ============================================================
   FORM HELPERS
============================================================ */
function optionList(items,valueField,labelFunction){
  return items.map(item=>`
    <option value="${esc(item[valueField])}">
      ${esc(labelFunction(item))}
    </option>
  `).join("");
}

function selectHtml(id,items,valueField,labelFunction,placeholder){
  return `
    <select id="${id}">
      <option value="">${esc(placeholder || "انتخاب کنید")}</option>
      ${optionList(items,valueField,labelFunction)}
    </select>
  `;
}

        </div>
        <div id="detailsBox" style="margin-top:15px"></div>
      </div>
    </section>
  `;

  $("#bomDetailForm").onsubmit=async e=>{
    e.preventDefault();
    const f=e.currentTarget;

    try{
      const bomId=Number($("#detailBom").value);

      await apiPost("/api/bom-details",{
        bom_id:bomId,
        part_id:Number($("#detailPart").value),
        consumption_factor:Number(f.consumption_factor.value),
        scrap_percent:Number(f.scrap_percent.value||0)
      },{loadingText:"در حال افزودن قطعه به BOM..."});

      showMessage("جزء BOM با موفقیت ثبت شد.");
      f.reset();

      if(bomId){

async function loadDetailsInto(selector,bomId){
  try{
    const data=await apiGet(
      "/api/bom-details?bom_id="+encodeURIComponent(bomId),
      {loadingText:"در حال دریافت اجزای BOM..."}
    );

    STATE.bomDetails=data?.data?.items || data?.items || [];

    $(selector).innerHTML=renderTable([
      {label:"کد قطعه",value:"part_code"},
      {label:"قطعه",value:"part_name"},
      {label:"بارکد",value:"barcode"},
      {label:"واحد",value:"unit_name"},
      {label:"ضریب مصرف",value:r=>numberFa(r.consumption_factor)},
      {label:"ضایعات",value:r=>numberFa(r.scrap_percent)+" %"},
      {label:"وضعیت",value:"status"}
    ],STATE.bomDetails,"برای این BOM جزئی ثبت نشده است.");

  }catch(error){
    $(selector).innerHTML=`<div class="error">${esc(error.message)}</div>`;
  }
}

/* ============================================================
   ROUTING
============================================================ */
async function openView(name){
  STATE.view=name;

  $$(".nav").forEach(btn=>{
    btn.classList.toggle("active",btn.dataset.view===name);
  });

  if(name==="dashboard"){
    dashboardView();
    return;
  }

  if(name==="barcode"){
    barcodeView();
    return;
  }

  if(name==="boms"){
    renderBoms();
    return;
  }

  if(name==="units"){
    unitCreateView();
    return;
  }

  if(name==="products"){
    productCreateView();
    return;
  }

  if(name==="parts"){
    partCreateView();
    return;
  }

  if(name==="warehouses"){
    renderDataView("warehouses");
    return;
  }

  if(name==="planning"){
    planningCreateView();
    return;
  }

  if(name==="production"){
    productionCreateView();
    return;
  }

  if(name==="inventory"){
    inventoryView();
    return;
  }

  if(VIEWS[name]){
    renderDataView(name);
  }
}

/* ============================================================
   EVENTS
============================================================ */
function bindEvents(){
  $("#themeBtn").onclick=toggleTheme;
  $("#logoutBtn").onclick=logout;

  $$(".nav").forEach(btn=>{
    btn.onclick=()=>openView(btn.dataset.view);
  });

  $("#modalClose").onclick=()=>{
    $("#modal").classList.remove("show");
  };

  $("#modal").onclick=e=>{
    if(e.target.id==="modal"){
      $("#modal").classList.remove("show");
    }
  };
}

/* ============================================================
   STARTUP
   نکته مهم:
   - ابتدا DOM و CSS کامل آماده شده‌اند.
   - سپس JS اجرا می‌شود.
   - هیچ API قبل از این مرحله فراخوانی نمی‌شود.
   - APIها مستقل بارگذاری می‌شوند.
============================================================ */
async function initializeApplication(){
  applyTheme();
  bindEvents();

  if(!getToken()){
    location.href="Login.html";
    return;
  }

  try{
    await loadCurrentUser();

    /*
      Promise.all با Loaderهای مستقل:
      شکست یک endpoint باعث توقف دریافت endpointهای دیگر نمی‌شود.
    */
    const results=await loadAllDatasets();

    const failed=results.filter(r=>!r.ok);

    if(failed.length===0){
      setStatus("اتصال به Worker موفق");
    }else{
      setStatus(
        `${numberFa(failed.length)} سرویس دارای خطاست`,
        true
      );
    }

    await openView("dashboard");

    if(failed.length){
      showMessage(
        "اطلاعات برخی بخش‌ها دریافت نشد؛ از دکمه بروزرسانی همان بخش استفاده کنید.",
        "warning"
      );
    }

  }catch(error){
    console.error("NINI_TO_STARTUP_ERROR",error);

    setStatus("اتصال ناموفق",true);

    $("#main").innerHTML=`
      <section class="head">
        <div>
          <h1>خطا در اتصال</h1>
          <p>امکان دریافت اطلاعات سامانه از Worker وجود ندارد.</p>
        </div>
        <span class="status bad">اتصال ناموفق</span>
      </section>

      <div class="error">
        <b>${esc(error.code || "ERROR")}</b>
        <br>
        ${esc(error.message || "خطای ناشناخته")}
      </div>

      <button id="retryBtn" class="btn" type="button">
        تلاش مجدد
      </button>
    `;

    $("#retryBtn").onclick=initializeApplication;

  }finally{
    setLoading(false);
  }
}

/* ============================================================
   GLOBAL ERROR SAFETY
============================================================ */
window.addEventListener("error",event=>{
  console.error("GLOBAL_ERROR",event.error || event.message);
  setLoading(false);
});

window.addEventListener("unhandledrejection",event=>{
  console.error("UNHANDLED_REJECTION",event.reason);
  setLoading(false);
});

/* ============================================================
   START
============================================================ */
document.addEventListener(
  "DOMContentLoaded",
  initializeApplication,
  {once:true}
);
</script>

        /* ==========================================================================
   05 / 10 — CARDS, PANELS, CONTAINERS, TABLES & CONTENT COMPONENTS
   ========================================================================== */

:root {
  --surface-bg: #ffffff;
  --surface-secondary: #f8fafc;
  --surface-elevated: #ffffff;
  --surface-border: rgba(100, 116, 139, 0.18);

  --card-radius: 18px;
  --card-shadow:
    0 10px 25px rgba(15, 23, 42, 0.06),
    0 2px 6px rgba(15, 23, 42, 0.04);

  --card-shadow-hover:
    0 18px 40px rgba(15, 23, 42, 0.1),
    0 4px 12px rgba(15, 23, 42, 0.06);
}


/* =========================
   GENERIC CONTAINERS
   ========================= */

.container,
.content-container,
.page-container {
  width: min(100%, 1280px);
  margin-inline: auto;
  padding-inline: clamp(1rem, 3vw, 2rem);
}


.section,
.content-section {
  width: 100%;
  padding-block: clamp(2rem, 5vw, 4rem);
}


.panel,
.card,
.box,
.content-card {
  position: relative;
  background: var(--surface-bg);
  border: 1px solid var(--surface-border);
  border-radius: var(--card-radius);
  box-shadow: var(--card-shadow);
  overflow: hidden;
  transition:
    transform 200ms ease,
    box-shadow 200ms ease,
    border-color 200ms ease,
    background-color 200ms ease;
}


.panel:hover,
.card:hover,
.box:hover,
.content-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--card-shadow-hover);
}


.card-header,
.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;

  padding: 1.15rem 1.25rem;

  border-bottom: 1px solid var(--surface-border);
}


.card-title,
.panel-title {
  margin: 0;
  color: var(--heading-color, #0f172a);
  font-size: 1.05rem;
  font-weight: 700;
}


.card-body,
.panel-body {
  padding: 1.25rem;
}


.card-footer,
.panel-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 1rem 1.25rem;

  border-top: 1px solid var(--surface-border);
  background: var(--surface-secondary);
}


/* =========================
   FEATURE CARDS
   ========================= */

.feature-grid,
.cards-grid,
.products-grid {
  display: grid;
  grid-template-columns:
    repeat(
      auto-fit,
      minmax(260px, 1fr)
    );

  gap: 1.25rem;
}


.feature-card {
  display: flex;
  flex-direction: column;
  gap: 1rem;

  padding: 1.5rem;
}


.feature-icon {
  width: 52px;
  height: 52px;

  display: grid;
  place-items: center;

  border-radius: 14px;

  background:
    linear-gradient(
      135deg,
      var(--accent-color, #2563eb),
      var(--accent-secondary, #60a5fa)
    );

  color: #ffffff;

  font-size: 1.4rem;
}


.feature-card h3 {
  margin: 0;

  color: var(--heading-color, #0f172a);
  font-size: 1.1rem;
}


.feature-card p {
  margin: 0;

  color: var(--text-secondary, #64748b);
  line-height: 1.7;
}


/* =========================
   IMAGE CARDS
   ========================= */

.image-card {
  overflow: hidden;
}


.image-card img {
  display: block;

  width: 100%;
  height: auto;

  aspect-ratio: 16 / 10;

  object-fit: cover;

  transition:
    transform 300ms ease;
}


.image-card:hover img {
  transform: scale(1.04);
}


.image-card-content {
  padding: 1.2rem;
}


/* =========================
   BADGES & TAGS
   ========================= */

.badge,
.tag,
.status-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  min-height: 26px;

  padding:
    0.25rem
    0.7rem;

  border-radius: 999px;

  background: var(--badge-bg, #eff6ff);
  color: var(--badge-text, #2563eb);

  font-size: 0.78rem;
  font-weight: 700;

  white-space: nowrap;
}


.badge-success {
  background: rgba(22,163,74,.12);
  color: #15803d;
}


.badge-warning {
  background: rgba(234,179,8,.14);
  color: #a16207;
}


.badge-danger {
  background: rgba(220,38,38,.12);
  color: #b91c1c;
}


/* =========================
   TABLES
   ========================= */

.table-wrapper {
  width: 100%;
  overflow-x: auto;

  border-radius: var(--card-radius);
  border: 1px solid var(--surface-border);
}


table {
  width: 100%;

  border-collapse: collapse;

  background: var(--surface-bg);

  color: var(--text-color, #334155);
}


thead {
  background:
    var(--surface-secondary);
}


th {
  padding: 0.9rem 1rem;

  text-align: start;

  color:
    var(--heading-color, #0f172a);

  font-size: 0.85rem;

  font-weight: 700;

  white-space: nowrap;
}


td {
  padding: 0.9rem 1rem;

  border-top:
    1px solid var(--surface-border);

  font-size: 0.9rem;
}


tbody tr {
  transition:
    background-color 160ms ease;
}


tbody tr:hover {
  background:
    rgba(37,99,235,.04);
}


/* =========================
   EMPTY STATES
   ========================= */

.empty-state,
.no-data,
.placeholder-box {

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  gap: 1rem;

  min-height: 240px;

  padding: 2rem;

  text-align: center;

  border:
    1px dashed var(--surface-border);

  border-radius: var(--card-radius);

  background:
    var(--surface-secondary);

}


.empty-state-icon {

  width: 64px;
  height: 64px;

  display: grid;

  place-items: center;

  border-radius: 50%;

  background:
    rgba(37,99,235,.1);

  color:
    var(--accent-color,#2563eb);

  font-size: 1.8rem;
}


/* =========================
   ALERT BOXES
   ========================= */

.alert {

  display: flex;

  align-items: flex-start;

  gap: .8rem;

  padding: 1rem 1.2rem;

  border-radius: 14px;

  border: 1px solid transparent;

}


.alert-info {

  background:
    rgba(37,99,235,.08);

  border-color:
    rgba(37,99,235,.2);

  color:
    #1d4ed8;

}


.alert-success {

  background:
    rgba(22,163,74,.08);

  border-color:
    rgba(22,163,74,.2);

  color:
    #15803d;

}


.alert-warning {

  background:
    rgba(234,179,8,.1);

  border-color:
    rgba(234,179,8,.25);

  color:
    #a16207;

}


.alert-danger {

  background:
    rgba(220,38,38,.08);

  border-color:
    rgba(220,38,38,.2);

  color:
    #b91c1c;

}


/* =========================
   DARK MODE
   ========================= */

@media (prefers-color-scheme: dark) {

  :root:not([data-theme="light"]):not(.light) {

    --surface-bg:#111827;
    --surface-secondary:#0f172a;
    --surface-elevated:#1e293b;

    --surface-border:
      rgba(148,163,184,.18);

    --card-shadow:
      0 12px 30px rgba(0,0,0,.25);

  }

}


[data-theme="dark"],
.dark {

  --surface-bg:#111827;
  --surface-secondary:#0f172a;
  --surface-elevated:#1e293b;

  --surface-border:
    rgba(148,163,184,.18);

  --card-shadow:
    0 12px 30px rgba(0,0,0,.25);

}


[data-theme="dark"] table,
.dark table {

  background:#111827;

  color:#cbd5e1;

}


[data-theme="dark"] thead,
.dark thead {

  background:#1e293b;

}


[data-theme="dark"] th,
.dark th {

  color:#f1f5f9;

}


[data-theme="dark"] tbody tr:hover,
.dark tbody tr:hover {

  background:
    rgba(96,165,250,.08);

}
        /* ==========================================================================
   06 / 10 — FORMS, INPUTS, SELECTS, SEARCH, FILTERS & CONTROLS
   ========================================================================== */


:root {

  --input-bg: #ffffff;
  --input-border: #cbd5e1;
  --input-focus: #2563eb;
  --input-placeholder: #94a3b8;

  --input-radius: 12px;

  --control-height: 44px;

}


/* =========================
   FORM CONTAINERS
   ========================= */

.form,
.form-container,
.search-box,
.filter-box {

  display: flex;

  flex-direction: column;

  gap: 1rem;

}


.form-group {

  display: flex;

  flex-direction: column;

  gap: .45rem;

}


.form-row {

  display: grid;

  grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));

  gap: 1rem;

}



/* =========================
   LABELS
   ========================= */

label,
.form-label {

  display: block;

  margin-bottom: .35rem;

  color:
    var(--heading-color,#0f172a);

  font-size: .9rem;

  font-weight: 600;

}


.required::after {

  content:" *";

  color:#dc2626;

}



/* =========================
   INPUT BASE
   ========================= */

input,
textarea,
select {

  width:100%;

  min-height:var(--control-height);

  padding:
    .65rem
    .85rem;

  border:
    1px solid var(--input-border);

  border-radius:
    var(--input-radius);

  background:
    var(--input-bg);

  color:
    var(--text-color,#334155);

  font-size:.95rem;

  outline:none;

  transition:

    border-color .2s ease,

    box-shadow .2s ease,

    background-color .2s ease;

}


input::placeholder,
textarea::placeholder {

  color:
    var(--input-placeholder);

}



/* =========================
   INPUT FOCUS
   ========================= */

input:focus,
textarea:focus,
select:focus {

  border-color:
    var(--input-focus);

  box-shadow:

    0 0 0 4px

    rgba(37,99,235,.14);

}



/* =========================
   TEXTAREA
   ========================= */

textarea {

  min-height:120px;

  resize:vertical;

  line-height:1.7;

}



/* =========================
   SELECT
   ========================= */

select {

  cursor:pointer;

  appearance:none;

  background-image:

    linear-gradient(45deg,
    transparent 50%,
    #64748b 50%),

    linear-gradient(135deg,
    #64748b 50%,
    transparent 50%);

  background-position:

    calc(100% - 18px) 50%,
    calc(100% - 13px) 50%;

  background-size:

    5px 5px,
    5px 5px;

  background-repeat:no-repeat;

  padding-right:2.5rem;

}



/* =========================
   CHECKBOX & RADIO
   ========================= */

.checkbox-group,
.radio-group {

  display:flex;

  align-items:center;

  gap:.65rem;

}


input[type="checkbox"],
input[type="radio"] {

  width:18px;

  height:18px;

  min-height:auto;

  accent-color:
    var(--accent-color,#2563eb);

  cursor:pointer;

}



/* =========================
   SWITCH TOGGLE
   ========================= */

.switch {

  position:relative;

  width:48px;

  height:26px;

}


.switch input {

  opacity:0;

  width:0;

  height:0;

}


.switch-slider {

  position:absolute;

  inset:0;

  cursor:pointer;

  background:#cbd5e1;

  border-radius:999px;

  transition:.25s;

}


.switch-slider::before {

  content:"";

  position:absolute;

  width:20px;

  height:20px;

  left:3px;

  top:3px;

  background:white;

  border-radius:50%;

  transition:.25s;

  box-shadow:
    0 2px 5px rgba(0,0,0,.2);

}


.switch input:checked + .switch-slider {

  background:
    var(--accent-color,#2563eb);

}


.switch input:checked + .switch-slider::before {

  transform:
    translateX(22px);

}



/* =========================
   SEARCH INPUT
   ========================= */

.search-input-wrapper {

  position:relative;

  width:100%;

}


.search-input-wrapper input {

  padding-left:2.8rem;

}


.search-icon {

  position:absolute;

  left:1rem;

  top:50%;

  transform:
    translateY(-50%);

  color:#64748b;

  pointer-events:none;

}



/* =========================
   BUTTON INSIDE FORM
   ========================= */

.form-actions {

  display:flex;

  flex-wrap:wrap;

  gap:.75rem;

  margin-top:.5rem;

}



/* =========================
   VALIDATION STATES
   ========================= */

.is-valid {

  border-color:#16a34a !important;

}


.is-invalid {

  border-color:#dc2626 !important;

}


.form-message {

  font-size:.8rem;

  margin-top:.3rem;

}


.form-message.success {

  color:#15803d;

}


.form-message.error {

  color:#dc2626;

}



/* =========================
   DISABLED STATE
   ========================= */

input:disabled,
textarea:disabled,
select:disabled {

  cursor:not-allowed;

  opacity:.65;

  background:
    #f1f5f9;

}



/* =========================
   FILE INPUT
   ========================= */

input[type="file"] {

  padding:.5rem;

  cursor:pointer;

}


input[type="file"]::file-selector-button {

  border:none;

  padding:.45rem .8rem;

  margin-right:.7rem;

  border-radius:8px;

  background:
    #2563eb;

  color:white;

  cursor:pointer;

}



/* =========================
   DARK MODE
   ========================= */

@media (prefers-color-scheme:dark){

  :root:not([data-theme="light"]):not(.light){

    --input-bg:#111827;

    --input-border:#475569;

    --input-placeholder:#64748b;

  }

}



[data-theme="dark"],
.dark {

  --input-bg:#111827;

  --input-border:#475569;

  --input-placeholder:#64748b;

}



[data-theme="dark"] input,
[data-theme="dark"] textarea,
[data-theme="dark"] select,
.dark input,
.dark textarea,
.dark select {

  background:
    var(--input-bg);

  color:#e2e8f0;

}


[data-theme="dark"] input:disabled,
[data-theme="dark"] textarea:disabled,
[data-theme="dark"] select:disabled,
.dark input:disabled,
.dark textarea:disabled,
.dark select:disabled {

  background:#1e293b;

}

/* ==========================================================================
   07 / 10 — NAVIGATION, HEADER, SIDEBAR, MENUS, TABS & INTERACTIVE UI
   ========================================================================== */


/* =========================
   HEADER
   ========================= */

header,
.site-header,
.main-header,
.app-header {
  position: relative;
  width: 100%;
  z-index: 1000;

  background: var(--surface-bg, #ffffff);
  color: var(--text-color, #334155);

  border-bottom: 1px solid var(--surface-border, rgba(100,116,139,.18));

  transition:
    background-color .2s ease,
    border-color .2s ease,
    color .2s ease;
}


.header-inner {
  width: min(100%, 1280px);
  min-height: 68px;

  margin-inline: auto;
  padding-inline: clamp(1rem, 3vw, 2rem);

  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}


.logo,
.brand {
  display: inline-flex;
  align-items: center;
  gap: .65rem;

  color: var(--heading-color, #0f172a);

  font-weight: 800;
  text-decoration: none;

  white-space: nowrap;
}


.logo img,
.brand img {
  display: block;
  max-height: 42px;
  width: auto;
}


/* =========================
   MAIN NAVIGATION
   ========================= */

nav,
.main-nav,
.site-nav {
  display: flex;
  align-items: center;
}


nav ul,
.main-nav ul,
.site-nav ul {
  display: flex;
  align-items: center;
  gap: .25rem;

  margin: 0;
  padding: 0;

  list-style: none;
}


nav a,
.main-nav a,
.site-nav a {
  position: relative;

  display: inline-flex;
  align-items: center;

  min-height: 42px;

  padding: .55rem .8rem;

  border-radius: 10px;

  color: var(--text-color, #334155);

  font-size: .9rem;
  font-weight: 600;

  text-decoration: none;

  transition:
    color .18s ease,
    background-color .18s ease;
}


nav a:hover,
.main-nav a:hover,
.site-nav a:hover {
  color: var(--accent-color, #2563eb);

  background:
    rgba(37,99,235,.07);
}


nav a[aria-current="page"],
.main-nav a.active,
.site-nav a.active {
  color: var(--accent-color, #2563eb);

  background:
    rgba(37,99,235,.1);
}


/* =========================
   DROPDOWN MENUS
   ========================= */

.nav-item,
.dropdown {
  position: relative;
}


.dropdown-toggle {
  display: inline-flex;
  align-items: center;
  gap: .4rem;
}


.dropdown-toggle::after {
  content: "";

  width: 7px;
  height: 7px;

  border-right: 1.5px solid currentColor;
  border-bottom: 1.5px solid currentColor;

  transform:
    rotate(45deg)
    translateY(-2px);

  transition: transform .2s ease;
}


.dropdown:hover .dropdown-toggle::after,
.dropdown:focus-within .dropdown-toggle::after {
  transform:
    rotate(225deg)
    translateY(-1px);
}


.dropdown-menu {
  position: absolute;

  top: calc(100% + .5rem);
  inset-inline-start: 0;

  min-width: 210px;

  padding: .45rem;

  margin: 0;

  display: flex;
  flex-direction: column;
  align-items: stretch;

  background: var(--surface-elevated, #ffffff);

  border:
    1px solid var(--surface-border, rgba(100,116,139,.18));

  border-radius: 14px;

  box-shadow:
    0 18px 40px rgba(15,23,42,.12);

  opacity: 0;
  visibility: hidden;

  transform:
    translateY(-5px);

  transition:
    opacity .18s ease,
    visibility .18s ease,
    transform .18s ease;
}


.dropdown:hover .dropdown-menu,
.dropdown:focus-within .dropdown-menu,
.dropdown.open .dropdown-menu {
  opacity: 1;
  visibility: visible;

  transform: translateY(0);
}


.dropdown-menu a {
  width: 100%;
  justify-content: flex-start;

  border-radius: 9px;
}


/* =========================
   MOBILE MENU BUTTON
   ========================= */

.menu-toggle,
.nav-toggle,
.mobile-menu-toggle {
  display: none;

  width: 42px;
  height: 42px;

  padding: 0;

  place-items: center;

  border: 1px solid var(--surface-border, rgba(100,116,139,.18));
  border-radius: 10px;

  background: var(--surface-bg, #ffffff);
  color: var(--heading-color, #0f172a);

  cursor: pointer;

  transition:
    background-color .18s ease,
    border-color .18s ease,
    color .18s ease;
}


.menu-toggle:hover,
.nav-toggle:hover,
.mobile-menu-toggle:hover {
  color: var(--accent-color, #2563eb);
  background: rgba(37,99,235,.06);
}


/* =========================
   SIDEBAR
   ========================= */

.sidebar,
.side-nav {
  width: 260px;

  flex: 0 0 260px;

  background:
    var(--surface-bg, #ffffff);

  border-inline-end:
    1px solid var(--surface-border, rgba(100,116,139,.18));

  color:
    var(--text-color, #334155);
}


.sidebar-inner {
  position: sticky;
  top: 0;

  min-height: 100vh;

  padding: 1rem;

  overflow-y: auto;
}


.sidebar ul,
.side-nav ul {
  display: flex;
  flex-direction: column;

  gap: .25rem;

  margin: 0;
  padding: 0;

  list-style: none;
}


.sidebar a,
.side-nav a {
  display: flex;
  align-items: center;
  gap: .7rem;

  min-height: 42px;

  padding: .65rem .8rem;

  border-radius: 10px;

  color: var(--text-color, #334155);

  font-size: .9rem;
  font-weight: 600;

  text-decoration: none;

  transition:
    background-color .18s ease,
    color .18s ease;
}


.sidebar a:hover,
.side-nav a:hover {
  color: var(--accent-color, #2563eb);
  background: rgba(37,99,235,.07);
}


.sidebar a.active,
.side-nav a.active,
.sidebar a[aria-current="page"],
.side-nav a[aria-current="page"] {
  color: var(--accent-color, #2563eb);
  background: rgba(37,99,235,.1);
}


/* =========================
   BREADCRUMBS
   ========================= */

.breadcrumb,
.breadcrumbs {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: .45rem;

  margin: 0;
  padding: 0;

  list-style: none;

  color: var(--text-secondary, #64748b);

  font-size: .85rem;
}


.breadcrumb a,
.breadcrumbs a {
  color: inherit;
  text-decoration: none;
}


.breadcrumb a:hover,
.breadcrumbs a:hover {
  color: var(--accent-color, #2563eb);
}


.breadcrumb li + li::before,
.breadcrumbs li + li::before {
  content: "/";

  margin-inline-end: .45rem;

  color: #94a3b8;
}


/* =========================
   TABS
   ========================= */

.tabs,
.tab-list {
  display: flex;
  align-items: center;

  gap: .25rem;

  overflow-x: auto;

  border-bottom:
    1px solid var(--surface-border, rgba(100,116,139,.18));

  scrollbar-width: thin;
}


.tab,
.tab-button {
  position: relative;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  min-height: 44px;

  padding:
    .6rem .9rem;

  border: 0;

  border-radius: 8px 8px 0 0;

  background: transparent;

  color:
    var(--text-secondary, #64748b);

  font: inherit;
  font-size: .9rem;
  font-weight: 650;

  cursor: pointer;

  white-space: nowrap;

  transition:
    color .18s ease,
    background-color .18s ease;
}


.tab:hover,
.tab-button:hover {
  color:
    var(--accent-color, #2563eb);

  background:
    rgba(37,99,235,.05);
}


.tab.active,
.tab[aria-selected="true"],
.tab-button.active,
.tab-button[aria-selected="true"] {
  color:
    var(--accent-color, #2563eb);
}


.tab.active::after,
.tab[aria-selected="true"]::after,
.tab-button.active::after,
.tab-button[aria-selected="true"]::after {
  content: "";

  position: absolute;

  inset-inline: .65rem;
  bottom: -1px;

  height: 2px;

  border-radius: 999px;

  background:
    var(--accent-color, #2563eb);
}


/* =========================
   PAGINATION
   ========================= */

.pagination {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;

  gap: .4rem;

  margin-top: 1.5rem;
}


.pagination a,
.pagination button {
  min-width: 38px;
  min-height: 38px;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  padding: .4rem .65rem;

  border:
    1px solid var(--surface-border, rgba(100,116,139,.18));

  border-radius: 9px;

  background:
    var(--surface-bg, #ffffff);

  color:
    var(--text-color, #334155);

  font: inherit;
  font-size: .85rem;
  font-weight: 650;

  text-decoration: none;

  cursor: pointer;

  transition:
    background-color .18s ease,
    color .18s ease,
    border-color .18s ease;
}


.pagination a:hover,
.pagination button:hover {
  color:
    var(--accent-color, #2563eb);

  border-color:
    rgba(37,99,235,.35);

  background:
    rgba(37,99,235,.06);
}


.pagination .active,
.pagination [aria-current="page"] {
  color: #ffffff;

  border-color:
    var(--accent-color, #2563eb);

  background:
    var(--accent-color, #2563eb);
}


/* =========================
   MOBILE NAVIGATION
   ========================= */

@media (max-width: 768px) {

  .menu-toggle,
  .nav-toggle,
  .mobile-menu-toggle {
    display: grid;
  }


  nav ul,
  .main-nav ul,
  .site-nav ul {
    flex-direction: column;
    align-items: stretch;

    width: 100%;
  }


  nav,
  .main-nav,
  .site-nav {
    width: 100%;
  }


  .mobile-nav,
  .main-nav.mobile-open,
  .site-nav.mobile-open {
    display: flex;
    flex-direction: column;

    width: 100%;
  }


  .dropdown-menu {
    position: static;

    width: 100%;
    min-width: 0;

    margin-top: .25rem;

    box-shadow: none;

    opacity: 1;
    visibility: visible;

    transform: none;

    display: none;
  }


  .dropdown.open .dropdown-menu,
  .dropdown:focus-within .dropdown-menu {
    display: flex;
  }


  .sidebar,
  .side-nav {
    width: 100%;

    flex-basis: auto;

    border-inline-end: 0;
    border-bottom:
      1px solid var(--surface-border, rgba(100,116,139,.18));
  }


  .sidebar-inner {
    position: static;
    min-height: auto;
  }

}


/* =========================
   DARK MODE
   ========================= */

[data-theme="dark"],
.dark {

  --surface-bg: #111827;
  --surface-elevated: #1e293b;
  --surface-secondary: #0f172a;

  --surface-border:
    rgba(148,163,184,.18);
}


[data-theme="dark"] header,
[data-theme="dark"] .site-header,
[data-theme="dark"] .main-header,
[data-theme="dark"] .sidebar,
[data-theme="dark"] .side-nav,
.dark header,
.dark .site-header,
.dark .main-header,
.dark .sidebar,
.dark .side-nav {

  background:
    var(--surface-bg);

  color:
    #cbd5e1;
}


[data-theme="dark"] nav a,
[data-theme="dark"] .main-nav a,
[data-theme="dark"] .site-nav a,
[data-theme="dark"] .sidebar a,
[data-theme="dark"] .side-nav a,
.dark nav a,
.dark .main-nav a,
.dark .site-nav a,
.dark .sidebar a,
.dark .side-nav a {

  color:
    #cbd5e1;
}


[data-theme="dark"] nav a:hover,
[data-theme="dark"] .main-nav a:hover,
[data-theme="dark"] .site-nav a:hover,
[data-theme="dark"] .sidebar a:hover,
[data-theme="dark"] .side-nav a:hover,
.dark nav a:hover,
.dark .main-nav a:hover,
.dark .site-nav a:hover,
.dark .sidebar a:hover,
.dark .side-nav a:hover {

  color:
    #93c5fd;

  background:
    rgba(96,165,250,.1);
}


[data-theme="dark"] .dropdown-menu,
.dark .dropdown-menu {

  background:
    #1e293b;

  border-color:
    rgba(148,163,184,.2);

  box-shadow:
    0 18px 40px rgba(0,0,0,.35);
}


[data-theme="dark"] .menu-toggle,
[data-theme="dark"] .nav-toggle,
[data-theme="dark"] .mobile-menu-toggle,
.dark .menu-toggle,
.dark .nav-toggle,
.dark .mobile-menu-toggle {

  background:
    #1e293b;

  color:
    #e2e8f0;

  border-color:
    rgba(148,163,184,.2);
}


        /* ==========================================================================
   08 / 10 — MODALS, DRAWERS, TOOLTIPS, ALERTS, NOTIFICATIONS & OVERLAYS
   ========================================================================== */


/* =========================
   OVERLAY / BACKDROP
   ========================= */

.overlay,
.backdrop,
.modal-backdrop {

  position: fixed;

  inset: 0;

  z-index: 2000;

  background:
    rgba(15, 23, 42, .48);

  backdrop-filter:
    blur(3px);

  -webkit-backdrop-filter:
    blur(3px);

  opacity: 0;
  visibility: hidden;

  transition:
    opacity .2s ease,
    visibility .2s ease;
}


.overlay.active,
.backdrop.active,
.modal-backdrop.active,
.overlay.show,
.backdrop.show,
.modal-backdrop.show {

  opacity: 1;
  visibility: visible;
}


/* =========================
   MODAL
   ========================= */

.modal {

  position: fixed;

  inset: 0;

  z-index: 2100;

  display: flex;

  align-items: center;
  justify-content: center;

  padding:
    clamp(.75rem, 3vw, 2rem);

  opacity: 0;
  visibility: hidden;

  pointer-events: none;

  transition:
    opacity .2s ease,
    visibility .2s ease;
}


.modal.active,
.modal.show,
.modal[aria-hidden="false"] {

  opacity: 1;

  visibility: visible;

  pointer-events: auto;
}


.modal-dialog {

  position: relative;

  width: min(
    100%,
    560px
  );

  max-height:
    min(90vh, 760px);

  display: flex;

  flex-direction: column;

  overflow: hidden;

  background:
    var(--surface-elevated, #ffffff);

  color:
    var(--text-color, #334155);

  border:
    1px solid
    var(--surface-border, rgba(100,116,139,.18));

  border-radius:
    18px;

  box-shadow:
    0 25px 70px
    rgba(15,23,42,.2);

  transform:
    translateY(12px)
    scale(.98);

  transition:
    transform .22s ease;
}


.modal.active .modal-dialog,
.modal.show .modal-dialog,
.modal[aria-hidden="false"] .modal-dialog {

  transform:
    translateY(0)
    scale(1);
}


.modal-sm .modal-dialog {
  width: min(100%, 400px);
}


.modal-lg .modal-dialog {
  width: min(100%, 800px);
}


.modal-xl .modal-dialog {
  width: min(100%, 1100px);
}


/* =========================
   MODAL HEADER
   ========================= */

.modal-header {

  display: flex;

  align-items: flex-start;

  justify-content: space-between;

  gap: 1rem;

  padding:
    1.25rem 1.4rem;

  border-bottom:
    1px solid
    var(--surface-border, rgba(100,116,139,.18));
}


.modal-title {

  margin: 0;

  color:
    var(--heading-color, #0f172a);

  font-size:
    1.1rem;

  font-weight:
    750;

  line-height:
    1.35;
}


/* =========================
   MODAL BODY
   ========================= */

.modal-body {

  flex: 1;

  min-height: 0;

  overflow-y: auto;

  padding:
    1.4rem;

  line-height:
    1.7;

  overscroll-behavior:
    contain;
}


/* =========================
   MODAL FOOTER
   ========================= */

.modal-footer {

  display: flex;

  align-items: center;

  justify-content: flex-end;

  flex-wrap: wrap;

  gap: .65rem;

  padding:
    1rem 1.4rem;

  border-top:
    1px solid
    var(--surface-border, rgba(100,116,139,.18));

  background:
    var(--surface-secondary, #f8fafc);
}


/* =========================
   CLOSE BUTTON
   ========================= */

.modal-close,
.close-button,
.drawer-close {

  width: 38px;
  height: 38px;

  flex: 0 0 38px;

  display: grid;

  place-items: center;

  padding: 0;

  border: 0;

  border-radius: 9px;

  background:
    transparent;

  color:
    var(--text-secondary, #64748b);

  font-size:
    1.25rem;

  line-height: 1;

  cursor: pointer;

  transition:
    background-color .18s ease,
    color .18s ease;
}


.modal-close:hover,
.close-button:hover,
.drawer-close:hover {

  background:
    rgba(100,116,139,.1);

  color:
    var(--heading-color, #0f172a);
}


/* =========================
   DRAWER
   ========================= */

.drawer {

  position: fixed;

  top: 0;
  bottom: 0;

  z-index: 2200;

  width:
    min(90vw, 420px);

  display: flex;

  flex-direction: column;

  background:
    var(--surface-elevated, #ffffff);

  color:
    var(--text-color, #334155);

  border:
    1px solid
    var(--surface-border, rgba(100,116,139,.18));

  box-shadow:
    0 0 50px
    rgba(15,23,42,.16);

  transition:
    transform .25s ease;
}


.drawer-left {

  inset-inline-start: 0;

  transform:
    translateX(-105%);
}


.drawer-right {

  inset-inline-end: 0;

  transform:
    translateX(105%);
}


.drawer.active,
.drawer.show,
.drawer[aria-hidden="false"] {

  transform:
    translateX(0);
}


.drawer-header {

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 1rem;

  min-height: 64px;

  padding:
    .85rem 1rem;

  border-bottom:
    1px solid
    var(--surface-border, rgba(100,116,139,.18));
}


.drawer-title {

  margin: 0;

  color:
    var(--heading-color, #0f172a);

  font-size:
    1rem;

  font-weight:
    750;
}


.drawer-body {

  flex: 1;

  min-height: 0;

  overflow-y: auto;

  padding:
    1rem;
}


.drawer-footer {

  display: flex;

  flex-wrap: wrap;

  gap: .65rem;

  padding:
    1rem;

  border-top:
    1px solid
    var(--surface-border, rgba(100,116,139,.18));

  background:
    var(--surface-secondary, #f8fafc);
}


/* =========================
   TOOLTIP
   ========================= */

.tooltip {

  position: relative;

  display: inline-flex;

}


.tooltip-content {

  position: absolute;

  z-index: 3000;

  width: max-content;

  max-width:
    min(280px, calc(100vw - 2rem));

  padding:
    .5rem .7rem;

  border-radius:
    8px;

  background:
    #0f172a;

  color:
    #ffffff;

  font-size:
    .78rem;

  line-height:
    1.45;

  text-align:
    center;

  pointer-events:
    none;

  opacity: 0;
  visibility: hidden;

  transform:
    translateY(4px);

  transition:
    opacity .15s ease,
    visibility .15s ease,
    transform .15s ease;
}


.tooltip:hover .tooltip-content,
.tooltip:focus-within .tooltip-content,
.tooltip.show .tooltip-content {

  opacity: 1;

  visibility: visible;

  transform:
    translateY(0);
}


.tooltip-top .tooltip-content {

  bottom:
    calc(100% + .5rem);

  inset-inline-start:
    50%;

  transform:
    translateX(-50%)
    translateY(4px);
}


.tooltip-top:hover .tooltip-content,
.tooltip-top:focus-within .tooltip-content,
.tooltip-top.show .tooltip-content {

  transform:
    translateX(-50%)
    translateY(0);
}


.tooltip-bottom .tooltip-content {

  top:
    calc(100% + .5rem);

  inset-inline-start:
    50%;

  transform:
    translateX(-50%)
    translateY(-4px);
}


.tooltip-bottom:hover .tooltip-content,
.tooltip-bottom:focus-within .tooltip-content,
.tooltip-bottom.show .tooltip-content {

  transform:
    translateX(-50%)
    translateY(0);
}


/* =========================
   TOAST / NOTIFICATION
   ========================= */

.toast-container,
.notifications-container {

  position: fixed;

  z-index: 4000;

  inset-inline-end:
    clamp(.75rem, 3vw, 1.5rem);

  bottom:
    clamp(.75rem, 3vw, 1.5rem);

  width:
    min(100% - 1.5rem, 380px);

  display: flex;

  flex-direction: column;

  gap: .65rem;

  pointer-events:
    none;
}


.toast,
.notification {

  position: relative;

  display: flex;

  align-items: flex-start;

  gap: .75rem;

  padding:
    .9rem 1rem;

  background:
    var(--surface-elevated, #ffffff);

  color:
    var(--text-color, #334155);

  border:
    1px solid
    var(--surface-border, rgba(100,116,139,.18));

  border-radius:
    13px;

  box-shadow:
    0 12px 30px
    rgba(15,23,42,.13);

  pointer-events:
    auto;

  animation:
    toast-in .25s ease both;
}


.toast-close,
.notification-close {

  margin-inline-start: auto;

  width: 28px;
  height: 28px;

  display: grid;

  place-items: center;

  padding: 0;

  border: 0;

  border-radius: 7px;

  background: transparent;

  color:
    var(--text-secondary, #64748b);

  cursor: pointer;
}


.toast-close:hover,
.notification-close:hover {

  background:
    rgba(100,116,139,.1);

}


@keyframes toast-in {

  from {

    opacity: 0;

    transform:
      translateY(10px)
      scale(.97);

  }

  to {

    opacity: 1;

    transform:
      translateY(0)
      scale(1);

  }

}


/* =========================
   STATUS NOTIFICATIONS
   ========================= */

.toast-success,
.notification-success {

  border-inline-start:
    4px solid #16a34a;
}


.toast-warning,
.notification-warning {

  border-inline-start:
    4px solid #eab308;
}


.toast-danger,
.notification-danger {

  border-inline-start:
    4px solid #dc2626;
}


.toast-info,
.notification-info {

  border-inline-start:
    4px solid #2563eb;
}


/* =========================
   CONFIRMATION / PROMPT
   ========================= */

.confirm-dialog {

  text-align: center;

  padding:
    1.5rem;
}


.confirm-dialog-icon {

  width: 58px;
  height: 58px;

  display: grid;

  place-items: center;

  margin:
    0 auto 1rem;

  border-radius: 50%;

  background:
    rgba(37,99,235,.1);

  color:
    var(--accent-color, #2563eb);

  font-size:
    1.5rem;
}


.confirm-dialog h3 {

  margin:
    0 0 .5rem;

  color:
    var(--heading-color, #0f172a);

}


.confirm-dialog p {

  margin:
    0;

  color:
    var(--text-secondary, #64748b);

  line-height:
    1.7;
}


/* =========================
   LOADING OVERLAY
   ========================= */

.loading-overlay {

  position: absolute;

  inset: 0;

  z-index: 100;

  display: flex;

  align-items: center;

  justify-content: center;

  background:
    color-mix(
      in srgb,
      var(--surface-bg, #ffffff) 82%,
      transparent
    );

  backdrop-filter:
    blur(2px);

  -webkit-backdrop-filter:
    blur(2px);
}


.loading-overlay[hidden] {
  display: none;
}


.loading-spinner {

  width: 36px;
  height: 36px;

  border:
    3px solid
    rgba(37,99,235,.18);

  border-top-color:
    var(--accent-color, #2563eb);

  border-radius: 50%;

  animation:
    spin .7s linear infinite;
}


@keyframes spin {

  to {
    transform: rotate(360deg);
  }

}


/* =========================
   DARK MODE
   ========================= */

[data-theme="dark"],
.dark {

  --surface-bg: #111827;
  --surface-elevated: #1e293b;
  --surface-secondary: #0f172a;

  --surface-border:
    rgba(148,163,184,.18);
}


[data-theme="dark"] .modal-dialog,
[data-theme="dark"] .drawer,
[data-theme="dark"] .toast,
[data-theme="dark"] .notification,
.dark .modal-dialog,
.dark .drawer,
.dark .toast,
.dark .notification {

  background:
    var(--surface-elevated);

  color:
    #cbd5e1;

  border-color:
    rgba(148,163,184,.2);

  box-shadow:
    0 25px 70px
    rgba(0,0,0,.35);
}


[data-theme="dark"] .modal-title,
[data-theme="dark"] .drawer-title,
[data-theme="dark"] .confirm-dialog h3,
.dark .modal-title,
.dark .drawer-title,
.dark .confirm-dialog h3 {

  color:
    #f8fafc;
}


[data-theme="dark"] .modal-footer,
[data-theme="dark"] .drawer-footer,
.dark .modal-footer,
.dark .drawer-footer {

  background:
    #0f172a;

  border-color:
    rgba(148,163,184,.18);
}


[data-theme="dark"] .modal-close,
[data-theme="dark"] .close-button,
[data-theme="dark"] .drawer-close,
.dark .modal-close,
.dark .close-button,
.dark .drawer-close {

  color:
    #94a3b8;
}


[data-theme="dark"] .modal-close:hover,
[data-theme="dark"] .close-button:hover,
[data-theme="dark"] .drawer-close:hover,
.dark .modal-close:hover,
.dark .close-button:hover,
.dark .drawer-close:hover {

  color:
    #f8fafc;

  background:
    rgba(148,163,184,.1);
}


[data-theme="dark"] .overlay,
[data-theme="dark"] .backdrop,
[data-theme="dark"] .modal-backdrop,
.dark .overlay,
.dark .backdrop,
.dark .modal-backdrop {

  background:
    rgba(2,6,23,.68);
}


/* =========================
   REDUCED MOTION
   ========================= */

@media (prefers-reduced-motion: reduce) {

  .modal,
  .modal-dialog,
  .drawer,
  .tooltip-content,
  .toast,
  .notification {

    transition: none;
    animation: none;

  }

  .loading-spinner {

    animation-duration: 1.5s;

  }

}

        /* ============================================================
   BININI — CSS PART 9/10
   FINAL CONSOLIDATED UI COMPONENTS
   Forms / Modals / Tables / Status / Actions
   ============================================================ */

/* ---------- FORM SYSTEM ---------- */

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 1rem;
    width: 100%;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: .45rem;
    min-width: 0;
}

.form-group.full-width,
.form-group.span-2 {
    grid-column: 1 / -1;
}

.form-label {
    display: block;
    margin: 0;
    color: var(--text-primary);
    font-size: .86rem;
    font-weight: 700;
    line-height: 1.6;
}

.form-label::first-letter {
    color: inherit;
}

.form-control,
.form-group input,
.form-group select,
.form-group textarea {
    width: 100%;
    min-height: 44px;
    padding: .7rem .85rem;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    background: var(--surface-input);
    color: var(--text-primary);
    font: inherit;
    font-size: .9rem;
    line-height: 1.5;
    outline: none;
    transition:
        border-color .18s ease,
        background-color .18s ease,
        box-shadow .18s ease,
        color .18s ease;
    box-sizing: border-box;
}

.form-group textarea,
textarea.form-control {
    min-height: 110px;
    resize: vertical;
}

.form-control::placeholder,
.form-group input::placeholder,
.form-group textarea::placeholder {
    color: var(--text-muted);
    opacity: .85;
}

.form-control:hover,
.form-group input:hover,
.form-group select:hover,
.form-group textarea:hover {
    border-color: var(--border-strong);
}

.form-control:focus,
.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
    border-color: var(--accent-color);
    background: var(--surface-input-focus);
    box-shadow: 0 0 0 3px var(--accent-soft);
}

.form-control:disabled,
.form-group input:disabled,
.form-group select:disabled,
.form-group textarea:disabled {
    cursor: not-allowed;
    opacity: .6;
}

/* Native select normalization */

select.form-control,
.form-group select {
    appearance: none;
    -webkit-appearance: none;
    padding-inline-end: 2.6rem;
    background-image:
        linear-gradient(45deg, transparent 50%, currentColor 50%),
        linear-gradient(135deg, currentColor 50%, transparent 50%);
    background-position:
        calc(100% - 17px) 19px,
        calc(100% - 12px) 19px;
    background-size:
        5px 5px,
        5px 5px;
    background-repeat: no-repeat;
    color: var(--text-primary);
}

[dir="rtl"] select.form-control,
[dir="rtl"] .form-group select {
    background-position:
        12px 19px,
        17px 19px;
    padding-inline-start: 2.6rem;
    padding-inline-end: .85rem;
}

select.form-control option,
.form-group select option {
    background: var(--surface-elevated);
    color: var(--text-primary);
}

/* Numeric/date controls */

input[type="number"].form-control,
input[type="date"].form-control,
input[type="number"],
input[type="date"] {
    font-variant-numeric: tabular-nums;
}

input[type="number"] {
    direction: ltr;
    text-align: right;
}

input[type="date"] {
    direction: ltr;
    text-align: left;
}

/* ---------- CHECKBOX / RADIO ---------- */

.form-check,
.checkbox-group,
.radio-group {
    display: flex;
    align-items: center;
    gap: .6rem;
    min-height: 40px;
}

.form-check input[type="checkbox"],
.form-check input[type="radio"],
.checkbox-group input[type="checkbox"],
.radio-group input[type="radio"] {
    width: 18px;
    height: 18px;
    margin: 0;
    accent-color: var(--accent-color);
    cursor: pointer;
}

.form-check label,
.checkbox-group label,
.radio-group label {
    color: var(--text-secondary);
    font-size: .88rem;
    line-height: 1.5;
    cursor: pointer;
}

/* ---------- FIELD ERROR ---------- */

.field-error,
.form-error {
    display: block;
    margin: 0;
    color: var(--danger-color);
    font-size: .76rem;
    font-weight: 600;
    line-height: 1.5;
}

.form-control.is-invalid,
.form-group input.is-invalid,
.form-group select.is-invalid,
.form-group textarea.is-invalid,
.form-control.error,
.form-group input.error,
.form-group select.error,
.form-group textarea.error {
    border-color: var(--danger-color);
    box-shadow: 0 0 0 3px var(--danger-soft);
}

.form-control.is-invalid:focus,
.form-control.error:focus {
    border-color: var(--danger-color);
    box-shadow: 0 0 0 3px var(--danger-soft);
}

/* ---------- FORM ACTIONS ---------- */

.form-actions,
.modal-actions {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    flex-wrap: wrap;
    gap: .65rem;
    margin-top: 1.2rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border-color);
}

.form-actions .btn,
.modal-actions .btn {
    min-width: 110px;
}

.form-actions .btn.primary,
.modal-actions .btn.primary {
    min-width: 130px;
}

/* ---------- MODAL ---------- */

.modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    background: var(--overlay-color);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition:
        opacity .2s ease,
        visibility .2s ease;
}

.modal-overlay.active,
.modal-overlay.show,
.modal-overlay.is-open {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
}

.modal {
    position: relative;
    width: min(680px, 100%);
    max-height: min(88vh, 850px);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    background: var(--surface-modal);
    color: var(--text-primary);
    box-shadow: var(--shadow-xl);
    transform: translateY(12px) scale(.985);
    transition: transform .2s ease;
}

.modal-overlay.active .modal,
.modal-overlay.show .modal,
.modal-overlay.is-open .modal {
    transform: translateY(0) scale(1);
}

.modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 1rem 1.15rem;
    border-bottom: 1px solid var(--border-color);
    background: var(--surface-modal-header);
}

.modal-title {
    margin: 0;
    color: var(--text-primary);
    font-size: 1.05rem;
    font-weight: 800;
    line-height: 1.5;
}

.modal-close,
.modal-header button.close {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    flex: 0 0 36px;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 50%;
    background: transparent;
    color: var(--text-muted);
    font-size: 1.25rem;
    line-height: 1;
    cursor: pointer;
    transition:
        background-color .18s ease,
        color .18s ease,
        border-color .18s ease;
}

.modal-close:hover,
.modal-header button.close:hover {
    border-color: var(--border-color);
    background: var(--surface-hover);
    color: var(--text-primary);
}

.modal-body {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 1.15rem;
    scrollbar-width: thin;
}

.modal-footer {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: .65rem;
    flex-wrap: wrap;
    padding: 1rem 1.15rem;
    border-top: 1px solid var(--border-color);
    background: var(--surface-modal-footer);
}

/* ---------- CARD HEADER ---------- */

.card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    min-width: 0;
    padding-bottom: .9rem;
    margin-bottom: .9rem;
    border-bottom: 1px solid var(--border-color);
}

.card-title {
    margin: 0;
    color: var(--text-primary);
    font-size: 1rem;
    font-weight: 800;
    line-height: 1.5;
}

.card-header > * {
    min-width: 0;
}

/* ---------- TOOLBAR ---------- */

.toolbar {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    flex-wrap: wrap;
    gap: .55rem;
}

.toolbar .btn {
    flex: 0 0 auto;
}

/* ---------- TABLE ---------- */

.table-wrapper,
.table-responsive {
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    background: var(--surface-card);
    scrollbar-width: thin;
}

.table-wrapper table,
.table-responsive table,
.card table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    min-width: 680px;
}

.table-wrapper th,
.table-responsive th,
.card th {
    padding: .75rem .8rem;
    border-bottom: 1px solid var(--border-strong);
    background: var(--surface-table-head);
    color: var(--text-secondary);
    font-size: .75rem;
    font-weight: 800;
    line-height: 1.5;
    text-align: right;
    white-space: nowrap;
}

.table-wrapper td,
.table-responsive td,
.card td {
    padding: .75rem .8rem;
    border-bottom: 1px solid var(--border-color);
    color: var(--text-primary);
    font-size: .82rem;
    line-height: 1.55;
    vertical-align: middle;
}

.table-wrapper tbody tr,
.table-responsive tbody tr,
.card tbody tr {
    background: var(--surface-card);
    transition: background-color .16s ease;
}

.table-wrapper tbody tr:hover,
.table-responsive tbody tr:hover,
.card tbody tr:hover {
    background: var(--surface-hover);
}

.table-wrapper tbody tr:last-child td,
.table-responsive tbody tr:last-child td,
.card tbody tr:last-child td {
    border-bottom: 0;
}

.table-wrapper td.numeric,
.table-responsive td.numeric,
.card td.numeric,
.table-wrapper th.numeric,
.table-responsive th.numeric,
.card th.numeric {
    direction: ltr;
    text-align: right;
    font-variant-numeric: tabular-nums;
}

.table-wrapper td.actions,
.table-responsive td.actions,
.card td.actions {
    white-space: nowrap;
}

/* ---------- EMPTY TABLE STATE ---------- */

.table-empty,
.empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: .45rem;
    min-height: 170px;
    padding: 1.5rem;
    color: var(--text-muted);
    text-align: center;
}

.empty-state-title {
    color: var(--text-secondary);
    font-size: .95rem;
    font-weight: 800;
}

.empty-state-text {
    max-width: 420px;
    color: var(--text-muted);
    font-size: .82rem;
    line-height: 1.7;
}

/* ---------- BADGES ---------- */

.badge,
.status-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: .3rem;
    min-height: 26px;
    padding: .2rem .55rem;
    border: 1px solid transparent;
    border-radius: 999px;
    font-size: .7rem;
    font-weight: 800;
    line-height: 1.3;
    white-space: nowrap;
}

.badge.success,
.status-badge.success,
.badge.green {
    border-color: var(--success-border);
    background: var(--success-soft);
    color: var(--success-color);
}

.badge.warning,
.status-badge.warning,
.badge.yellow {
    border-color: var(--warning-border);
    background: var(--warning-soft);
    color: var(--warning-color);
}

.badge.danger,
.status-badge.danger,
.badge.red {
    border-color: var(--danger-border);
    background: var(--danger-soft);
    color: var(--danger-color);
}

.badge.info,
.status-badge.info,
.badge.blue {
    border-color: var(--info-border);
    background: var(--info-soft);
    color: var(--info-color);
}

.badge.neutral,
.status-badge.neutral,
.badge.gray {
    border-color: var(--border-color);
    background: var(--surface-hover);
    color: var(--text-secondary);
}

/* ---------- DASHBOARD STATUS CARDS ---------- */

.dashboard-status-card {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: .55rem;
    min-width: 0;
    padding: 1rem;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    background: var(--surface-card);
    color: var(--text-primary);
    text-align: right;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition:
        transform .18s ease,
        border-color .18s ease,
        background-color .18s ease,
        box-shadow .18s ease;
}

.dashboard-status-card:hover {
    transform: translateY(-2px);
    background: var(--surface-hover);
    box-shadow: var(--shadow-md);
}

.dashboard-status-card:focus-visible {
    outline: 2px solid var(--accent-color);
    outline-offset: 2px;
}

.dashboard-status-card-head {
    display: flex;
    align-items: center;
    gap: .55rem;
    color: var(--text-secondary);
    font-size: .8rem;
    font-weight: 800;
}

.dashboard-status-card > strong {
    color: var(--text-primary);
    font-size: 1.65rem;
    font-weight: 900;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
}

.dashboard-status-card > small {
    color: var(--text-muted);
    font-size: .7rem;
    line-height: 1.5;
}

.dashboard-status-sticker {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: var(--surface-hover);
    color: var(--text-secondary);
    font-weight: 900;
}

.dashboard-status-card.status-green {
    border-color: var(--success-border);
}

.dashboard-status-card.status-yellow {
    border-color: var(--warning-border);
}

.dashboard-status-card.status-red {
    border-color: var(--danger-border);
}

.dashboard-status-card.status-green .dashboard-status-sticker {
    background: var(--success-soft);
    color: var(--success-color);
}

.dashboard-status-card.status-yellow .dashboard-status-sticker {
    background: var(--warning-soft);

           HTML ESCAPE
        ============================================================ */

        function escapeHtml(value) {

            return String(
                value ?? ""
            ).replace(
                /[&<>"']/g,
                character => ({

                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#039;"

                }[character])
            );

        }


        /* ============================================================
           NUMBER
        ============================================================ */

        function toNumber(value) {

            if (
                value === null ||
                value === undefined ||
                value === ""
            ) {

                return 0;

            }


            const normalized =
                String(value)
                    .replace(
                        /,/g,
                        ""
                    )
                    .replace(
                        /٬/g,
                        ""
                    )
                    .replace(
                        /،/g,
                        ""
                    )
                    .replace(
                        /۰/g,
                        "0"
                    )
                    .replace(
                        /۱/g,
                        "1"
                    )
                    .replace(
                        /۲/g,
                        "2"
                    )
                    .replace(
                        /۳/g,
                        "3"
                    )
                    .replace(
                        /۴/g,
                        "4"
                    )
                    .replace(
                        /۵/g,
                        "5"
                    )
                    .replace(
                        /۶/g,
                        "6"
                    )
                    .replace(
                        /۷/g,
                        "7"
                    )
                    .replace(
                        /۸/g,
                        "8"
                    )
                    .replace(
                        /۹/g,
                        "9"
                    );


            const number =
                Number(normalized);


            return Number.isFinite(number)
                ? number
                : 0;

        }


        function formatNumber(value) {

            return toNumber(value)
                .toLocaleString(
                    "fa-IR"
                );

        }

        /* ============================================================
           API ERROR
        ============================================================ */

        function normalizeApiError(
            data,
            status
        ) {

            const apiError =
                data &&
                    data.error
                    ? data.error
                    : null;


            if (apiError) {

                return {

                    code:
                        apiError.code ||
                        "API-ERROR",

                    message:
                        apiError.message ||
                        "خطایی در سامانه رخ داد.",

                    status

                };

            }


            const messages = {

                400:
                    "درخواست ارسال‌شده معتبر نیست.",

                401:
                    "نشست شما معتبر نیست. لطفاً دوباره وارد شوید.",

                403:
                    "شما مجوز انجام این عملیات را ندارید.",

                404:
                    "اطلاعات یا مسیر موردنظر پیدا نشد.",

                409:
                    "این اطلاعات با داده‌های موجود تداخل دارد.",

                422:
                    "اطلاعات واردشده معتبر نیست.",

                500:
                    "خطای داخلی سامانه رخ داده است.",

                502:
                    "Worker پاسخ معتبر دریافت نکرد.",

                503:
                    "سرویس سامانه موقتاً در دسترس نیست."

            };


            return {

                code:
                    "HTTP-" +
                    String(status || "UNKNOWN"),

                message:
                    messages[status] ||
                    "عملیات در سامانه انجام نشد.",

                status

            };

        }


        /* ============================================================
           API REQUEST
        ============================================================ */

        async function apiRequest(
            path,
            options = {}
        ) {

            const method =
                options.method ||
                "GET";


            const auth =
                options.auth !== false;


            const body =
                options.body !== undefined
                    ? options.body
                    : null;


            const token =
                STATE.token ||
                readToken();


            const headers = {

                "Accept":
                    "application/json"

            };


            if (
                body !== null &&
                !(body instanceof FormData)
            ) {

                headers[
                    "Content-Type"
                ] =
                    "application/json";

            }


            if (
                auth &&
                token
            ) {

                headers.Authorization =
                    "Bearer " +
                    token;

            }


            const controller =
                new AbortController();


            const timeout =
                setTimeout(
                    () => controller.abort(),
                    CONFIG.TIMEOUT
                );


            setLoading(
                true,
                options.loadingText ||
                "در حال ارتباط با سامانه..."
            );


            try {

                const response =
                    await fetch(
                        CONFIG.API + path,
                        {

                            method,

                            headers,

                            body:
                                body === null
                                    ? undefined
                                    : (
                                        body instanceof FormData
                                            ? body
                                            : JSON.stringify(body)
                                    ),

                            signal:
                                controller.signal,

                            cache:
                                "no-store"

                        }
                    );


                let data = null;


                try {

                    data =
                        await response.json();

                }

                catch {

                    data = null;

                }


                if (
                    response.status === 401
                ) {

                    clearAuthentication();


                    if (
                        !options.skipAuthRedirect
                    ) {

                        showMessage(
                            "نشست شما منقضی شده است. در حال انتقال به صفحه ورود...",
                            "error"
                        );


                        setTimeout(
                            () => {

                                window.location.href =
                                    CONFIG.LOGIN_PAGE;

                            },
                            700
                        );

                    }


                    throw normalizeApiError(
                        data,
                        401
                    );

                }


                if (!response.ok) {

                    throw normalizeApiError(
                        data,
                        response.status
                    );

                }


                if (
                    data &&
                    data.success === false
                ) {

                    throw {

                        code:
                            data.error?.code ||
                            "API-ERROR",

                        message:
                            data.error?.message ||
                            "عملیات انجام نشد.",

                        status:
                            response.status

                    };

                }


                return data || {};

            }

            catch (error) {

                if (
                    error &&
                    error.code
                ) {

                    throw error;

                }


                if (
                    error &&
                    error.name ===
                    "AbortError"
                ) {

                    throw {

                        code:
                            "NET-TIMEOUT",

                        message:
                            "زمان پاسخ‌گویی Worker به پایان رسید.",

                        status: 0

                    };

                }


                throw {

                    code:
                        "NET-ERROR",

                    message:
                        "ارتباط با Worker برقرار نشد. اتصال اینترنت و آدرس Worker را بررسی کنید.",

                    status: 0,

                    original:
                        error

                };

            }

            finally {

                clearTimeout(
                    timeout
                );

                setLoading(
                    false
                );

            }

        }

        /* ============================================================
           NUMBER TO PERSIAN WORDS
        ============================================================ */

        const PERSIAN_ONES = [

            "",
            "یک",
            "دو",
            "سه",
            "چهار",
            "پنج",
            "شش",
            "هفت",
            "هشت",
            "نه"

        ];


        const PERSIAN_TEENS = [

            "ده",
            "یازده",
            "دوازده",
            "سیزده",
            "چهارده",
            "پانزده",
            "شانزده",
            "هفده",
            "هجده",
            "نوزده"

        ];


        const PERSIAN_TENS = [

            "",
            "",
            "بیست",
            "سی",
            "چهل",
            "پنجاه",
            "شصت",
            "هفتاد",
            "هشتاد",
            "نود"

        ];


        const PERSIAN_HUNDREDS = [

            "",
            "صد",
            "دویست",
            "سیصد",
            "چهارصد",
            "پانصد",
            "ششصد",
            "هفتصد",
            "هشتصد",
            "نهصد"

        ];


        const PERSIAN_SCALES = [

            "",
            "هزار",
            "میلیون",
            "میلیارد",
            "تریلیون"

        ];


        function threeDigitWords(
            number
        ) {

            number =
                Math.floor(number);


            if (number === 0) {

                return "";

            }


            const parts = [];


            const hundreds =
                Math.floor(
                    number / 100
                );


            const rest =
                number % 100;


            if (hundreds) {

                parts.push(
                    PERSIAN_HUNDREDS[
                    hundreds
                    ]
                );

            }


            if (rest) {

                if (rest < 10) {

                    parts.push(
                        PERSIAN_ONES[
                        rest
                        ]
                    );

                }

                else if (rest < 20) {

                    parts.push(
                        PERSIAN_TEENS[
                        rest - 10
                        ]
                    );

                }

                else {

                    const tens =
                        Math.floor(
                            rest / 10
                        );


                    const ones =
                        rest % 10;


                    if (tens) {

                        parts.push(
                            PERSIAN_TENS[
                            tens
                            ]
                        );

                    }


                    if (ones) {

                        parts.push(
                            PERSIAN_ONES[
                            ones
                            ]
                        );

                    }

                }

            }


            return parts.join(
                " و "
            );

        }



        function numberToPersianWords(
            value
        ) {

            let number =
                toNumber(value);


            if (number === 0) {

                return "صفر";

            }


            if (number < 0) {

                return (
                    "منفی " +
                    numberToPersianWords(
                        Math.abs(number)
                    )
                );

            }


            if (
                !Number.isInteger(number)
            ) {

                return "عدد اعشاری";

            }


            const groups = [];


            while (number > 0) {

                groups.push(
                    number % 1000
                );

                number =
                    Math.floor(
                        number / 1000
                    );

            }


            const result = [];


            for (
                let i = groups.length - 1;
                i >= 0;
                i--
            ) {

                if (!groups[i]) {

                    continue;

                }


                const text =
                    threeDigitWords(
                        groups[i]
                    );


                if (
                    PERSIAN_SCALES[i]
                ) {

                    result.push(
                        text +
                        " " +
                        PERSIAN_SCALES[i]
                    );

                }

                else {

                    result.push(
                        text
                    );

                }

            }


            return result.join(
                " و "
            );

        }

        function populateSelect(
            selector,
            items,
            valueField,
            labelFunction,
            placeholder = "انتخاب کنید"
        ) {

            const selects =
                $$(selector);


            selects.forEach(
                select => {

                    const oldValue =
                        select.value;


                    select.innerHTML =
                        "";


                    const first =
                        document.createElement(
                            "option"
                        );


                    first.value =
                        "";


                    first.textContent =
                        placeholder;


                    select.appendChild(
                        first
                    );


                    items.forEach(
                        item => {

                            const option =
                                document.createElement(
                                    "option"
                                );


                            option.value =
                                item[valueField];


                            option.textContent =
                                labelFunction(item);


                            select.appendChild(
                                option
                            );

                        }
                    );


                    if (oldValue) {

                        select.value =
                            oldValue;

                    }

                }
            );

        }

        /*
         * تبدیل میلادی به جلالی
         * الگوریتم داخلی تا Frontend برای تبدیل تاریخ
         * به سرویس دیگری وابسته نباشد.
         */

        function gregorianToJalali(
            gy,
            gm,
            gd
        ) {

            const gdm = [

                0,
                31,
                59,
                90,
                120,
                151,
                181,
                212,
                243,
                273,
                304,
                334

            ];


            let jy;


            if (gy > 1600) {

                jy = 979;

                gy -= 1600;

            }

            else {

                jy = 0;

                gy -= 621;

            }


            const gy2 =
                gm > 2
                    ? gy + 1
                    : gy;


            let days =
                (
                    365 * gy
                )
                +
                Math.floor(
                    (gy2 + 3) / 4
                )
                -
                Math.floor(
                    (gy2 + 99) / 100
                )
                +
                Math.floor(
                    (gy2 + 399) / 400
                )
                -
                80
                +
                gd
                +
                gdm[gm - 1];


            jy +=
                33 *
                Math.floor(
                    days / 12053
                );


            days %=
                12053;


            jy +=
                4 *
                Math.floor(
                    days / 1461
                );


            days %=
                1461;


            if (days > 365) {

                jy +=
                    Math.floor(
                        (days - 1) / 365
                    );


                days =
                    (days - 1) % 365;

            }


            const jm =
                days < 186
                    ? 1 +
                    Math.floor(
                        days / 31
                    )
                    : 7 +
                    Math.floor(
                        (days - 186) / 30
                    );


            const jd =
                1 +
                (
                    days < 186
                        ? days % 31
                        : (days - 186) % 30
                );


            return {

                jy,
                jm,
                jd

            };

        }


        function jalaliToGregorian(
            jy,
            jm,
            jd
        ) {

            jy =
                Number(jy);

            jm =
                Number(jm);

            jd =
                Number(jd);


            let gy;


            if (jy > 979) {

                gy = 1600;

                jy -= 979;

            }

            else {

                gy = 621;

            }


            let days =
                365 * jy
                +
                Math.floor(
                    jy / 33
                ) * 8
                +
                Math.floor(
                    (
                        jy % 33
                        + 3
                    ) / 4
                )
                +
                78
                +
                jd
                +
                (
                    jm < 7
                        ? (jm - 1) * 31
                        : (jm - 7) * 30 + 186
                );


            gy +=
                400 *
                Math.floor(
                    days / 146097
                );


            days %=
                146097;


            if (days > 36524) {

                gy +=
                    100 *
                    Math.floor(
                        --days / 36524
                    );


                days %=
                    36524;


                if (days >= 365) {

                    days++;

                }

            }


            gy +=
                4 *
                Math.floor(
                    days / 1461
                );


            days %=
                1461;


            if (days > 365) {

                gy +=
                    Math.floor(
                        (days - 1) / 365
                    );


                days =
                    (days - 1) % 365;

            }


            let gd =
                days + 1;


            const leap =
                (
                    gy % 4 === 0 &&
                    gy % 100 !== 0
                )
                ||
                gy % 400 === 0;


            const monthDays = [

                0,

                31,

                leap ? 29 : 28,

                31,

                30,

                31,

                30,

                31,

                31,

                30,

                31,

                30,

                31

            ];


            let gm = 1;


            while (
                gd >
                monthDays[gm]
            ) {

                gd -=
                    monthDays[gm];

                gm++;

            }


            return {

                gy,
                gm,
                gd

            };

        }


        /* ============================================================
           DATE PARSE
        ============================================================ */

        function normalizeDateDigits(
            value
        ) {

            return String(
                value || ""
            )
                .replace(
                    /۰/g,
                    "0"
                )
                .replace(
                    /۱/g,
                    "1"
                )
                .replace(
                    /۲/g,
                    "2"
                )
                .replace(
                    /۳/g,
                    "3"
                )
                .replace(
                    /۴/g,
                    "4"
                )
                .replace(
                    /۵/g,
                    "5"
                )
                .replace(
                    /۶/g,
                    "6"
                )
                .replace(
                    /۷/g,
                    "7"
                )
                .replace(
                    /۸/g,
                    "8"
                )
                .replace(
                    /۹/g,
                    "9"
                );

        }

        function jalaliDisplayToApi(
            value
        ) {

            value =
                normalizeDateDigits(
                    value
                ).trim();


            if (
                !/^\d{4}\/\d{1,2}\/\d{1,2}$/.test(
                    value
                )
            ) {

                return "";

            }


            const parts =
                value.split("/")
                    .map(Number);


            return [
                parts[0],
                pad2(parts[1]),
                pad2(parts[2])

            ].join("/");

        }


        function apiDateToJalali(
            value
        ) {

            if (!value) {

                return "";

            }


            const match =
                String(value)
                    .match(
                        /^(\d{4})-(\d{1,2})-(\d{1,2})/
                    );


            if (!match) {

                return String(value);

            }


            const g =
                gregorianToJalali(
                    Number(match[1]),
                    Number(match[2]),
                    Number(match[3])
                );


            return [
                g.jy,
                pad2(g.jm),
                pad2(g.jd)

            ].join("/");

        }


        /* ============================================================
           PERSIAN DATEPICKER
        ============================================================ */

        function initPersianDatePickers() {

            if (
                typeof window.jQuery ===
                "undefined"
            ) {

                return;

            }


            if (
                typeof jQuery.fn.pDatepicker !==
                "function"
            ) {

                return;

            }


            const inputs = [

                ...$$(".jalali-date"),

                ...$$(
                    'input[data-date-type="jalali"]'
                ),

                ...$$(
                    'input[name*="date" i]'
                ),

                ...$$(
                    'input[id*="date" i]'
                )

            ];


            const uniqueInputs =
                [...new Set(inputs)];


            uniqueInputs.forEach(
                input => {

                    if (
                        !input ||
                        input.tagName !== "INPUT" ||
                        input.type !== "text"
                    ) {

                        return;

                    }


                    if (
                        input.dataset
                            .persianDateReady === "1"
                    ) {

                        return;

                    }


                    input.classList.add(
                        "jalali-date"
                    );


                    input.setAttribute(
                        "autocomplete",
                        "off"
                    );

                    const $ =
                        window.jQuery;

                    const jQuery =
                        window.jQuery;

                    jQuery(input).pDatepicker({

                        format:
                            "YYYY/MM/DD",

                        autoClose:
                            true,

                        initialValue:
                            false,

                        persianDigit:
                            true,

                        calendarType:
                            "persian",

                        observer:
                            true,

                        responsive:
                            true

                    });


                    input.dataset
                        .persianDateReady = "1";

                }
            );

        }

            message
        ) {

                form.elements[fieldName];


            if (field) {

                field.classList.add(
                    "has-error"
                );

            }


            const error =
                form.querySelector(
                    `[data-error-for="${fieldName}"]`
                );


            if (error) {

                error.textContent =

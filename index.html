            }

        }


        function requiredValue(
            form,
            fieldName,
            label
        ) {

            const field =
                form.elements[fieldName];


            if (!field) {

                return null;

            }


            const value =
                String(
                    field.value ?? ""
                ).trim();


            if (!value) {

                setFieldError(
                    form,
                    fieldName,
                    `${label} الزامی است.`
                );


                return null;

            }


            return value;

        }


        /* ============================================================
           FORM VALUE
        ============================================================ */

        function numericValue(
            form,
            fieldName
        ) {

            const field =
                form.elements[fieldName];


            if (!field) {

                return 0;

            }


            return toNumber(
                field.value
            );

        }


        function selectNumericValue(
            form,
            fieldName
        ) {

            const field =
                form.elements[fieldName];


            if (
                !field ||
                !field.value
            ) {

                return null;

            }


            const value =
                Number(field.value);


            return Number.isFinite(value)
                ? value
                : null;

        }


        /* ============================================================
           DATE VALUE
        ============================================================ */

        function dateValue(
            form,
            fieldName,
            required = false
        ) {

            const field =
                form.elements[fieldName];


            if (!field) {

                return null;

            }


            const value =
                field.value.trim();


            if (
                required &&
                !value
            ) {

                setFieldError(
                    form,
                    fieldName,
                    "تاریخ الزامی است."
                );


                return null;

            }


            if (!value) {

                return null;

            }


            const apiDate =
                jalaliDisplayToApi(
                    value
                );


            if (!apiDate) {

                setFieldError(
                    form,
                    fieldName,
                    "تاریخ واردشده معتبر نیست."
                );


                return null;

            }


            return apiDate;

        }


        /* ============================================================
           FORM DATA OBJECT
        ============================================================ */

        function formObject(
            form
        ) {

            const result = {};


            Array.from(
                form.elements
            ).forEach(
                element => {

                    if (
                        !element.name ||
                        element.disabled
                    ) {

                        return;

                    }


                    if (
                        element.type ===
                        "checkbox"
                    ) {

                        result[
                            element.name
                        ] =
                            element.checked;

                    }

                    else if (
                        element.type ===
                        "radio"
                    ) {

                        if (element.checked) {

                            result[
                                element.name
                            ] =
                                element.value;

                        }

                    }

                    else {

                        result[
                            element.name
                        ] =
                            element.value;

                    }

                }
            );


            return result;

        }

        /* ============================================================
           TABLE BUILDER
        ============================================================ */

        function buildTable(
            columns,
            rows,
            options = {}
        ) {

            const safeRows =
                Array.isArray(rows)
                    ? rows
                    : [];


            /* ---------------------------------------------------------
               TABLE TOOLBAR
            --------------------------------------------------------- */

            let toolbarHtml = "";


            if (
                options.exportExcel !== false &&
                safeRows.length
            ) {

                toolbarHtml = `

                        <div class="table-toolbar">

                            <button
                                type="button"
                                class="btn secondary small"
                                data-table-export="excel"
                            >
                                📊 خروجی Excel
                            </button>

                        </div>

                    `;

            }


            /* ---------------------------------------------------------
               EMPTY STATE
            --------------------------------------------------------- */

            if (!safeRows.length) {

                return `

                        ${toolbarHtml}

                        ${emptyState(
                    options.empty ||
                    "اطلاعاتی ثبت نشده است."
                )}

                    `;

            }


            /* ---------------------------------------------------------
               TABLE
            --------------------------------------------------------- */

            let html = `

                    ${toolbarHtml}

                    <div class="table-container">

                        <table
                            class="data-table"
                            data-exportable="true"
                        >

                            <thead>

                                <tr>

                `;


            columns.forEach(
                column => {

                    html += `
                            <th>
                                ${escapeHtml(
                        column.label
                    )}
                            </th>
                        `;

                }
            );


            if (options.actions) {

                html += `
                        <th>
                            عملیات
                        </th>
                    `;

            }


            html += `

                                </tr>

                            </thead>

                            <tbody>

                `;


            safeRows.forEach(
                row => {

                    html += "<tr>";


                    columns.forEach(
                        column => {

                            let value;


                            if (
                                typeof column.value ===
                                "function"
                            ) {

                                value =
                                    column.value(row);

                            }

                            else {

                                value =
                                    row[
                                    column.value
                                    ];

                            }


                            if (
                                column.type ===
                                "number"
                            ) {

                                value =
                                    formatNumber(
                                        value
                                    );

                            }


                            if (
                                column.type ===
                                "date"
                            ) {

                                value =
                                    apiDateToJalali(
                                        value
                                    );

                            }


                            if (
                                column.type ===
                                "badge"
                            ) {

                                value =
                                    statusBadge(
                                        value
                                    );

                            }


                            html += `

                                    <td>

                                        ${column.raw
                                    ? String(
                                        value ?? ""
                                    )
                                    : escapeHtml(
                                        value ??
                                        "-"
                                    )
                                }

                                    </td>

                                `;

                        }
                    );



                    if (options.actions) {

                        html += `

                    <td>

                        <div class="toolbar">

                            <button
                                type="button"
                                class="btn small secondary"
                                data-action="edit"
                                data-id="${row.id}"
                            >
                                ویرایش
                            </button>

                            <button
                                type="button"
                                class="btn small danger"
                                data-action="delete"
                                data-id="${row.id}"
                            >
                                حذف
                            </button>

                            ${typeof options.rowActions ===
                                "function"
                                ? options.rowActions(row)
                                : ""
                            }

                        </div>

                    </td>

                `;

                    }

                    html += "</tr>";

                }
            );


            html += `

                            </tbody>

                        </table>

                    </div>

                `;


            return html;

        }

        /* ============================================================
           EXPORT TABLE TO EXCEL
        ============================================================ */

        function exportTableToExcel(
            table,
            fileName = "export.xlsx"
        ) {

            if (!table) {

                showMessage(
                    "جدولی برای خروجی گرفتن پیدا نشد.",
                    "error"
                );

                return;

            }


            const rows = [];


            /* ---------------------------------------------------------
               HEADER
            --------------------------------------------------------- */

            const headers =
                Array.from(
                    table.querySelectorAll(
                        "thead th"
                    )
                )
                    .map(
                        th =>
                            th.innerText
                                .trim()
                    );


            /*
               ستون عملیات برای Excel کاربردی ندارد.
               بنابراین اگر وجود داشت حذفش می‌کنیم.
            */

            if (
                headers[
                headers.length - 1
                ] === "عملیات"
            ) {

                headers.pop();

            }


            rows.push(headers);


            /* ---------------------------------------------------------
               BODY
            --------------------------------------------------------- */

            table
                .querySelectorAll(
                    "tbody tr"
                )
                .forEach(
                    tr => {

                        const cells =
                            Array.from(
                                tr.querySelectorAll(
                                    "td"
                                )
                            )
                                .map(
                                    td =>
                                        td.innerText
                                            .trim()
                                );


                        if (
                            cells[
                            cells.length - 1
                            ] === ""
                        ) {

                            return;

                        }


                        if (
                            cells.length >
                            headers.length
                        ) {

                            cells.splice(
                                headers.length
                            );

                        }


                        rows.push(
                            cells
                        );

                    }
                );


            /* ---------------------------------------------------------
               CREATE CSV
               Excel can open UTF-8 CSV correctly.
            --------------------------------------------------------- */

            const csv =
                rows
                    .map(
                        row =>
                            row
                                .map(
                                    value => {

                                        const text =
                                            String(
                                                value ??
                                                ""
                                            );


                                        return `"${text
                                            .replace(
                                                /"/g,
                                                '""'
                                            )}"`;

                                    }
                                )
                                .join(",")
                    )
                    .join("\r\n");


            /* ---------------------------------------------------------
               UTF-8 BOM
               Required for correct Persian display in Excel.
            --------------------------------------------------------- */

            const blob =
                new Blob(

                    [
                        "\uFEFF",
                        csv
                    ],

                    {
                        type:
                            "text/csv;charset=utf-8;"
                    }

                );


            const url =
                URL.createObjectURL(
                    blob
                );


            const link =
                document.createElement(
                    "a"
                );


            link.href =
                url;


            link.download =
                fileName
                    .replace(
                        /\.xlsx$/i,
                        ".csv"
                    );


            document.body.appendChild(
                link
            );


            link.click();


            link.remove();


            URL.revokeObjectURL(
                url
            );

        }

        /* ============================================================
           TABLE EXPORT EVENT
        ============================================================ */

        document.addEventListener(
            "click",
            event => {

                const button =
                    event.target.closest(
                        "[data-table-export='excel']"
                    );


                if (!button) {

                    return;

                }


                /* -----------------------------------------------------
                   FIND TABLE
                ----------------------------------------------------- */

                let parent =
                    button.parentElement;

                let table =
                    null;


                while (
                    parent &&
                    !table
                ) {

                    table =
                        parent.querySelector(
                            "table.data-table"
                        );


                    if (table) {

                        break;

                    }


                    parent =
                        parent.parentElement;

                }


                /* -----------------------------------------------------
                   TABLE NOT FOUND
                ----------------------------------------------------- */

                if (!table) {

                    showMessage(
                        "جدول برای خروجی Excel پیدا نشد.",
                        "error"
                    );

                    return;

                }


                /* -----------------------------------------------------
                   FILE NAME
                ----------------------------------------------------- */

                const date =
                    new Date()
                        .toISOString()
                        .slice(
                            0,
                            10
                        );


                const fileName =
                    `export-${date}.csv`;


                /* -----------------------------------------------------
                   EXPORT
                ----------------------------------------------------- */

                exportTableToExcel(
                    table,
                    fileName
                );

            }
        );
        /* ============================================================

        ============================================================ */

        function statusBadge(
            status
        ) {

            const value =
                String(
                    status ||
                    ""
                );


            let type =
                "info";


            if (
                /فعال|active|completed|complete|done|approved/i
                    .test(value)
            ) {

                type =
                    "success";

            }

            else if (
                /غیرفعال|inactive|cancel|rejected|error/i
                    .test(value)
            ) {

                type =
                    "danger";

            }

            else if (
                /pending|در انتظار|draft|پیش‌نویس/i
                    .test(value)
            ) {

                type =
                    "warning";

            }


            return `

                    <span class="badge ${type}">

                        ${escapeHtml(
                value || "-"
            )}

                    </span>

                `;

        }

            ).forEach(

                        "click",

                            const id =
                                Number(

                                id
                            );

        /* ============================================================
           DELETE ENTITY
        ============================================================ */

        async function deleteEntity(
            entityName,
            id
        ) {

            const config =
                ENTITY_CONFIG[
                entityName
                ];


            if (!config) {

                return;

            }


            const item =
                STATE[
                    entityName
                ].find(
                    x =>
                        Number(x.id) ===
                        Number(id)
                );


            const name =
                item?.name ||
                item?.code ||
                id;


            if (
                !window.confirm(
                    `آیا از حذف «${name}» اطمینان دارید؟`
                )
            ) {

                return;

            }


            try {

                await apiRequest(
                    `${config.endpoint}/${encodeURIComponent(id)}`,
                    {

                        method: "DELETE",

                        loadingText:
                            "در حال حذف اطلاعات..."

                    }
                );


                showMessage(
                    "اطلاعات با موفقیت حذف شد.",
                    "success"
                );


                await loadCollection(
                    entityName,
                    config.endpoint,
                    config.title
                );


                await openView(
                    entityName
                );

            }

            catch (error) {

                showMessage(
                    error.message ||
                    "حذف اطلاعات انجام نشد.",
                    "error"
                );

            }

        }

        async function submitUnitForm(
            event,
            editing
        ) {

            event.preventDefault();


            const form =
                event.currentTarget;


            clearFormErrors(form);


            const code =
                requiredValue(
                    form,
                    "code",
                    "کد واحد"
                );


            const name =
                requiredValue(
                    form,
                    "name",
                    "نام واحد"
                );


            if (
                !code ||
                !name
            ) {

                return;

            }


            const data = {

                code,

                name

            };


            try {

                const result =
                    await apiRequest(
                        editing
                            ? `/api/units/${encodeURIComponent(form.id.value)}`
                            : "/api/units",
                        {

                            method:
                                editing
                                    ? "PUT"
                                    : "POST",

                            body: data,

                            loadingText:
                                editing
                                    ? "در حال ویرایش واحد..."
                                    : "در حال ثبت واحد..."

                        }
                    );


                showMessage(
                    result.message ||
                    (
                        editing
                            ? "واحد ویرایش شد."
                            : "واحد ثبت شد."
                    )
                );


                closeModal();


                await loadCollection(
                    "units",
                    "/api/units",
                    "واحدها"
                );


                refreshAllDropdowns();


                renderEntityView(
                    "units"
                );

            }

            catch (error) {

                showMessage(
                    error.message,
                    "error"
                );

            }

        }

            clearFormErrors(form);


            const code =
                requiredValue(
                    form,
                    "code",
                    "کد محصول"

                requiredValue(
                    form,
                    "name",
                    "نام محصول"
                );


            const unitId =

                );


            if (!unitId) {

                setFieldError(
                    form,
                    "unit_id",
                    "واحد محصول را انتخاب کنید."

            if (
                !code ||
                !name ||

                    await apiRequest(
                        "/api/products",
                        {

                                        ? Number(

        /* ============================================================

        ============================================================ */

        async function submitBomDetailForm(event) {

            event.preventDefault();

            const form =
                event.currentTarget;

            clearFormErrors(form);


            /* ---------------------------------------------------------
               BOM
            --------------------------------------------------------- */

            const bomId =
                Number(
                    form.elements.bom_id.value
                );


            /* ---------------------------------------------------------
               PART
            --------------------------------------------------------- */

            const partId =
                selectNumericValue(
                    form,
                    "part_id"
                );


            if (!bomId) {

                showMessage(
                    "BOM معتبر انتخاب نشده است.",
                    "error"
                );

                return;
            }


            if (!partId) {

                setFieldError(
                    form,
                    "part_id",
                    "قطعه را انتخاب کنید."
                );

            }


            /* ---------------------------------------------------------
               CONSUMPTION FACTOR
            --------------------------------------------------------- */

            const factor =
                numericValue(
                    form,
                    "consumption_factor"
                );


            if (factor <= 0) {

                setFieldError(
                    form,
                    "consumption_factor",
                    "ضریب مصرف باید بیشتر از صفر باشد."
                );

            }


            if (
                !partId ||
                factor <= 0
            ) {

                return;
            }


            /* ---------------------------------------------------------
               SCRAP
            --------------------------------------------------------- */

            const scrap =
                Math.max(
                    0,
                    Math.min(
                        100,
                        numericValue(
                            form,
                            "scrap_percent"
                        )
                    )
                );

                            );


                        if (!button) {

                            return;

                        }


                        const action =
                            button.dataset.action;


                        const id =
                            Number(
                                button.dataset.id
                            );


                        const row =
                            STATE.planning.find(
                                item =>
                                    Number(item.id) === id
                            );


                        if (!row) {

                            showMessage(
                                "رکورد برنامه تولید پیدا نشد.",
                                "error"
                            );

                            return;

                        }


                        if (
                            action ===
                            "edit"
                        ) {

                            openPlanningForm(
                                row
                            );

                            return;

                        }
                        if (
                            action ===
                            "material-request"
                        ) {

                            return;

                        if (

                                toNumber(

                                    "این برنامه تولید هنوز هیچ تولیدی ندارد و به طور کامل حذف خواهد شد.";

                                    `مقدار نهایی برنامه: ${formatNumber(producedQuantity)}`;

                                return;

                            }

                                        `/api/planning/${id}`,

        async function submitPlanningForm(
            event,
            editing
        ) {

            event.preventDefault();


            const form =
                event.currentTarget;


            clearFormErrors(form);


            const planDate =
                dateValue(
                    form,
                    "plan_date",
                    true
                );


            const bomId =
                selectNumericValue(
                    form,
                    "bom_id"
                );


            const quantity =
                numericValue(
                    form,
                    "planned_quantity"
                );


            if (!bomId) {

                setFieldError(
                    form,
                    "bom_id",
                    "BOM را انتخاب کنید."
                );

            }


            if (quantity <= 0) {

                setFieldError(
                    form,
                    "planned_quantity",
                    "مقدار تولید باید بیشتر از صفر باشد."
                );

            }


            if (
                !planDate ||
                !bomId ||
                quantity <= 0
            ) {

                return;

            }


            try {

                const result =
                    await apiRequest(
                        editing
                            ? `/api/planning/${encodeURIComponent(form.id.value)}`
                            : "/api/planning",
                        {

                            method:
                                editing
                                    ? "PUT"
                                    : "POST",

                            body: {

                                plan_date:
                                    planDate,

                                bom_id:
                                    bomId,

                                planned_quantity:
                                    quantity

                            },

                            loadingText:
                                editing
                                    ? "در حال ویرایش برنامه..."
                                    : "در حال ثبت برنامه..."

                        }
                    );


                showMessage(
                    result.message ||
                    "برنامه تولید ذخیره شد."
                );


                closeModal();


                await loadCollection(
                    "planning",
                    "/api/planning",
                    "برنامه تولید"
                );


                refreshAllDropdowns();


                renderPlanningView();

            }

            catch (error) {

                showMessage(
                    error.message,
                    "error"
                );

            }

        }

            !values.day

const createDateFromPersian =
    (
        year,
        month,
        day
    ) => {

        /*
         * Persian year 1405 is approximately Gregorian 2026.
         * Start close to the expected Gregorian year and search
         * forward until Intl confirms the exact Persian date.
         */

        let date =
            new Date(
                Date.UTC(
                    year + 621,
                    month - 1,
                    day
                )
            );


        for (
            let i = 0;
            i < 370;
            i++
        ) {

            const current =
                getPersianParts(
                    date
                );


            if (
                current &&
                current.year === year &&
                current.month === month &&
                current.day === day
            ) {

                return date;

            }


            date.setUTCDate(
                date.getUTCDate() + 1
            );

        }


        return null;

    };

    const getMonthDays =
        (
            year,
            month
        ) => {

            const days = [];


            const firstDate =
                createDateFromPersian(
                    year,
                    month,
                    1
                );


          if (!firstDate) {

    return {

        days: [],

        firstWeekday: 0

    };

}


            /*
             * Persian calendar week:
             *
             * شنبه = 0
             * یکشنبه = 1
             * دوشنبه = 2
             * سه‌شنبه = 3
             * چهارشنبه = 4
             * پنجشنبه = 5
             * جمعه = 6
             */

            const gregorianWeekday =
                firstDate.getUTCDay();


            const persianWeekday =
                (
                    gregorianWeekday + 1
                ) % 7;


            let current =
                new Date(
                    firstDate.getTime()
                );


            for (
                let day = 1;
                day <= 31;
                day++
            ) {

                const parts =
                    getPersianParts(
                        current
                    );


                if (
                    !parts ||
                    parts.year !== year ||
                    parts.month !== month
                ) {

                    break;

                }


                days.push({

                    day,

                    weekday:
                        day === 1
                            ? persianWeekday
                            : (
                                persianWeekday +
                                day -
                                1
                            ) % 7,

                    date:
                        new Date(
                            current.getTime()
                        )

                });


                current.setUTCDate(
                    current.getUTCDate() + 1
                );

            }


            return {

                days,

                firstWeekday:
                    persianWeekday

            };

        };


    const moveMonth =
        (
            year,
            month,
            delta
        ) => {

            let newYear =
                year;

            let newMonth =
                month +
                delta;


            while (
                newMonth < 1
            ) {

                newMonth += 12;
                newYear--;

            }


            while (
                newMonth > 12
            ) {

                newMonth -= 12;
                newYear++;

            }


            return {

                year:
                    newYear,

                month:
                    newMonth

            };

        };


    const getMonthName =
        (
            year,
            month
        ) => {

            const date =
                createDateFromPersian(
                    year,
                    month,
                    1
                );


            if (!date) {

                return "";

            }


            return persianMonthFormatter
                .format(
                    date
                )
                .replace(
                    /۱۴۰[۰-۹]|۱۴[۰-۹]{2}/g,
                    ""
                )
                .trim();

        };

        async function loadDashboardDetails(
            planningId,
            productId
        ) {

            try {

                /*
                 * اول مودال لیست داشبورد را می‌بندیم
                 * تا مودال جزئیات روی آن باز نشود.
                 */
                closeDashboardModal();


                const params =
                    new URLSearchParams();


                if (
                    planningId
                ) {

                    params.set(
                        "planning_id",
                        planningId
                    );

                }


                if (
                    productId
                ) {

                    params.set(
                        "product_id",
                        productId
                    );

                }


                const queryString =
                    params.toString();


                const result =
                    await apiRequest(
                        `/api/dashboard/details?${queryString}`,
                        {
                            method: "GET",
                            loadingText:
                                "در حال دریافت جزئیات..."
                        }
                    );


                const items =
                    result?.items || [];


                const materials =
                    result?.materials || [];


                showDashboardDetailsModal(

                    items,

                    materials,

                    result?.material_summary || {},

                    result?.production || null,

                    result?.formula || {}

                );

            }
            catch (error) {

                showMessage(
                    error.message,
                    "error"
                );

            }

        }

             *   material = قطعه
             *   general  = محصول خریداری‌شده

                                item.warehouse_type ===
                                "general"
                            );

        /* ============================================================
           INVENTORY MOVEMENT SUBMIT
        ============================================================ */

        async function submitInventoryMovement(
            event,
            type
        ) {

            event.preventDefault();


            const form =
                event.currentTarget;


            clearFormErrors(form);


            // ========================================================
            // WAREHOUSE
            // ========================================================

            const warehouseId =
                selectNumericValue(

                    form,

                    "warehouse_id"

                );


            // ========================================================
            // ITEM
            // ========================================================

            const itemId =
                selectNumericValue(

                    form,

                    "item_id"

                );


            // ========================================================
            // QUANTITY
            // ========================================================

            const quantity =
                numericValue(

                    form,

                    "quantity"

                );


            // ========================================================
            // VALIDATION
            // ========================================================

            if (!warehouseId) {

                setFieldError(

                    form,

                    "warehouse_id",

                    "انبار را انتخاب کنید."

                );

            }


            if (!itemId) {

                setFieldError(

                    form,

                    "item_id",

                    "قلم موجودی را انتخاب کنید."

                );

            }


            if (quantity <= 0) {

                setFieldError(

                    form,

                    "quantity",

                    "مقدار باید بیشتر از صفر باشد."

                );

            }


            if (
                !warehouseId ||
                !itemId ||
                quantity <= 0
            ) {

                return;

            }


            // ========================================================
            // FIND SELECTED WAREHOUSE
            // ========================================================

            const warehouse =
                STATE.warehouses.find(

                    item =>
                        Number(item.id) ===
                        warehouseId

                );


            if (!warehouse) {

                showMessage(

                    "انبار انتخاب‌شده پیدا نشد.",

                    "error"

                );

                return;

            }


            // ========================================================
            // DETERMINE ITEM TYPE
            // ========================================================

            let itemType;


            if (
                warehouse.warehouse_type ===
                "material"
            ) {

                itemType =
                    "part";

            }

            else if (
                warehouse.warehouse_type ===
                "general"
                ||
                warehouse.warehouse_type ===
                "finished"
            ) {

                itemType =
                    "product";

            }

            else {

                showMessage(

                    "نوع انبار انتخاب‌شده برای این عملیات مجاز نیست.",

                    "error"

                );

                return;

            }


            // ========================================================
            // EXTRA SAFETY
            // ========================================================

            if (
                type === "receipt" &&
                warehouse.warehouse_type ===
                "finished"
            ) {

                showMessage(

                    "ورود دستی به انبار محصول نهایی مجاز نیست. محصول نهایی فقط از طریق ثبت تولید وارد انبار می‌شود.",

                    "error"

                );

                return;

            }


            if (
                type === "issue" &&
                warehouse.warehouse_type ===
                "material"
            ) {

                showMessage(

                    "خروج دستی از انبار مواد اولیه مجاز نیست. مصرف مواد اولیه باید بر اساس BOM و از طریق ثبت تولید انجام شود.",

                    "error"

                );

                return;

            }


            // ========================================================
            // ENDPOINT
            // ========================================================

            const endpoint =
                type === "receipt"

                    ? "/api/inventory/receipt"

                    : "/api/inventory/issue";


            // ========================================================
            // REQUEST BODY
            // ========================================================

            const body = {

                warehouse_id:
                    warehouseId,

                quantity,

                reference_type:
                    "manual",

                description:
                    form.description.value
                        .trim() ||
                    (
                        type === "receipt"

                            ? "ورود موجودی"

                            : "خروج موجودی"
                    )

            };


            // --------------------------------------------------------
            // MATERIAL → PART
            // --------------------------------------------------------

            if (
                itemType === "part"
            ) {

                body.part_id =
                    itemId;

            }


            // --------------------------------------------------------
            // GENERAL / FINISHED → PRODUCT
            // --------------------------------------------------------

            if (
                itemType === "product"
            ) {

                body.product_id =
                    itemId;

            }


            // ========================================================
            // API REQUEST
            // ========================================================

            try {

                const result =
                    await apiRequest(

                        endpoint,

                        {

                            method:
                                "POST",

                            body,

                            loadingText:

                                type === "receipt"

                                    ? "در حال ثبت ورود موجودی..."

                                    : "در حال ثبت خروج موجودی..."

                        }

                    );


                // ====================================================
                // SUCCESS
                // ====================================================

                showMessage(

                    result.message ||

                    (
                        type === "receipt"

                            ? "ورود موجودی ثبت شد."

                            : "خروج موجودی ثبت شد."

                    )

                );


                closeModal();


                // ====================================================
                // REFRESH INVENTORY
                // ====================================================

                await loadCollection(

                    "inventory",

                    "/api/inventory",

                    "موجودی انبار"

                );


                renderInventoryView();

            }

            catch (error) {

                showMessage(

                    error.message,

                    "error"

                );

            }

        }


        /* ============================================================
           END PART 4
        ============================================================ */


        /* ============================================================
           PART 5/5
           BARCODE / NAVIGATION / LOGOUT / STARTUP / ERROR GUARD
        ============================================================ */


        /* ============================================================
           BARCODE VIEW
        ============================================================ */

        function renderBarcodeView() {

            $("#mainContent").innerHTML = `

                    ${pageHeader(
                "جستجوی بارکد",
                "جستجوی مستقیم قطعه از Worker"
            )}


                    <section class="card">

                        <div class="card-header">

                            <h2 class="card-title">
                                جستجوی قطعه
                            </h2>

                        </div>


                        <div class="card-body">

                            <div class="barcode-row">

                                <input
                                    type="text"
                                    id="barcodeInput"
                                    class="form-control"
                                    inputmode="numeric"
                                    autocomplete="off"
                                    placeholder="بارکد را وارد یا اسکن کنید"
                                >


                                <button
                                    type="button"
                                    class="btn"
                                    id="barcodeSearchButton"
                                >
                                    جستجو
                                </button>

                            </div>


                            <div
                                class="barcode-result"
                                id="barcodeResult"
                            >

                                ${emptyState(
                "هنوز جستجویی انجام نشده است."
            )}

                            </div>

                        </div>

                    </section>

                `;


            const input =
                $("#barcodeInput");


            const button =
                $("#barcodeSearchButton");


            async function search() {

                const barcode =
                    input.value.trim();


                if (!barcode) {

                    showMessage(
                        "بارکد را وارد یا اسکن کنید.",
                        "warning"
                    );


                    input.focus();


                    return;

                }


                try {

                    const data =
                        await apiRequest(
                            "/api/parts/barcode?barcode=" +
                            encodeURIComponent(
                                barcode
                            ),
                            {

                                loadingText:
                                    "در حال جستجوی بارکد..."

                            }
                        );


                    const part =
                        data.item;


                    if (!part) {

                        $("#barcodeResult")
                            .innerHTML =
                            emptyState(
                                "قطعه‌ای با این بارکد پیدا نشد."
                            );


                        return;

                    }


                    $("#barcodeResult")
                        .innerHTML = `

                                <div class="success-box">

                                    <strong>
                                        ${escapeHtml(
                            part.name
                        )}
                                    </strong>

                                    <div style="margin-top:8px">

                                        کد قطعه:
                                        ${escapeHtml(
                            part.code
                        )}

                                    </div>


                                    <div style="margin-top:5px">

                                        واحد:
                                        ${escapeHtml(
                            part.unit_name
                        )}

                                    </div>


                                    <div style="margin-top:5px">

                                        بارکد:
                                        ${escapeHtml(
                            part.barcode
                        )}

                                    </div>


                                    ${part.min_stock !==
                            undefined
                            ? `
                                                <div style="margin-top:5px">
                                                    حداقل موجودی:
                                                    ${formatNumber(
                                part.min_stock
                            )}
                                                </div>
                                              `
                            : ""
                        }


                                    ${part.reorder_point !==
                            undefined
                            ? `
                                                <div style="margin-top:5px">
                                                    نقطه سفارش:
                                                    ${formatNumber(
                                part.reorder_point
                            )}
                                                </div>
                                              `
                            : ""
                        }

                                </div>

                            `;

                }

                catch (error) {

                    $("#barcodeResult")
                        .innerHTML = `

                                <div class="error-box">

                                    ${escapeHtml(
                            error.message
                        )}

                                </div>

                            `;

                }

            }


            button.addEventListener(
                "click",
                search
            );


            input.addEventListener(
                "keydown",
                event => {

                    if (
                        event.key ===
                        "Enter"
                    ) {

                        event.preventDefault();

                        search();

                    }

                }
            );


            /*
             * Barcode Scannerهای سخت‌افزاری معمولاً
             * Enter را بعد از Scan ارسال می‌کنند.
             */


            input.focus();

        }


        /* ============================================================
           GENERIC REFRESH
        ============================================================ */

        async function refreshEntity(
            entityName
        ) {

            const config =
                ENTITY_CONFIG[
                entityName
                ];


            if (!config) {

                return;

            }


            await loadCollection(
                entityName,
                config.endpoint,
                config.title
            );


            refreshAllDropdowns();


            await renderEntityView(
                entityName
            );

        }


        /* ============================================================
           VIEW ROUTER
        ============================================================ */

        async function openView(
            view
        ) {

            STATE.currentView =
                view;


            $$(".nav-button")
                .forEach(
                    button => {

                        button.classList.toggle(
                            "active",
                            button.dataset.view ===
                            view
                        );

                    }
                );


            switch (view) {

                case "dashboard":

                    await loadDashboard();

                    break;

                case "units":

                    await renderEntityView(
                        "units"
                    );

                    break;


                case "products":

                    await renderEntityView(
                        "products"
                    );

                    break;


                case "parts":

                    await renderEntityView(
                        "parts"
                    );

                    break;


                case "warehouses":

                    await renderEntityView(
                        "warehouses"
                    );

                    break;


                case "boms":

                    await renderBomsView();

                    break;


                case "planning":

                    renderPlanningView();

                    break;


                case "production":

                    renderProductionView();

                    break;


                case "inventory":

                    renderInventoryView();

                    break;


                case "barcode":

                    renderBarcodeView();

                    break;


                default:

                    await loadDashboard();

            }

        }


        /* ============================================================
           NAVIGATION
        ============================================================ */

        function initializeNavigation() {

            $$(".nav-button")
                .forEach(
                    button => {

                        button.addEventListener(
                            "click",
                            async () => {

                                const view =
                                    button.dataset.view;


                                if (!view) {

                                    return;

                                }


                                try {

                                    await openView(
                                        view
                                    );

                                }

                                catch (error) {

                                    console.error(
                                        "VIEW ERROR",
                                        error
                                    );


                                    showMessage(
                                        "بارگذاری این بخش با خطا مواجه شد.",
                                        "error"
                                    );

                                }

                            }
                        );

                    }
                );

        }


        /* ============================================================
           LOGOUT
        ============================================================ */

        async function logoutUser() {

            const confirmed =
                window.confirm(
                    "آیا می‌خواهید از سامانه خارج شوید؟"
                );


            if (!confirmed) {

                return;

            }


            try {

                if (
                    STATE.token ||
                    readToken()
                ) {

                    await apiRequest(
                        "/api/logout",
                        {

                            method: "POST",

                            loadingText:
                                "در حال خروج از سامانه...",

                            skipAuthRedirect: true

                        }
                    );

                }

            }

            catch (error) {

                /*
                 * Logout محلی حتی اگر Worker
                 * در دسترس نباشد باید انجام شود.
                 */

                console.warn(
                    "LOGOUT:",
                    error
                );

            }

            finally {

                clearAuthentication();


                window.location.href =
                    CONFIG.LOGIN_PAGE;

            }

        }


        /* ============================================================
           AUTH CHECK
        ============================================================ */

        function requireAuthentication() {

            const token =
                STATE.token ||
                readToken();


            if (!token) {

                window.location.replace(
                    CONFIG.LOGIN_PAGE
                );


                return false;

            }


            STATE.token =
                token;


            return true;

        }


        /* ============================================================
           RETRY PAGE
        ============================================================ */

        function renderStartupError(
            error
        ) {

            const safeMessage =
                error?.message ||
                "اتصال به سامانه برقرار نشد.";


            $("#connectionStatus")
                .textContent =
                "اتصال ناموفق";


            $("#connectionStatus")
                .classList.add(
                    "bad"
                );


            $("#mainContent")
                .innerHTML = `

                        ${pageHeader(
                    "خطا در اتصال",
                    "سامانه نتوانست اطلاعات را دریافت کند."
                )}


                        <section class="card">

                            <div class="card-body">

                                <div class="error-box">

                                    ${escapeHtml(
                    safeMessage
                )}

                                </div>


                                <div
                                    style="
                                        margin-top:12px;
                                        display:flex;
                                        gap:7px;
                                    "
                                >

                                    <button
                                        type="button"
                                        class="btn"
                                        id="retryApplication"
                                    >
                                        تلاش مجدد
                                    </button>


                                    <button
                                        type="button"
                                        class="btn secondary"
                                        id="goLogin"
                                    >
                                        صفحه ورود
                                    </button>

                                </div>

                            </div>

                        </section>

                    `;


            $("#retryApplication")
                .addEventListener(
                    "click",
                    initializeApplication
                );


            $("#goLogin")
                .addEventListener(
                    "click",
                    () => {

                        window.location.href =
                            CONFIG.LOGIN_PAGE;

                    }
                );

        }


        /* ============================================================
           CONNECTION STATUS
        ============================================================ */

        function setConnectionStatus(
            connected,
            text = null
        ) {

            const element =
                $("#connectionStatus");


            if (!element) {

                return;

            }


            element.classList.toggle(
                "bad",
                !connected
            );


            element.textContent =
                text ||
                (
                    connected
                        ? "اتصال به Worker موفق"
                        : "اتصال ناموفق"
                );

        }


        /* ============================================================
           INITIALIZE APPLICATION
        ============================================================ */

        async function initializeApplication() {

            /*
             * اول Theme و UI آماده است.
             * سپس Authentication.
             * بعد API.
             * بنابراین خطای API باعث سفید شدن صفحه نمی‌شود.
             */

            applyTheme();


            if (
                !requireAuthentication()
            ) {

                return;

            }


            initializeNavigation();


            $("#themeButton")
                .addEventListener(
                    "click",
                    toggleTheme
                );


            $("#logoutButton")
                .addEventListener(
                    "click",
                    logoutUser
                );


            try {

                setConnectionStatus(
                    false,
                    "در حال اتصال..."
                );


                await loadCurrentUser();


                const results =
                    await loadAllData();


                const failed =
                    results.filter(
                        result =>
                            !result.ok
                    );


                refreshAllDropdowns();


                if (failed.length) {

                    setConnectionStatus(
                        false,
                        `${failed.length} سرویس نیاز به بررسی دارد`
                    );


                    /*
                     * مهم:
                     * اینجا برنامه را متوقف نمی‌کنیم.
                     * داشبورد با داده‌های موجود باز می‌شود.
                     */

                    showMessage(
                        `${failed.length} بخش با خطا مواجه شد. بخش‌های دیگر قابل استفاده هستند.`,
                        "warning"
                    );

                }

                else {

                    setConnectionStatus(
                        true,
                        "اتصال به Worker موفق"
                    );

                }


                await openView(
                    "dashboard"
                );

            }

            catch (error) {

                console.error(
                    "APPLICATION STARTUP ERROR",
                    error
                );


                renderStartupError(
                    error
                );

            }

            finally {

                /*
                 * اگر به هر دلیلی loader باز مانده باشد،
                 * اینجا بسته می‌شود.
                 */

                STATE.loadingCount =
                    0;


                $("#globalLoader")
                    .classList.remove(
                        "show"
                    );

            }

        }


        /* ============================================================
           GLOBAL ERROR PROTECTION
        ============================================================ */

        window.addEventListener(
            "error",
            event => {

                console.error(
                    "GLOBAL ERROR:",
                    event.error ||
                    event.message
                );


                STATE.loadingCount =
                    0;


                $("#globalLoader")
                    ?.classList.remove(
                        "show"
                    );

            }
        );


        window.addEventListener(
            "unhandledrejection",
            event => {

                console.error(
                    "UNHANDLED PROMISE:",
                    event.reason
                );


                STATE.loadingCount =
                    0;


                $("#globalLoader")
                    ?.classList.remove(
                        "show"
                    );

            }
        );


        /* ============================================================
           MODAL EVENTS
        ============================================================ */

        $("#modalClose")
            .addEventListener(
                "click",
                closeModal
            );


        $("#appModal")
            .addEventListener(
                "click",
                event => {

                    if (
                        event.target ===
                        $("#appModal")
                    ) {

                        closeModal();

                    }

                }
            );


        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Escape"
                ) {

                    closeModal();

                }

            }
        );


        /* ============================================================
           DOM READY
        ============================================================ */

        if (
            document.readyState ===
            "loading"
        ) {

            document.addEventListener(
                "DOMContentLoaded",
                initializeApplication,
                {
                    once: true
                }
            );

        }

        else {

            initializeApplication();

        }


        /* ============================================================
           END OF JAVASCRIPT
        ========================================d==================== */
      </script>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <script src="js/bootstrap-datepicker.min.js"></script>
    <script src="js/bootstrap-datepicker.fa.min.js"></script>
    <script src="js/dashboard-fixes.js"></script>

    <script type="text/javascript">jQuery(".jalali-date").datepicker();</script>
</body>

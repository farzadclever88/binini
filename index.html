<!doctype html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <meta name="theme-color"
          content="#2563eb">

    <meta name="description"
          content="سامانه مدیریت تولید، BOM و انبار نی‌نی‌تو">

    <title>
        داشبورد | سامانه نی‌نی‌تو
    </title>

    <link rel="stylesheet"
          href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">

    <link rel="stylesheet" href="css/bootstrap-datepicker.min.css" />

    <style>
/* ============================================================
   BININI — PRODUCTION CSS REBUILD
   PART 1 / 10
   Protocol:
   01. Design tokens
   02. Theme system
   03. Reset / base
   04. Typography
   05. Layout
   06. Components
   07. Forms
   08. Tables / data
   09. Modals / overlays
   10. Responsive / accessibility / states
   ============================================================ */

/* ============================================================
   01 — DESIGN TOKENS
   ============================================================ */

:root {
    /* --------------------------------------------------------
       Typography
       -------------------------------------------------------- */

    --font-family-base:
        "Vazirmatn",
        Tahoma,
        "Segoe UI",
        Arial,
        sans-serif;

    --font-weight-normal: 400;
    --font-weight-medium: 500;
    --font-weight-semibold: 600;
    --font-weight-bold: 700;
    --font-weight-extrabold: 800;
    --font-weight-black: 900;


    /* --------------------------------------------------------
       Core surfaces
       -------------------------------------------------------- */

    --bg: #f4f7fb;
    --surface: #ffffff;
    --surface-2: #f8fafc;
    --surface-3: #f1f5f9;

    --text: #172033;
    --text-strong: #0f172a;
    --muted: #64748b;
    --muted-2: #94a3b8;

    --border: #e2e8f0;
    --border-strong: #cbd5e1;


    /* --------------------------------------------------------
       Brand / semantic colors
       -------------------------------------------------------- */

    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --primary-active: #1e40af;
    --primary-soft: rgba(37, 99, 235, .10);

    --success: #16a34a;
    --success-hover: #15803d;
    --success-soft: rgba(22, 163, 74, .11);

    --warning: #d97706;
    --warning-hover: #b45309;
    --warning-soft: rgba(217, 119, 6, .12);

    --danger: #dc2626;
    --danger-hover: #b91c1c;
    --danger-soft: rgba(220, 38, 38, .11);

    --info: #0284c7;
    --info-hover: #0369a1;
    --info-soft: rgba(2, 132, 199, .11);


    /* --------------------------------------------------------
       Shadows
       -------------------------------------------------------- */

    --shadow-xs:
        0 1px 2px rgba(15, 23, 42, .04);

    --shadow-sm:
        0 2px 8px rgba(15, 23, 42, .06);

    --shadow:
        0 8px 28px rgba(15, 23, 42, .08);

    --shadow-md:
        0 12px 36px rgba(15, 23, 42, .10);

    --shadow-lg:
        0 20px 50px rgba(15, 23, 42, .14);


    /* --------------------------------------------------------
       Radius
       -------------------------------------------------------- */

    --radius-xs: 6px;
    --radius-sm: 8px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --radius-xl: 18px;
    --radius-pill: 999px;

    --radius: var(--radius-lg);


    /* --------------------------------------------------------
       Layout
       -------------------------------------------------------- */

    --content-max-width: 1600px;
    --sidebar-width: 240px;
    --header-height: 67px;

    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 20px;
    --space-6: 24px;
    --space-7: 28px;
    --space-8: 32px;
    --space-9: 40px;
    --space-10: 48px;


    /* --------------------------------------------------------
       Form controls
       -------------------------------------------------------- */

    --control-height: 42px;
    --control-height-sm: 36px;
    --control-height-lg: 48px;

    --control-bg: var(--surface-2);
    --control-bg-hover: var(--surface);
    --control-border: var(--border);
    --control-border-hover: var(--border-strong);
    --control-focus-ring: rgba(37, 99, 235, .16);


    /* --------------------------------------------------------
       Transitions
       -------------------------------------------------------- */

    --transition-fast:
        120ms ease;

    --transition:
        180ms ease;

    --transition-slow:
        260ms ease;


    /* --------------------------------------------------------
       Z-index
       -------------------------------------------------------- */

    --z-header: 100;
    --z-dropdown: 500;
    --z-sticky: 600;
    --z-overlay: 900;
    --z-modal: 1000;
    --z-toast: 1100;
    --z-tooltip: 1200;


    /* --------------------------------------------------------
       Accessibility / focus
       -------------------------------------------------------- */

    --focus-outline:
        0 0 0 3px var(--control-focus-ring);
}


/* ============================================================
   02 — DARK THEME
   ============================================================ */

:root[data-theme="dark"] {
    /* --------------------------------------------------------
       Core surfaces
       -------------------------------------------------------- */

    --bg: #0b1120;
    --surface: #111827;
    --surface-2: #172033;
    --surface-3: #1e293b;

    --text: #f1f5f9;
    --text-strong: #f8fafc;
    --muted: #94a3b8;
    --muted-2: #64748b;

    --border: #293548;
    --border-strong: #3b4a60;


    /* --------------------------------------------------------
       Brand
       -------------------------------------------------------- */

    --primary: #60a5fa;
    --primary-hover: #93c5fd;
    --primary-active: #bfdbfe;
    --primary-soft: rgba(96, 165, 250, .13);


    /* --------------------------------------------------------
       Semantic
       -------------------------------------------------------- */

    --success: #4ade80;
    --success-hover: #86efac;
    --success-soft: rgba(74, 222, 128, .13);

    --warning: #fbbf24;
    --warning-hover: #fcd34d;
    --warning-soft: rgba(251, 191, 36, .13);

    --danger: #f87171;
    --danger-hover: #fca5a5;
    --danger-soft: rgba(248, 113, 113, .13);

    --info: #38bdf8;
    --info-hover: #7dd3fc;
    --info-soft: rgba(56, 189, 248, .13);


    /* --------------------------------------------------------
       Shadows
       -------------------------------------------------------- */

    --shadow-xs:
        0 1px 2px rgba(0, 0, 0, .18);

    --shadow-sm:
        0 2px 8px rgba(0, 0, 0, .22);

    --shadow:
        0 8px 28px rgba(0, 0, 0, .28);

    --shadow-md:
        0 12px 36px rgba(0, 0, 0, .34);

    --shadow-lg:
        0 20px 50px rgba(0, 0, 0, .42);


    /* --------------------------------------------------------
       Controls
       -------------------------------------------------------- */

    --control-bg: #172033;
    --control-bg-hover: #1e293b;
    --control-border: #334155;
    --control-border-hover: #475569;
    --control-focus-ring: rgba(96, 165, 250, .22);
}


/* ============================================================
   03 — GLOBAL RESET
   ============================================================ */

*,
*::before,
*::after {
    box-sizing: border-box;
}


html {
    min-height: 100%;
    scroll-behavior: smooth;
    direction: rtl;

    font-family: var(--font-family-base);

    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;

    text-rendering: optimizeLegibility;

    color-scheme: light;
}


html[data-theme="dark"] {
    color-scheme: dark;
}


body {
    min-height: 100vh;
    margin: 0;

    background: var(--bg);
    color: var(--text);

    font-family: var(--font-family-base);
    font-size: 14px;
    font-weight: var(--font-weight-normal);
    line-height: 1.7;

    direction: rtl;

    transition:
        background-color var(--transition),
        color var(--transition);
}


/* ------------------------------------------------------------
   Remove inconsistent browser defaults
   ------------------------------------------------------------ */

h1,
h2,
h3,
h4,
h5,
h6,
p,
figure,
blockquote,
dl,
dd {
    margin: 0;
}


ul,
ol {
    margin: 0;
    padding: 0;
    list-style: none;
}


button,
input,
textarea,
select,
option,
optgroup {
    margin: 0;
    font: inherit;
}


button,
input,
textarea,
select {
    color: inherit;
}


button {
    border: 0;
    cursor: pointer;
}


button:disabled {
    cursor: not-allowed;
}


a {
    color: inherit;
    text-decoration: none;
}


img,
svg,
video,
canvas {
    display: block;
    max-width: 100%;
}


img {
    height: auto;
}


table {
    border-collapse: collapse;
    border-spacing: 0;
}


textarea {
    font-family: inherit;
}


input,
textarea,
select {
    outline: none;
}


/* ============================================================
   04 — GLOBAL TYPOGRAPHY
   ============================================================ */

html,
body,
button,
input,
textarea,
select,
option,
optgroup,
label,
table,
thead,
tbody,
tfoot,
tr,
th,
td,
a,
span,
div,
p,
small,
strong,
b,
em,
i,
h1,
h2,
h3,
h4,
h5,
h6,
dialog,
[role="dialog"],
[role="tooltip"] {
    font-family: var(--font-family-base);
}


h1,
h2,
h3,
h4,
h5,
h6 {
    color: var(--text-strong);
    font-weight: var(--font-weight-bold);
    line-height: 1.45;
}


h1 {
    font-size: 28px;
}


h2 {
    font-size: 24px;
}


h3 {
    font-size: 20px;
}


h4 {
    font-size: 18px;
}


h5 {
    font-size: 16px;
}


h6 {
    font-size: 14px;
}


p {
    color: var(--text);
}


small {
    font-size: 12px;
    font-weight: var(--font-weight-normal);
}


strong,
b {
    font-weight: var(--font-weight-bold);
}


::placeholder {
    color: var(--muted);
    font-family: var(--font-family-base);
    font-weight: var(--font-weight-normal);
    opacity: .78;
}


::selection {
    background: var(--primary-soft);
    color: var(--text-strong);
}


/* ============================================================
   05 — GLOBAL INTERACTION
   ============================================================ */

button,
a,
input,
textarea,
select {
    transition:
        border-color var(--transition),
        background-color var(--transition),
        color var(--transition),
        box-shadow var(--transition),
        opacity var(--transition),
        transform var(--transition);
}


button:focus-visible,
a:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible,
[tabindex]:focus-visible {
    outline: none;
    box-shadow: var(--focus-outline);
}


button:disabled,
input:disabled,
textarea:disabled,
select:disabled {
    opacity: .58;
}


/* ============================================================
   06 — APPLICATION ROOT
   ============================================================ */

#app,
.app,
.app-root {
    min-height: 100vh;
}


.dashboard-page {
    min-height: 100vh;
    font-family: var(--font-family-base);
}


/* ============================================================
   07 — HEADER
   ============================================================ */

.header {
    position: sticky;
    top: 0;
    z-index: var(--z-header);

    width: 100%;

    min-height: var(--header-height);

    background: var(--surface);

    border-bottom: 1px solid var(--border);

    box-shadow: var(--shadow-xs);

    transition:
        background-color var(--transition),
        border-color var(--transition),
        box-shadow var(--transition);
}


.header-inner {
    width: 100%;
    max-width: var(--content-max-width);

    min-height: var(--header-height);

    margin-inline: auto;
    padding: 10px 18px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: var(--space-4);
}


.brand {
    min-width: 0;

    display: flex;
    align-items: center;

    gap: 11px;
}


.logo {
    width: 44px;
    height: 44px;

    flex: 0 0 44px;

    display: grid;
    place-items: center;

    border-radius: var(--radius-md);

    background: var(--primary);
    color: #ffffff;

    font-size: 22px;
    font-weight: var(--font-weight-black);

    box-shadow: var(--shadow-sm);

    user-select: none;
}


.brand-text {
    min-width: 0;
}


.brand-title {
    overflow: hidden;

    color: var(--text-strong);

    font-size: 16px;
    font-weight: var(--font-weight-black);

    line-height: 1.35;

    text-overflow: ellipsis;
    white-space: nowrap;
}


.brand-subtitle {
    margin-top: 2px;

    overflow: hidden;

    color: var(--muted);

    font-size: 11px;
    font-weight: var(--font-weight-normal);

    line-height: 1.4;

    text-overflow: ellipsis;
    white-space: nowrap;
}


.header-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;

    gap: var(--space-2);

    flex-wrap: wrap;
}


.current-user {
    min-height: 36px;

    display: inline-flex;
    align-items: center;

    padding: 7px 11px;

    border: 1px solid var(--border);
    border-radius: var(--radius-md);

    background: var(--surface-2);
    color: var(--muted);

    font-size: 12px;

    white-space: nowrap;
}


.current-user strong {
    color: var(--text-strong);
}


/* ============================================================
   08 — MAIN APPLICATION LAYOUT
   ============================================================ */

.app-layout {
    width: 100%;
    max-width: var(--content-max-width);

    margin-inline: auto;
    padding: 18px;

    display: grid;

    grid-template-columns:
        var(--sidebar-width)
        minmax(0, 1fr);

    gap: 18px;

    align-items: start;
}


.main {
    min-width: 0;
    width: 100%;
}


/* ============================================================
   09 — SIDEBAR
   ============================================================ */

.sidebar {
    position: sticky;
    top: calc(var(--header-height) + 15px);

    align-self: start;

    min-width: 0;

    padding: 9px;

    background: var(--surface);

    border: 1px solid var(--border);
    border-radius: var(--radius);

    box-shadow: var(--shadow);

    overflow: hidden;

    transition:
        background-color var(--transition),
        border-color var(--transition),
        box-shadow var(--transition);
}


.sidebar-title {
    padding: 8px 10px;

    color: var(--muted);

    font-size: 11px;
    font-weight: var(--font-weight-bold);

    line-height: 1.5;
}


.nav-button {
    width: 100%;
    min-height: 40px;

    display: flex;
    align-items: center;

    gap: 8px;

    padding: 9px 11px;
    margin-bottom: 2px;

    border: 1px solid transparent;
    border-radius: var(--radius-sm);

    background: transparent;
    color: var(--text);

    text-align: right;

    font-weight: var(--font-weight-medium);
}


.nav-button:hover {
    background: var(--primary-soft);
    color: var(--primary);
}


.nav-button:active {
    transform: translateY(1px);
}


.nav-button.active {
    background: var(--primary-soft);
    color: var(--primary);

    border-color: rgba(37, 99, 235, .10);

    font-weight: var(--font-weight-extrabold);
}


.nav-icon {
    width: 22px;
    min-width: 22px;

    display: inline-grid;
    place-items: center;

    text-align: center;

    line-height: 1;
}


.nav-button .nav-icon {
    color: currentColor;
}


/* ============================================================
   10 — PAGE HEADER
   ============================================================ */

.page-head {
    width: 100%;

    display: flex;
    align-items: flex-start;
    justify-content: space-between;

    gap: 15px;

    margin-bottom: 15px;
}


.page-title {
    margin: 0;

    color: var(--text-strong);

    font-size: 24px;
    font-weight: var(--font-weight-black);

    line-height: 1.4;
}


.page-description {
    margin-top: 4px;

    color: var(--muted);

    font-size: 13px;
    font-weight: var(--font-weight-normal);

    line-height: 1.65;
}


.connection-status {
    flex: 0 0 auto;

    min-height: 30px;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    padding: 6px 11px;

    border-radius: var(--radius-pill);

    background: var(--success-soft);
    color: var(--success);

    font-size: 11px;
    font-weight: var(--font-weight-extrabold);

    white-space: nowrap;
}


.connection-status.bad {
    background: var(--danger-soft);
    color: var(--danger);
}


/* ============================================================
   11 — CARD FOUNDATION
   ============================================================ */

.card {
    position: relative;

    width: 100%;
    min-width: 0;

    margin-bottom: 15px;

    background: var(--surface);

    border: 1px solid var(--border);
    border-radius: var(--radius);

    box-shadow: var(--shadow);

    overflow: hidden;

    transition:
        background-color var(--transition),
        border-color var(--transition),
        box-shadow var(--transition);
}


.card-header {
    min-height: 52px;

    padding: 13px 15px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 10px;

    border-bottom: 1px solid var(--border);

    background: var(--surface);
}


.card-title {
    margin: 0;

    color: var(--text-strong);

    font-size: 15px;
    font-weight: var(--font-weight-extrabold);

    line-height: 1.5;
}


.card-body {
    padding: 15px;
}


.card-footer {
    padding: 12px 15px;

    border-top: 1px solid var(--border);

    background: var(--surface-2);
}


/* ============================================================
   12 — STAT CARDS
   ============================================================ */

.stats {
    display: grid;

    grid-template-columns:
        repeat(5, minmax(0, 1fr));

    gap: 12px;

    margin-bottom: 15px;
}


.stat-card {
    min-width: 0;

    padding: 15px;

    background: var(--surface);

    border: 1px solid var(--border);
    border-radius: var(--radius);

    box-shadow: var(--shadow-sm);

    transition:
        transform var(--transition),
        box-shadow var(--transition),
        border-color var(--transition),
        background-color var(--transition);
}


.stat-card:hover {
    transform: translateY(-1px);
    box-shadow: var(--shadow);
}


.stat-label {
    display: block;

    color: var(--muted);

    font-size: 11px;
    font-weight: var(--font-weight-medium);

    line-height: 1.5;
}


.stat-value {
    display: block;

    margin-top: 5px;

    color: var(--text-strong);

    font-size: 25px;
    font-weight: var(--font-weight-black);

    line-height: 1.25;

    overflow-wrap: anywhere;
}


/* ============================================================
   13 — TOOLBAR
   ============================================================ */

.toolbar {
    display: flex;
    align-items: center;

    gap: 7px;

    flex-wrap: wrap;
}


.toolbar > * {
    flex: 0 0 auto;
}


/* ============================================================
   14 — BUTTON SYSTEM
   ============================================================ */

.btn {
    min-height: 38px;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    gap: 7px;

    padding: 8px 13px;

    border: 1px solid transparent;
    border-radius: var(--radius-sm);

    background: var(--primary);
    color: #ffffff;

    font-size: 13px;
    font-weight: var(--font-weight-bold);

    line-height: 1.35;

    text-align: center;

    user-select: none;
    white-space: nowrap;
}


.btn:hover {
    background: var(--primary-hover);
}


.btn:active {
    background: var(--primary-active);
    transform: translateY(1px);
}


.btn.secondary {
    background: var(--surface);
    color: var(--text);

    border-color: var(--border);
}


.btn.secondary:hover {
    background: var(--surface-2);
    border-color: var(--border-strong);
}


.btn.success {
    background: var(--success);
}


.btn.success:hover {
    background: var(--success-hover);
}


.btn.warning {
    background: var(--warning);
}


.btn.warning:hover {
    background: var(--warning-hover);
}


.btn.danger {
    background: var(--danger);
}


.btn.danger:hover {
    background: var(--danger-hover);
}


.btn.small {
    min-height: 32px;

    padding: 5px 9px;

    font-size: 11px;
}


.btn.large {
    min-height: var(--control-height-lg);

    padding: 10px 17px;

    font-size: 14px;
}


.btn:disabled,
.btn[disabled] {
    transform: none;
}


/* ============================================================
   15 — FORM FOUNDATION
   ============================================================ */

.form-grid {
    display: grid;

    grid-template-columns:
        repeat(3, minmax(0, 1fr));

    gap: 13px;
}


.form-group {
    min-width: 0;
}


.form-group.full {
    grid-column: 1 / -1;
}


.form-label {
    display: block;

    margin-bottom: 6px;

    color: var(--text-strong);

    font-size: 12px;
    font-weight: var(--font-weight-extrabold);

    line-height: 1.5;
}


.required {
    color: var(--danger);
}


.form-control {
    width: 100%;
    min-height: var(--control-height);

    padding: 9px 11px;

    border: 1px solid var(--control-border);
    border-radius: var(--radius-sm);

    outline: none;

    background: var(--control-bg);
    color: var(--text);

    font-size: 13px;
    font-weight: var(--font-weight-normal);

    line-height: 1.5;

    appearance: none;
}


.form-control:hover {
    background: var(--control-bg-hover);
    border-color: var(--control-border-hover);
}


.form-control:focus {
    background: var(--surface);

    border-color: var(--primary);

    box-shadow:
        0 0 0 3px var(--control-focus-ring);
}


textarea.form-control {
    min-height: 90px;

    resize: vertical;

    line-height: 1.7;
}


.form-help {
    display: block;

    margin-top: 5px;

    color: var(--muted);

    font-size: 10px;
    font-weight: var(--font-weight-normal);

    line-height: 1.6;
}


.form-error {
    display: block;

    margin-top: 5px;

    color: var(--danger);

    font-size: 11px;
    font-weight: var(--font-weight-medium);

    line-height: 1.6;
}


.number-words {
    min-height: 17px;

    margin-top: 5px;

    color: var(--muted);

    font-size: 10px;
    font-weight: var(--font-weight-normal);

    line-height: 1.6;
}


/* ============================================================
   END OF PART 1 / 10
   ============================================================ */

        /* ============================================================
   BININI — PRODUCTION CSS REBUILD
   PART 2 / 10

   Components:
   - Advanced form controls
   - Selects
   - Checkboxes
   - Radio buttons
   - Switches
   - Input groups
   - Search boxes
   - Filters
   ============================================================ */


/* ============================================================
   16 — INPUT GROUPS
   ============================================================ */

.input-group {
    width: 100%;

    display: flex;
    align-items: stretch;

    direction: rtl;
}


.input-group .form-control {
    flex: 1 1 auto;

    border-radius: 0;

    min-width: 0;
}


.input-group > .form-control:first-child {
    border-radius: var(--radius-sm) 0 0 var(--radius-sm);
}


.input-group > .form-control:last-child {
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
}


.input-group-text {
    min-height: var(--control-height);

    display: inline-flex;
    align-items: center;
    justify-content: center;

    padding: 0 12px;

    background: var(--surface-3);

    border: 1px solid var(--control-border);

    color: var(--muted);

    font-size: 12px;
    font-weight: var(--font-weight-bold);

    white-space: nowrap;
}


.input-group-text:first-child {
    border-radius: var(--radius-sm) 0 0 var(--radius-sm);
}


.input-group-text:last-child {
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
}


/* ============================================================
   17 — SEARCH BOX
   ============================================================ */

.search-box {
    position: relative;

    width: 100%;
}


.search-box input {
    width: 100%;

    min-height: var(--control-height);

    padding-right: 42px;
    padding-left: 12px;

    background: var(--control-bg);

    border: 1px solid var(--control-border);
    border-radius: var(--radius-md);

    color: var(--text);

    font-size: 13px;
}


.search-box input:hover {
    background: var(--control-bg-hover);
}


.search-box input:focus {
    background: var(--surface);

    border-color: var(--primary);

    box-shadow:
        0 0 0 3px var(--control-focus-ring);
}


.search-icon {
    position: absolute;

    right: 13px;
    top: 50%;

    transform: translateY(-50%);

    width: 18px;
    height: 18px;

    color: var(--muted);

    pointer-events: none;
}


.search-clear {
    position: absolute;

    left: 10px;
    top: 50%;

    transform: translateY(-50%);

    width: 26px;
    height: 26px;

    display: grid;
    place-items: center;

    border-radius: var(--radius-pill);

    background: transparent;

    color: var(--muted);

    font-size: 14px;
}


.search-clear:hover {
    background: var(--danger-soft);

    color: var(--danger);
}


/* ============================================================
   18 — SELECT CONTROLS
   ============================================================ */

select.form-control {

    cursor: pointer;

    padding-left: 36px;

    background-image:
        linear-gradient(45deg, transparent 50%, var(--muted) 50%),
        linear-gradient(135deg, var(--muted) 50%, transparent 50%);

    background-position:
        left 15px center,
        left 10px center;

    background-size:
        6px 6px,
        6px 6px;

    background-repeat: no-repeat;
}


select.form-control option {

    background: var(--surface);

    color: var(--text);
}


.form-control[readonly] {

    background: var(--surface-3);

    cursor: default;

    opacity: .9;
}


.form-control[disabled] {

    background: var(--surface-3);

    cursor: not-allowed;

    opacity: .55;
}


/* ============================================================
   19 — CHECKBOX
   ============================================================ */

.checkbox-group {

    display: flex;

    align-items: center;

    gap: 8px;

}


.checkbox {

    position: relative;

    width: 18px;
    height: 18px;

    flex: 0 0 18px;

    appearance: none;

    cursor: pointer;

    border-radius: 5px;

    border: 1.5px solid var(--border-strong);

    background: var(--surface);

}


.checkbox:hover {

    border-color: var(--primary);

}


.checkbox:checked {

    background: var(--primary);

    border-color: var(--primary);

}


.checkbox:checked::after {

    content: "";

    position: absolute;

    width: 5px;
    height: 10px;

    right: 5px;
    top: 1px;

    border:

        solid #ffffff;

    border-width:

        0 2px 2px 0;

    transform: rotate(45deg);

}


.checkbox-label {

    cursor: pointer;

    color: var(--text);

    font-size: 13px;

    font-weight: var(--font-weight-medium);

    user-select: none;

}


/* ============================================================
   20 — RADIO BUTTON
   ============================================================ */

.radio-group {

    display: flex;

    align-items: center;

    gap: 14px;

    flex-wrap: wrap;

}


.radio-item {

    display: inline-flex;

    align-items: center;

    gap: 7px;

}


.radio {

    width: 18px;
    height: 18px;

    appearance: none;

    border-radius: 50%;

    border: 1.5px solid var(--border-strong);

    background: var(--surface);

    cursor: pointer;

    position: relative;

}


.radio:hover {

    border-color: var(--primary);

}


.radio:checked {

    border-color: var(--primary);

}


.radio:checked::after {

    content: "";

    position: absolute;

    inset: 4px;

    border-radius: 50%;

    background: var(--primary);

}


.radio-label {

    color: var(--text);

    font-size: 13px;

    font-weight: var(--font-weight-medium);

    cursor: pointer;

}


/* ============================================================
   21 — SWITCH TOGGLE
   ============================================================ */

.switch {

    position: relative;

    width: 44px;
    height: 24px;

    display: inline-block;

}


.switch input {

    width: 0;
    height: 0;

    opacity: 0;

}


.slider {

    position: absolute;

    inset: 0;

    cursor: pointer;

    border-radius: var(--radius-pill);

    background: var(--border-strong);

}


.slider::before {

    content: "";

    position: absolute;

    width: 18px;
    height: 18px;

    right: 3px;
    top: 3px;

    border-radius: 50%;

    background: #ffffff;

    box-shadow: var(--shadow-xs);

    transition:

        transform var(--transition);

}


.switch input:checked + .slider {

    background: var(--primary);

}


.switch input:checked + .slider::before {

    transform: translateX(-20px);

}


.switch-label {

    margin-right: 8px;

    color: var(--text);

    font-size: 13px;

}


/* ============================================================
   22 — DATE / NUMBER INPUT
   ============================================================ */

input[type="number"].form-control {

    direction: ltr;

    text-align: right;

}


input[type="date"].form-control {

    direction: rtl;

}


input[type="time"].form-control {

    direction: ltr;

    text-align: center;

}


input[type="file"].form-control {

    padding: 8px;

    cursor: pointer;

}


input[type="file"]::file-selector-button {

    margin-left: 10px;

    padding: 6px 12px;

    border: 0;

    border-radius: var(--radius-sm);

    background: var(--primary);

    color: white;

    cursor: pointer;

    font-weight: var(--font-weight-bold);

}


input[type="file"]::file-selector-button:hover {

    background: var(--primary-hover);

}


/* ============================================================
   23 — PRICE / MONEY INPUTS
   ============================================================ */

.money-input {

    direction: ltr;

    text-align: left;

    font-variant-numeric: tabular-nums;

}


.money-input-wrapper {

    position: relative;

}


.money-input-wrapper::after {

    content: "تومان";

    position: absolute;

    left: 12px;

    top: 50%;

    transform: translateY(-50%);

    color: var(--muted);

    font-size: 11px;

    font-weight: var(--font-weight-bold);

    pointer-events: none;

}


.money-input-wrapper .money-input {

    padding-left: 55px;

}


/* ============================================================
   24 — FORM SECTION
   ============================================================ */

.form-section {

    padding: 16px;

    margin-bottom: 15px;

    background:

        var(--surface-2);

    border:

        1px solid var(--border);

    border-radius:

        var(--radius-md);

}


.form-section-title {

    margin-bottom: 12px;

    color: var(--text-strong);

    font-size: 14px;

    font-weight: var(--font-weight-black);

}


.form-divider {

    width: 100%;

    height: 1px;

    margin: 18px 0;

    background: var(--border);

}


/* ============================================================
   25 — VALIDATION STATES
   ============================================================ */

.form-control.is-valid {

    border-color: var(--success);

}


.form-control.is-valid:focus {

    box-shadow:

        0 0 0 3px var(--success-soft);

}


.form-control.is-invalid {

    border-color: var(--danger);

}


.form-control.is-invalid:focus {

    box-shadow:

        0 0 0 3px var(--danger-soft);

}


.valid-feedback {

    margin-top: 5px;

    color: var(--success);

    font-size: 11px;

    font-weight: var(--font-weight-medium);

}


.invalid-feedback {

    margin-top: 5px;

    color: var(--danger);

    font-size: 11px;

    font-weight: var(--font-weight-medium);

}


/* ============================================================
   26 — BUTTON ICONS
   ============================================================ */

.btn svg,
.btn i {

    width: 16px;
    height: 16px;

    display: inline-flex;

    align-items: center;

    justify-content: center;

}


.btn.icon-only {

    width: 38px;
    height: 38px;

    padding: 0;

    border-radius: var(--radius-md);

}


/* ============================================================
   27 — DROPDOWN FOUNDATION
   ============================================================ */

.dropdown {

    position: relative;

}


.dropdown-menu {

    position: absolute;

    top: calc(100% + 8px);

    right: 0;

    min-width: 180px;

    padding: 7px;

    background: var(--surface);

    border: 1px solid var(--border);

    border-radius: var(--radius-md);

    box-shadow: var(--shadow-md);

    z-index: var(--z-dropdown);

}


.dropdown-item {

    width: 100%;

    min-height: 36px;

    display: flex;

    align-items: center;

    gap: 8px;

    padding: 7px 10px;

    border-radius: var(--radius-sm);

    color: var(--text);

    background: transparent;

    font-size: 13px;

    text-align: right;

}


.dropdown-item:hover {

    background: var(--primary-soft);

    color: var(--primary);

}


/* ============================================================
   END OF PART 2 / 10
   ============================================================ */

        /* ============================================================
   BININI — PRODUCTION CSS REBUILD
   PART 3 / 10

   Components:
   - Buttons
   - Button groups
   - Cards
   - Panels
   - Badges
   - Alerts
   - Empty states
   - Loading states
   ============================================================ */


/* ============================================================
   28 — BUTTON SYSTEM
   ============================================================ */

.btn {

    position: relative;

    min-height: 38px;

    display: inline-flex;

    align-items: center;
    justify-content: center;

    gap: 7px;

    padding: 8px 14px;

    border: 1px solid transparent;

    border-radius: var(--radius-md);

    font-family: inherit;

    font-size: 13px;

    font-weight: var(--font-weight-bold);

    line-height: 1.2;

    text-align: center;

    text-decoration: none;

    white-space: nowrap;

    cursor: pointer;

    user-select: none;

    transition:
        background-color var(--transition),
        border-color var(--transition),
        color var(--transition),
        box-shadow var(--transition),
        transform var(--transition),
        opacity var(--transition);

}


.btn:hover {

    transform: translateY(-1px);

}


.btn:active {

    transform: translateY(0);

}


.btn:focus-visible {

    outline: none;

    box-shadow:
        0 0 0 3px var(--control-focus-ring);

}


.btn:disabled,
.btn.disabled {

    opacity: .5;

    cursor: not-allowed;

    pointer-events: none;

}


/* ============================================================
   29 — PRIMARY BUTTON
   ============================================================ */

.btn-primary {

    background: var(--primary);

    border-color: var(--primary);

    color: #ffffff;

}


.btn-primary:hover {

    background: var(--primary-hover);

    border-color: var(--primary-hover);

}


.btn-primary:active {

    background: var(--primary-active);

    border-color: var(--primary-active);

}


/* ============================================================
   30 — SECONDARY BUTTON
   ============================================================ */

.btn-secondary {

    background: var(--surface-3);

    border-color: var(--border);

    color: var(--text-strong);

}


.btn-secondary:hover {

    background: var(--surface-4);

    border-color: var(--border-strong);

}


.btn-secondary:active {

    background: var(--surface-3);

}


/* ============================================================
   31 — OUTLINE BUTTON
   ============================================================ */

.btn-outline {

    background: transparent;

    border-color: var(--border-strong);

    color: var(--text);

}


.btn-outline:hover {

    background: var(--surface-2);

    border-color: var(--primary);

    color: var(--primary);

}


/* ============================================================
   32 — GHOST BUTTON
   ============================================================ */

.btn-ghost {

    background: transparent;

    border-color: transparent;

    color: var(--text);

}


.btn-ghost:hover {

    background: var(--surface-2);

    color: var(--text-strong);

}


/* ============================================================
   33 — SUCCESS BUTTON
   ============================================================ */

.btn-success {

    background: var(--success);

    border-color: var(--success);

    color: #ffffff;

}


.btn-success:hover {

    filter: brightness(.94);

}


/* ============================================================
   34 — DANGER BUTTON
   ============================================================ */

.btn-danger {

    background: var(--danger);

    border-color: var(--danger);

    color: #ffffff;

}


.btn-danger:hover {

    filter: brightness(.94);

}


/* ============================================================
   35 — WARNING BUTTON
   ============================================================ */

.btn-warning {

    background: var(--warning);

    border-color: var(--warning);

    color: var(--warning-contrast, #171717);

}


.btn-warning:hover {

    filter: brightness(.95);

}


/* ============================================================
   36 — LINK BUTTON
   ============================================================ */

.btn-link {

    min-height: auto;

    padding: 3px 5px;

    background: transparent;

    border: 0;

    border-radius: var(--radius-sm);

    color: var(--primary);

    font-weight: var(--font-weight-bold);

}


.btn-link:hover {

    background: var(--primary-soft);

    text-decoration: underline;

    transform: none;

}


/* ============================================================
   37 — SMALL BUTTON
   ============================================================ */

.btn-sm {

    min-height: 32px;

    padding: 6px 10px;

    border-radius: var(--radius-sm);

    font-size: 12px;

}


.btn-sm.icon-only {

    width: 32px;

    height: 32px;

}


/* ============================================================
   38 — LARGE BUTTON
   ============================================================ */

.btn-lg {

    min-height: 44px;

    padding: 10px 18px;

    border-radius: var(--radius-md);

    font-size: 14px;

}


/* ============================================================
   39 — FULL WIDTH BUTTON
   ============================================================ */

.btn-block {

    width: 100%;

}


/* ============================================================
   40 — BUTTON LOADING STATE
   ============================================================ */

.btn.is-loading {

    color: transparent !important;

    pointer-events: none;

}


.btn.is-loading::after {

    content: "";

    position: absolute;

    width: 16px;

    height: 16px;

    border: 2px solid currentColor;

    border-right-color: transparent;

    border-radius: 50%;

    color: inherit;

    animation: btn-spin .7s linear infinite;

}


@keyframes btn-spin {

    to {
        transform: rotate(360deg);
    }

}


/* ============================================================
   41 — BUTTON GROUP
   ============================================================ */

.btn-group {

    display: inline-flex;

    align-items: stretch;

    direction: rtl;

}


.btn-group > .btn {

    border-radius: 0;

}


.btn-group > .btn:first-child {

    border-radius:
        var(--radius-md) 0 0 var(--radius-md);

}


.btn-group > .btn:last-child {

    border-radius:
        0 var(--radius-md) var(--radius-md) 0;

}


.btn-group > .btn + .btn {

    margin-right: -1px;

}


.btn-group > .btn:hover,
.btn-group > .btn:focus-visible {

    position: relative;

    z-index: 1;

}


/* ============================================================
   42 — CARD
   ============================================================ */

.card {

    position: relative;

    display: flex;

    flex-direction: column;

    min-width: 0;

    background: var(--surface);

    border: 1px solid var(--border);

    border-radius: var(--radius-lg);

    box-shadow: var(--shadow-sm);

    color: var(--text);

    overflow: hidden;

}


.card-header {

    min-height: 52px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 12px;

    padding: 12px 16px;

    background: var(--surface-2);

    border-bottom: 1px solid var(--border);

}


.card-title {

    margin: 0;

    color: var(--text-strong);

    font-size: 14px;

    font-weight: var(--font-weight-black);

}


.card-subtitle {

    margin: 3px 0 0;

    color: var(--muted);

    font-size: 11px;

}


.card-body {

    flex: 1 1 auto;

    padding: 16px;

}


.card-footer {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;

    padding: 12px 16px;

    background: var(--surface-2);

    border-top: 1px solid var(--border);

}


/* ============================================================
   43 — CARD VARIANTS
   ============================================================ */

.card-flat {

    box-shadow: none;

}


.card-elevated {

    box-shadow: var(--shadow-md);

}


.card-interactive {

    cursor: pointer;

}


.card-interactive:hover {

    border-color: var(--border-strong);

    box-shadow: var(--shadow-md);

    transform: translateY(-1px);

}


.card-bordered-primary {

    border-color: color-mix(
        in srgb,
        var(--primary) 35%,
        var(--border)
    );

}


/* ============================================================
   44 — PANEL
   ============================================================ */

.panel {

    background: var(--surface);

    border: 1px solid var(--border);

    border-radius: var(--radius-md);

    box-shadow: var(--shadow-xs);

}


.panel-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 12px;

    min-height: 46px;

    padding: 10px 14px;

    border-bottom: 1px solid var(--border);

}


.panel-body {

    padding: 14px;

}


.panel-footer {

    padding: 10px 14px;

    border-top: 1px solid var(--border);

}


/* ============================================================
   45 — BADGES
   ============================================================ */

.badge {

    min-height: 22px;

    display: inline-flex;

    align-items: center;

    justify-content: center;

    gap: 5px;

    padding: 3px 8px;

    border-radius: var(--radius-pill);

    background: var(--surface-3);

    color: var(--text);

    font-size: 10px;

    font-weight: var(--font-weight-bold);

    line-height: 1;

    white-space: nowrap;

}


.badge-primary {

    background: var(--primary-soft);

    color: var(--primary);

}


.badge-success {

    background: var(--success-soft);

    color: var(--success);

}


.badge-danger {

    background: var(--danger-soft);

    color: var(--danger);

}


.badge-warning {

    background: var(--warning-soft);

    color: var(--warning-text, var(--warning));

}


.badge-info {

    background: var(--info-soft);

    color: var(--info);

}


.badge-neutral {

    background: var(--surface-3);

    color: var(--muted);

}


/* ============================================================
   46 — ALERTS
   ============================================================ */

.alert {

    position: relative;

    display: flex;

    align-items: flex-start;

    gap: 10px;

    width: 100%;

    padding: 12px 14px;

    border: 1px solid transparent;

    border-radius: var(--radius-md);

    font-size: 12px;

    line-height: 1.7;

}


.alert-title {

    display: block;

    margin-bottom: 2px;

    font-weight: var(--font-weight-black);

}


.alert-content {

    flex: 1;

    min-width: 0;

}


.alert-info {

    background: var(--info-soft);

    border-color: color-mix(
        in srgb,
        var(--info) 25%,
        var(--border)
    );

    color: var(--info-text, var(--text));

}


.alert-success {

    background: var(--success-soft);

    border-color: color-mix(
        in srgb,
        var(--success) 25%,
        var(--border)
    );

    color: var(--success-text, var(--text));

}


.alert-warning {

    background: var(--warning-soft);

    border-color: color-mix(
        in srgb,
        var(--warning) 30%,
        var(--border)
    );

    color: var(--warning-text, var(--text));

}


.alert-danger {

    background: var(--danger-soft);

    border-color: color-mix(
        in srgb,
        var(--danger) 25%,
        var(--border)
    );

    color: var(--danger-text, var(--text));

}


.alert-close {

    flex: 0 0 auto;

    width: 26px;

    height: 26px;

    display: grid;

    place-items: center;

    margin: -2px;

    border: 0;

    border-radius: var(--radius-sm);

    background: transparent;

    color: currentColor;

    cursor: pointer;

}


.alert-close:hover {

    background: rgb(0 0 0 / .07);

}


/* ============================================================
   47 — EMPTY STATE
   ============================================================ */

.empty-state {

    min-height: 180px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 8px;

    padding: 24px;

    color: var(--muted);

    text-align: center;

}


.empty-state-icon {

    width: 46px;

    height: 46px;

    display: grid;

    place-items: center;

    margin-bottom: 3px;

    border-radius: 50%;

    background: var(--surface-3);

    color: var(--muted);

    font-size: 20px;

}


.empty-state-title {

    margin: 0;

    color: var(--text-strong);

    font-size: 14px;

    font-weight: var(--font-weight-black);

}


.empty-state-text {

    max-width: 420px;

    margin: 0;

    color: var(--muted);

    font-size: 12px;

    line-height: 1.7;

}


/* ============================================================
   48 — LOADING SPINNER
   ============================================================ */

.spinner {

    width: 22px;

    height: 22px;

    display: inline-block;

    border: 2px solid var(--border);

    border-top-color: var(--primary);

    border-radius: 50%;

    animation: spinner-rotate .7s linear infinite;

}


.spinner-sm {

    width: 16px;

    height: 16px;

    border-width: 2px;

}


.spinner-lg {

    width: 32px;

    height: 32px;

    border-width: 3px;

}


@keyframes spinner-rotate {

    to {
        transform: rotate(360deg);
    }

}


/* ============================================================
   49 — LOADING CONTAINER
   ============================================================ */

.loading-state {

    min-height: 120px;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

    color: var(--muted);

}


.loading-state-content {

    display: flex;

    align-items: center;

    gap: 10px;

    font-size: 12px;

}


/* ============================================================
   50 — SKELETON
   ============================================================ */

.skeleton {

    position: relative;

    overflow: hidden;

    background: var(--surface-3);

    border-radius: var(--radius-sm);

}


.skeleton::after {

    content: "";

    position: absolute;

    inset: 0;

    transform: translateX(-100%);

    background:

        linear-gradient(
            90deg,
            transparent,
            var(--surface-4),
            transparent
        );

    animation: skeleton-shimmer 1.4s infinite;

}


@keyframes skeleton-shimmer {

    100% {
        transform: translateX(100%);

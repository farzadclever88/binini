
<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>داشبورد | سامانه نی‌نی‌تو</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#64748b;--border:#e2e8f0;--primary:#2563eb;--danger:#dc2626;--ok:#16a34a;--shadow:0 8px 28px #0f172a12}
:root[data-theme=dark]{--bg:#0f172a;--card:#1e293b;--text:#f8fafc;--muted:#94a3b8;--border:#334155;--shadow:0 8px 28px #0005}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,"Segoe UI",sans-serif}
button,input{font:inherit}.header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--border)}
.header-in{max-width:1450px;margin:auto;padding:13px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:12px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:900}.sub{font-size:12px;color:var(--muted)}
.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.user{padding:7px 10px;background:var(--bg);border:1px solid var(--border);border-radius:9px;font-size:12px}
.btn{border:0;border-radius:9px;padding:9px 13px;background:var(--primary);color:#fff;cursor:pointer;font-weight:700}.btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}.btn.danger{background:var(--danger)}
.layout{max-width:1450px;margin:auto;padding:18px;display:grid;grid-template-columns:220px 1fr;gap:18px}.side{position:sticky;top:82px;align-self:start;background:var(--card);border:1px solid var(--border);border-radius:15px;padding:9px;box-shadow:var(--shadow)}.side-title{font-size:12px;color:var(--muted);padding:8px}
.nav{width:100%;border:0;background:transparent;color:var(--text);text-align:right;padding:10px;border-radius:9px;cursor:pointer}.nav:hover,.nav.active{background:#2563eb18;color:var(--primary)}
.head{display:flex;justify-content:space-between;gap:12px;margin-bottom:15px}.head h1{margin:0;font-size:23px}.head p{margin:3px 0 0;color:var(--muted);font-size:13px}
.status{padding:6px 10px;border-radius:99px;background:#16a34a18;color:var(--ok);font-size:12px;font-weight:700;height:max-content}.status.bad{background:#dc262618;color:var(--danger)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:15px}.stat,.card{background:var(--card);border:1px solid var(--border);border-radius:15px;box-shadow:var(--shadow)}.stat{padding:15px}.stat small{color:var(--muted)}.stat b{display:block;font-size:26px;margin-top:3px}
.card{overflow:hidden;margin-bottom:15px}.card-head{padding:13px 15px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}.card-head h2{margin:0;font-size:16px}.body{padding:15px}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:9px 10px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap;font-size:13px}th{background:var(--bg);color:var(--muted);font-size:12px}.empty{text-align:center;padding:32px;color:var(--muted)}
.error{padding:13px;border-radius:10px;background:#dc262615;color:var(--danger);border:1px solid #dc262630;margin-bottom:12px}.search{display:flex;gap:8px}.search input{flex:1;min-width:180px;padding:10px;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--text)}
.message{position:fixed;bottom:18px;left:18px;z-index:50;display:none;max-width:430px;padding:12px 15px;border-radius:11px;background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow)}.message.show{display:block}
.loader{position:fixed;inset:0;z-index:100;background:#0004;display:none;place-items:center}.loader.show{display:grid}.loader-box{background:var(--card);padding:22px 30px;border-radius:15px;text-align:center}.spin{width:32px;height:32px;border:4px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:s .8s linear infinite;margin:auto auto 10px}@keyframes s{to{transform:rotate(360deg)}}
.footer{max-width:1450px;margin:auto;padding:0 18px 25px;color:var(--muted);font-size:11px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:static;display:flex;overflow:auto;gap:3px}.side-title{display:none}.nav{white-space:nowrap;width:auto}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.header-in{align-items:flex-start}.sub{display:none}.head{flex-direction:column}}
</style>
</head>
<body>

<header class="header">
<div class="header-in">
<div class="brand"><div class="logo">ن</div><div><strong>سامانه نی‌نی‌تو</strong><div class="sub">مدیریت تولید، BOM و انبار</div></div></div>
<div class="actions"><div class="user">کاربر: <b id="currentUser">در حال بررسی...</b></div><button id="theme" class="btn secondary">تم شب</button><button id="logout" class="btn danger">خروج</button></div>
</div>
</header>

<div class="layout">
<aside class="side">
<div class="side-title">منوی سامانه</div>
<button class="nav active" data-view="dashboard">داشبورد</button>
<button class="nav" data-view="units">واحدها</button>
<button class="nav" data-view="products">محصولات</button>
<button class="nav" data-view="parts">قطعات</button>
<button class="nav" data-view="warehouses">انبارها</button>
<button class="nav" data-view="boms">BOM ها</button>
<button class="nav" data-view="planning">برنامه تولید</button>
<button class="nav" data-view="production">تولید</button>
<button class="nav" data-view="inventory">موجودی انبار</button>
<button class="nav" data-view="barcode">جستجوی بارکد</button>
</aside>

<main id="main">
<section class="head"><div><h1>داشبورد</h1><p>نمای کلی سامانه نی‌نی‌تو</p></div><span id="status" class="status">در حال اتصال...</span></section>
<div class="card"><div class="body"><b>در حال آماده‌سازی...</b><div style="color:var(--muted);font-size:13px">در حال دریافت اطلاعات از Worker و پایگاه داده.</div></div></div>
</main>
</div>

<div class="footer">نی‌نی‌تو — اتصال به Cloudflare Worker و D1</div>
<div id="message" class="message"></div>
<div id="loader" class="loader"><div class="loader-box"><div class="spin"></div><div id="loaderText">در حال ارتباط با سامانه...</div></div></div>

<script>
"use strict";

/* ============================================================
   CONFIG — دقیقاً مطابق Login.html و Worker فعلی
============================================================ */
const CONFIG={
 API:"https://ninitoapp.farzadclever88.workers.dev",
 TOKEN_KEY:"ninito_token",
 THEME_KEY:"ninito_theme",
 TIMEOUT:20000
};

const STATE={
 user:null,units:[],products:[],parts:[],warehouses:[],
 boms:[],planning:[],production:[],inventory:[],view:"dashboard"
};

const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];

function esc(v){
 return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
function num(v){
 const n=Number(v); return Number.isFinite(n)?n.toLocaleString("fa-IR"):esc(v??"-");
}
function token(){return localStorage.getItem(CONFIG.TOKEN_KEY)}
function message(text,type="success"){
 const x=$("#message"); if(!x)return;
 x.textContent=text;x.className="message show";
 x.style.borderRight="4px solid "+(type==="error"?"#dc2626":type==="warning"?"#d97706":"#16a34a");
 clearTimeout(x._t);x._t=setTimeout(()=>x.classList.remove("show"),4500);
}
function loading(on,text="در حال ارتباط با سامانه..."){
 $("#loaderText").textContent=text;$("#loader").classList.toggle("show",!!on);
}
function clearAuth(){
 localStorage.removeItem(CONFIG.TOKEN_KEY);
 STATE.user=null;
}
function theme(){
 const t=localStorage.getItem(CONFIG.THEME_KEY);
 if(t==="dark")document.documentElement.dataset.theme="dark";
 else delete document.documentElement.dataset.theme;
 $("#theme").textContent=t==="dark"?"تم روز":"تم شب";
}
function toggleTheme(){
 const dark=document.documentElement.dataset.theme==="dark";
 if(dark){delete document.documentElement.dataset.theme;localStorage.setItem(CONFIG.THEME_KEY,"light")}
 else{document.documentElement.dataset.theme="dark";localStorage.setItem(CONFIG.THEME_KEY,"dark")}
 theme();
}

/* ============================================================
   API REQUEST — تنها apiRequest فایل
============================================================ */
async function apiRequest(path,options={}){
 const method=options.method||"GET";
 const body=options.body??null;
 const auth=options.auth!==false;
 const headers={"Content-Type":"application/json",...(options.headers||{})};
 const t=token();
 if(auth&&t)headers.Authorization="Bearer "+t;

 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),CONFIG.TIMEOUT);
 loading(true,options.loadingText||"در حال ارتباط با سامانه...");

 let response;
 try{
  response=await fetch(CONFIG.API+path,{
   method,headers,
   body:body===null?undefined:JSON.stringify(body),
   signal:controller.signal,cache:"no-store"
  });
 }catch(e){
  clearTimeout(timer);loading(false);
  if(e.name==="AbortError")throw{code:"NET-002",message:"زمان پاسخ‌گویی Worker به پایان رسید.",status:0};
  throw{code:"NET-001",message:"ارتباط با Worker برقرار نشد. آدرس Worker یا اتصال اینترنت را بررسی کنید.",status:0};
 }
 clearTimeout(timer);loading(false);

 let data;
 try{data=await response.json()}catch{throw{code:"API-JSON",message:"پاسخ Worker قابل خواندن نیست.",status:response.status}}

 if(response.status===401){
  clearAuth();
  message("نشست شما معتبر نیست. دوباره وارد شوید.","error");
  setTimeout(()=>location.href="Login.html",700);
  throw{code:data?.error?.code||"AUTH-401",message:data?.error?.message||"نشست معتبر نیست.",status:401};
 }
 if(!response.ok)throw{code:data?.error?.code||"HTTP-"+response.status,message:data?.error?.message||"عملیات در Worker انجام نشد.",status:response.status};
 if(data?.success===false)throw{code:data?.error?.code||"API-ERROR",message:data?.error?.message||"عملیات انجام نشد.",status:response.status};
 return data;
}

/* ============================================================
   LOADERS — همه به همان apiRequest متصل‌اند
============================================================ */
async function load(name,path,label){
 try{
  const d=await apiRequest(path,{loadingText:"در حال دریافت "+label+"..."});
  const items=Array.isArray(d?.items)?d.items:[];
  STATE[name]=items;
  return {ok:true,items};
 }catch(error){
  console.error(path,error);
  return {ok:false,items:[],error};
 }
}
async function loadAll(){
 return Promise.all([
  load("units","/api/units","واحدها"),
  load("products","/api/products","محصولات"),
  load("parts","/api/parts","قطعات"),
  load("warehouses","/api/warehouses","انبارها"),
  load("boms","/api/boms","BOMها"),
  load("planning","/api/planning","برنامه تولید"),
  load("production","/api/production","سوابق تولید"),
  load("inventory","/api/inventory","موجودی انبار")
 ]);
}
async function loadUser(){
 const d=await apiRequest("/api/me",{loadingText:"در حال بررسی کاربر..."});
 STATE.user=d?.user||null;
 $("#currentUser").textContent=STATE.user?.full_name||STATE.user?.username||"کاربر";
}

/* ============================================================
   TABLE
============================================================ */
function table(columns,rows,empty="اطلاعاتی وجود ندارد."){
 if(!rows.length)return `<div class="empty">${esc(empty)}</div>`;
 return `<div class="table-wrap"><table><thead><tr>${columns.map(c=>`<th>${esc(c.label)}</th>`).join("")}</tr></thead><tbody>${
 rows.map(r=>`<tr>${columns.map(c=>`<td>${esc(typeof c.value==="function"?c.value(r):r[c.value]??"-")}</td>`).join("")}</tr>`).join("")
 }</tbody></table></div>`;
}

/* ============================================================
   DASHBOARD
============================================================ */
function dashboard(){
 const inv=STATE.inventory.reduce((s,x)=>s+(Number(x.quantity)||0),0);
 $("#main").innerHTML=`
 <section class="head"><div><h1>داشبورد</h1><p>نمای کلی سامانه نی‌نی‌تو</p></div><span class="status">اتصال به Worker موفق</span></section>
 <section class="stats">
  <div class="stat"><small>واحدها</small><b>${num(STATE.units.length)}</b></div>
  <div class="stat"><small>محصولات</small><b>${num(STATE.products.length)}</b></div>
  <div class="stat"><small>قطعات</small><b>${num(STATE.parts.length)}</b></div>
  <div class="stat"><small>مجموع موجودی</small><b>${num(inv)}</b></div>
 </section>
 <section class="card"><div class="card-head"><h2>برنامه تولید</h2><span>${num(STATE.planning.length)} رکورد</span></div>${
 table([
  {label:"تاریخ",value:"plan_date"},
  {label:"BOM",value:"bom_code"},
  {label:"محصول",value:"product_name"},
  {label:"برنامه",value:r=>num(r.planned_quantity)},
  {label:"تولید",value:r=>num(r.produced_quantity)},
  {label:"وضعیت",value:"status"}
 ],STATE.planning,"برنامه تولیدی ثبت نشده است.")}</section>
 <section class="card"><div class="card-head"><h2>موجودی انبار</h2><span>${num(STATE.inventory.length)} رکورد</span></div>${
 table([
  {label:"انبار",value:"warehouse_name"},
  {label:"نوع",value:"item_type"},
  {label:"شرح",value:"item_name"},
  {label:"مقدار",value:r=>num(r.quantity)},
  {label:"بروزرسانی",value:"updated_at"}
 ],STATE.inventory,"موجودی ثبت نشده است.")}</section>
 <section class="card"><div class="card-head"><h2>BOM ها</h2><span>${num(STATE.boms.length)} رکورد</span></div>${
 table([
  {label:"کد BOM",value:"code"},
  {label:"کد محصول",value:"product_code"},
  {label:"محصول",value:"product_name"},
  {label:"نسخه",value:"version"},
  {label:"از تاریخ",value:"effective_from"},
  {label:"وضعیت",value:"status"}
 ],STATE.boms,"BOM ثبت نشده است.")}</section>`;
}

/* ============================================================
   VIEWS
============================================================ */
const V={
 units:{title:"واحدها",state:"units",path:"/api/units",cols:[
  {label:"کد",value:"code"},{label:"شرح",value:"name"},{label:"وضعیت",value:"status"}]},
 products:{title:"محصولات",state:"products",path:"/api/products",cols:[
  {label:"کد",value:"code"},{label:"نام",value:"name"},{label:"واحد",value:"unit_name"},{label:"وضعیت",value:"status"}]},
 parts:{title:"قطعات",state:"parts",path:"/api/parts",cols:[
  {label:"کد",value:"code"},{label:"شرح",value:"name"},{label:"واحد",value:"unit_name"},{label:"بارکد",value:"barcode"},{label:"حداقل",value:r=>num(r.min_stock)},{label:"نقطه سفارش",value:r=>num(r.reorder_point)},{label:"وضعیت",value:"status"}]},
 warehouses:{title:"انبارها",state:"warehouses",path:"/api/warehouses",cols:[
  {label:"کد",value:"code"},{label:"نام",value:"name"},{label:"نوع",value:"warehouse_type"},{label:"وضعیت",value:"status"}]},
 boms:{title:"BOM ها",state:"boms",path:"/api/boms",cols:[
  {label:"کد BOM",value:"code"},{label:"کد محصول",value:"product_code"},{label:"محصول",value:"product_name"},{label:"نسخه",value:"version"},{label:"از",value:"effective_from"},{label:"تا",value:"effective_to"},{label:"وضعیت",value:"status"}]},
 planning:{title:"برنامه تولید",state:"planning",path:"/api/planning",cols:[
  {label:"تاریخ",value:"plan_date"},{label:"BOM",value:"bom_code"},{label:"محصول",value:"product_name"},{label:"برنامه",value:r=>num(r.planned_quantity)},{label:"تولید",value:r=>num(r.produced_quantity)},{label:"وضعیت",value:"status"}]},
 production:{title:"تولید",state:"production",path:"/api/production",cols:[
  {label:"تاریخ",value:"production_date"},{label:"کد محصول",value:"product_code"},{label:"محصول",value:"product_name"},{label:"مقدار",value:r=>num(r.produced_quantity)},{label:"وضعیت",value:"status"}]},
 inventory:{title:"موجودی انبار",state:"inventory",path:"/api/inventory",cols:[
  {label:"انبار",value:"warehouse_name"},{label:"کد انبار",value:"warehouse_code"},{label:"نوع",value:"item_type"},{label:"شرح",value:"item_name"},{label:"مقدار",value:r=>num(r.quantity)},{label:"بروزرسانی",value:"updated_at"}]}
};

function renderView(v){
 const d=V[v],rows=STATE[d.state]||[];
 $("#main").innerHTML=`
 <section class="head"><div><h1>${esc(d.title)}</h1><p>اطلاعات دریافت‌شده مستقیم از Worker</p></div><span class="status">${num(rows.length)} رکورد</span></section>
 <section class="card"><div class="card-head"><h2>${esc(d.title)}</h2><button class="btn secondary" id="refresh">بروزرسانی</button></div>${table(d.cols,rows)}</section>`;
 $("#refresh").onclick=async()=>{
  const r=await load(d.state,d.path,d.title);
  if(!r.ok)message(r.error?.message||"خطا در بروزرسانی","error");
  renderView(v);
 };
}

function barcodeView(){
 $("#main").innerHTML=`
 <section class="head"><div><h1>جستجوی بارکد</h1><p>جستجوی قطعه از API Worker</p></div></section>
 <section class="card"><div class="body"><div class="search"><input id="barcode" placeholder="بارکد قطعه"><button id="searchBarcode" class="btn">جستجو</button></div><div id="barcodeResult" class="empty">هنوز جستجویی انجام نشده است.</div></div></section>`;
 const run=async()=>{
  const b=$("#barcode").value.trim();
  if(!b)return message("بارکد را وارد کنید.","warning");
  try{
   const d=await apiRequest("/api/parts/barcode?barcode="+encodeURIComponent(b),{loadingText:"در حال جستجوی بارکد..."});
   const x=d?.item;
   $("#barcodeResult").innerHTML=x?`<div style="padding-top:18px"><b>${esc(x.name)}</b><p>کد: ${esc(x.code)}</p><p>واحد: ${esc(x.unit_name)}</p><p>بارکد: ${esc(x.barcode)}</p></div>`:"<div class='empty'>قطعه‌ای پیدا نشد.</div>";
  }catch(e){$("#barcodeResult").innerHTML=`<div class="error">${esc(e.message)}</div>`}
 };
 $("#searchBarcode").onclick=run;
 $("#barcode").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();run()}};
}

async function openView(v){
 STATE.view=v;
 $$(".nav").forEach(x=>x.classList.toggle("active",x.dataset.view===v));
 if(v==="dashboard")return dashboard();
 if(v==="barcode")return barcodeView();
 return renderView(v);
}

/* ============================================================
   LOGOUT
============================================================ */
async function logout(){
 try{await apiRequest("/api/logout",{method:"POST",loadingText:"در حال خروج..."})}catch(e){console.warn(e)}
 finally{clearAuth();location.href="Login.html"}
}

/* ============================================================
   STARTUP
============================================================ */
async function initializeApplication(){
 theme();
 const t=token();
 if(!t){location.href="Login.html";return}
 $("#theme").onclick=toggleTheme;
 $("#logout").onclick=logout;

 $$(".nav").forEach(b=>b.onclick=()=>openView(b.dataset.view));

 try{
  await loadUser();

  /* همه API ها مستقل هستند؛ شکست یک API جلوی بقیه را نمی‌گیرد. */
  const results=await loadAll();
  const failed=results.filter(x=>!x.ok);

  $("#status").textContent=failed.length?"برخی سرویس‌ها خطا دارند":"اتصال به Worker موفق";
  $("#status").classList.toggle("bad",failed.length>0);

  await openView("dashboard");

  if(failed.length)message(failed.length+" API نیاز به بررسی دارد.","warning");
 }catch(e){
  console.error("STARTUP",e);
  $("#status").textContent="اتصال ناموفق";
  $("#status").classList.add("bad");
  $("#main").innerHTML=`<section class="head"><div><h1>خطا در اتصال</h1><p>اطلاعات از Worker دریافت نشد.</p></div></section><div class="error"><b>${esc(e.code||"ERROR")}</b><br>${esc(e.message||"خطای ناشناخته")}</div><button id="retry" class="btn">تلاش مجدد</button>`;
  $("#retry").onclick=initializeApplication;
 }finally{loading(false)}
}

window.addEventListener("error",e=>{console.error(e.error||e.message);loading(false)});
window.addEventListener("unhandledrejection",e=>{console.error(e.reason);loading(false)});
document.addEventListener("DOMContentLoaded",initializeApplication);
</script>
</body>
</html>

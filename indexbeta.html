/* ============================================================
   TABLE BUILDER
============================================================ */

function buildTable(
    columns,
    rows,
    options = {}
){

    const safeColumns =
        Array.isArray(columns)
            ? columns
            : [];


    const safeRows =
        Array.isArray(rows)
            ? rows
            : [];


    if(!safeRows.length){

        return `

            <div class="empty-state">

                <div class="empty-state-icon">
                    ⭕
                </div>

                <div class="empty-state-title">
                    ${escapeHtml(
                        options.empty ||
                        "اطلاعاتی وجود ندارد."
                    )}
                </div>

            </div>

        `;

    }


    let html = `

        <div class="table-responsive">

            <table class="data-table">

                <thead>

                    <tr>

    `;


    safeColumns.forEach(
        column => {

            html += `

                <th>
                    ${escapeHtml(
                        column.label ||
                        ""
                    )}
                </th>

            `;

        }
    );


    if(options.actions){

        html += `
            <th class="actions-column">
                عملیات
            </th>
        `;

    }


    html += `
                    </tr>
                </thead>

                <tbody>
    `;


    safeRows.forEach(
        row => {

            html += "<tr>";


            safeColumns.forEach(
                column => {

                    const value =
                        row?.[
                            column.value
                        ];


                    html += `

                        <td>
                            ${formatTableValue(
                                value,
                                column
                            )}
                        </td>

                    `;

                }
            );


            if(options.actions){

                const id =
                    row?.id ?? "";


                html += `

                    <td class="table-actions">

                        <button
                            type="button"
                            class="btn-icon"
                            data-action="edit"
                            data-id="${escapeHtml(id)}"
                            title="ویرایش"
                            aria-label="ویرایش"
                        >
                            ✎
                        </button>


                        <button
                            type="button"
                            class="btn-icon danger"
                            data-action="delete"
                            data-id="${escapeHtml(id)}"
                            title="حذف"
                            aria-label="حذف"
                        >
                            ×
                        </button>

                    </td>

                `;

            }


            html += "</tr>";

        }
    );


    html += `

                </tbody>

            </table>

        </div>

    `;


    return html;

}


function formatTableValue(
    value,
    column
){

    if(
        value === null ||
        value === undefined ||
        value === ""
    ){

        return "—";

    }


    if(column?.type === "number"){

        const number =
            Number(value);


        if(Number.isFinite(number)){

            return formatNumber(
                number
            );

        }

    }


    if(column?.type === "badge"){

        return statusBadge(
            value
        );

    }


    return escapeHtml(
        String(value)
    );

}


function statusBadge(
    status
){

    const normalized =
        String(
            status ?? ""
        )
        .trim()
        .toLowerCase();


    let label =
        status;


    let className =
        "badge";


    if(
        [
            "active",
            "enabled",
            "1",
            "true",
            "فعال"
        ].includes(normalized)
    ){

        label =
            "فعال";

        className +=
            " success";

    }

    else if(
        [
            "inactive",
            "disabled",
            "0",
            "false",
            "غیرفعال"
        ].includes(normalized)
    ){

        label =
            "غیرفعال";

        className +=
            " muted";

    }


    return `
        <span class="${className}">
            ${escapeHtml(
                String(label ?? "—")
            )}
        </span>
    `;

  }

============================================================ */

const NAVIGATION_MAP = {

    dashboard:
        "dashboard",

    home:
        "dashboard",

    units:
        "units",

    products:
        "products",

    parts:
        "parts",

    warehouses:
        "warehouses"

};


async function openView(
    view
){

    const normalized =
        String(
            view || ""
        )
        .trim()
        .toLowerCase();


    const target =
        NAVIGATION_MAP[
            normalized
        ];


    if(!target){

        console.warn(
            "Unknown navigation target:",
            view
        );

        return;

    }


    closeMobileNavigation();


    setActiveNavigation(
        target
    );


    try{

        switch(target){

            case "dashboard":

                await renderDashboard();

                break;


            case "units":

                await ensureCollectionLoaded(
                    "units",
                    "/api/units",
                    "واحدها"
                );

                await renderEntityView(
                    "units"
                );

                break;


            case "products":

                await ensureCollectionLoaded(
                    "units",
                    "/api/units",
                    "واحدها"
                );

                await ensureCollectionLoaded(
                    "products",
                    "/api/products",
                    "محصولات"
                );

                await renderEntityView(
                    "products"
                );

                break;


            case "parts":

                await ensureCollectionLoaded(
                    "units",
                    "/api/units",
                    "واحدها"
                );

                await ensureCollectionLoaded(
                    "parts",
                    "/api/parts",
                    "قطعات"
                );

                await renderEntityView(
                    "parts"
                );

                break;


            case "warehouses":

                await ensureCollectionLoaded(
                    "warehouses",
                    "/api/warehouses",
                    "انبارها"
                );

                await renderEntityView(
                    "warehouses"
                );

                break;

        }

    }

    catch(error){

        console.error(
            `Navigation error for ${target}:`,
            error
        );


        showMessage(
            error.message ||
            "بارگذاری صفحه انجام نشد.",
            "error"
        );

    }

}


function setActiveNavigation(
    view
){

    $$(
        "[data-view]"
    ).forEach(
        element => {

            const isActive =
                element.dataset.view ===
                view;


            element.classList.toggle(
                "active",
                isActive
            );


            if(isActive){

                element.setAttribute(
                    "aria-current",
                    "page"
                );

            }

            else{

                element.removeAttribute(
                    "aria-current"
                );

            }

        }
    );

}


function closeMobileNavigation(){

    const sidebar =
        $("#sidebar");

    const overlay =
        $("#sidebarOverlay");


    if(sidebar){

        sidebar.classList.remove(
            "open"
        );

    }


    if(overlay){

        overlay.classList.remove(
            "show"
        );

    }


    document.body.classList.remove(
        "sidebar-open"
    );

}


/* ============================================================
   NAVIGATION EVENT BINDING
============================================================ */

function bindNavigation(){

    $$(
        "[data-view]"
    ).forEach(
        element => {

            element.addEventListener(
                "click",
                event => {

                    event.preventDefault();


                    const view =
                        element.dataset.view;


                    if(view){

                        openView(
                            view
                        );

                    }

                }
            );

        }
    );


    const menuButton =
        $("#menuToggle");


    if(menuButton){

        menuButton.addEventListener(
            "click",
            toggleMobileNavigation
        );

    }


    const overlay =
        $("#sidebarOverlay");


    if(overlay){

        overlay.addEventListener(
            "click",
            closeMobileNavigation
        );

    }

}


function toggleMobileNavigation(){

    const sidebar =
        $("#sidebar");

    const overlay =
        $("#sidebarOverlay");


    if(!sidebar){

        return;

    }


    const shouldOpen =
        !sidebar.classList.contains(
            "open"
        );


    sidebar.classList.toggle(
        "open",
        shouldOpen
    );


    if(overlay){

        overlay.classList.toggle(
            "show",
            shouldOpen
        );

    }


    document.body.classList.toggle(
        "sidebar-open",
        shouldOpen
    );

}

/* ============================================================
   DYNAMIC JALALI DATE INPUT SUPPORT
============================================================ */

let jalaliObserverStarted =
    false;


function startJalaliObserver(){

    if(
        jalaliObserverStarted ||
        typeof MutationObserver ===
        "undefined"
    ){

        return;

    }


    jalaliObserverStarted =
        true;


    const observer =
        new MutationObserver(
            mutations => {

                let shouldInitialize =
                    false;


                for(
                    const mutation
                    of mutations
                ){

                    if(
                        mutation.type !==
                        "childList"
                    ){

                        continue;

                    }


                    if(
                        mutation.addedNodes &&
                        mutation.addedNodes.length
                    ){

                        shouldInitialize =
                            true;

                        break;

                    }

                }


                if(shouldInitialize){

                    initializeJalaliDatepickers(
                        document
                    );

                }

            }
        );


    observer.observe(
        document.body,
        {
            childList:true,
            subtree:true
        }
    );

}


/* ============================================================
   START DATE OBSERVER AFTER DOM EXISTS
============================================================ */

if(
    document.readyState ===
    "loading"
){

    document.addEventListener(
        "DOMContentLoaded",
        startJalaliObserver,
        {
            once:true
        }
    );

}

else{

    startJalaliObserver();

}

/**
 * Safe DOM helpers
 */

function $(selector, root = document){

    if(
        !root ||
        typeof root.querySelector !== "function"
    ){

        return null;

    }

    return root.querySelector(selector);

}


function $$(selector, root = document){

    if(
        !root ||
        typeof root.querySelectorAll !== "function"
    ){

        return [];

    }

    return Array.from(
        root.querySelectorAll(selector)
    );

}


/**
 * HTML escaping
 */

function escapeHtml(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/**
 * Persian / Arabic digit normalization
 */

function normalizeDigits(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)
        .replace(/[۰-۹]/g, digit => {

            return String(
                "۰۱۲۳۴۵۶۷۸۹".indexOf(
                    digit
                )
            );

        })
        .replace(/[٠-٩]/g, digit => {

            return String(
                "٠١٢٣٤٥٦٧٨٩".indexOf(
                    digit
                )
            );

        });

}


/**
 * Number formatting
 */

function formatNumber(value){

    const number =
        Number(value);


    if(
        !Number.isFinite(number)
    ){

        return "۰";

    }


    try{

        return new Intl.NumberFormat(
            "fa-IR"
        ).format(number);

    }

    catch(error){

        return String(number);

    }

}


/**
 * Jalali date normalization
 *
 * Application contract:
 * YYYY/MM/DD
 */

function normalizeJalaliInput(
    value
){

    const normalized =
        normalizeDigits(
            value
        )
        .trim()
        .replace(/-/g, "/")
        .replace(/\./g, "/");


    if(!normalized){

        return "";

    }


    const parts =
        normalized
            .split("/")
            .map(
                part =>
                    part.trim()
            );


    if(
        parts.length !== 3
    ){

        return "";

    }


    const year =
        Number(parts[0]);

    const month =
        Number(parts[1]);

    const day =
        Number(parts[2]);


    if(
        !Number.isInteger(year) ||
        !Number.isInteger(month) ||
        !Number.isInteger(day)
    ){

        return "";

    }


    if(
        year < 1200 ||
        year > 1600 ||
        month < 1 ||
        month > 12 ||
        day < 1 ||
        day > 31
    ){

        return "";

    }


    return [

        String(year).padStart(
            4,
            "0"
        ),

        String(month).padStart(
            2,
            "0"
        ),

        String(day).padStart(
            2,
            "0"
        )

    ].join("/");

}


/**
 * API error normalization
 */

function normalizeApiError(
    error,
    fallback =
        "خطایی در ارتباط با سرور رخ داد."
){

    if(!error){

        return new Error(
            fallback
        );

    }


    if(
        error instanceof Error
    ){

        return error;

    }


    if(
        typeof error === "string"
    ){

        return new Error(
            error
        );

    }


    return new Error(
        error.message ||
        error.error ||
        fallback
    );

}


/**
 * Global notification helper
 */

function showMessage(
    message,
    type = "info"
){

    const text =
        String(
            message ||
            ""
        ).trim();


    if(!text){

        return;

    }


    let container =
        $("#appNotifications");


    if(!container){

        container =
            document.createElement(
                "div"
            );


        container.id =
            "appNotifications";


        container.className =
            "app-notifications";


        container.setAttribute(
            "aria-live",
            "polite"
        );


        document.body.appendChild(
            container
        );

    }


    const notification =
        document.createElement(
            "div"
        );


    notification.className =
        `notification notification-${escapeHtml(type)}`;


    notification.setAttribute(
        "role",
        type === "error"
            ? "alert"
            : "status"
    );


    notification.textContent =
        text;


    container.appendChild(
        notification
    );


    window.setTimeout(
        () => {

            notification.classList.add(
                "is-hiding"
            );


            window.setTimeout(
                () => {

                    notification.remove();

                },
                250
            );

        },
        4500
    );

}


/**
 * Loading state
 */

let activeRequests =
    0;


function setGlobalLoading(
    active
){

    const loader =
        $("#globalLoader");


    if(loader){

        loader.hidden =
            !active;

    }


    document.body.classList.toggle(
        "is-loading",
        Boolean(active)
    );

}


function beginRequest(){

    activeRequests +=
        1;


    setGlobalLoading(
        true
    );

}


function endRequest(){

    activeRequests =
        Math.max(
            0,
            activeRequests - 1
        );


    if(
        activeRequests === 0
    ){

        setGlobalLoading(
            false
        );

    }

}


/* ============================================================
   MODAL SYSTEM
============================================================ */

function ensureModal(){

    let modal =
        $("#appModal");


    if(modal){

        return modal;

    }


    modal =
        document.createElement(
            "div"
        );


    modal.id =
        "appModal";


    modal.className =
        "modal";

    modal.hidden =
        true;


    modal.setAttribute(
        "role",
        "dialog"
    );


    modal.setAttribute(
        "aria-modal",
        "true"
    );


    modal.innerHTML = `

        <div
            class="modal-dialog"
            role="document"
        >

            <div class="modal-header">

                <h2
                    class="modal-title"
                    id="appModalTitle"
                ></h2>

                <button
                    type="button"
                    class="modal-close"
                    data-action="close-modal"
                    aria-label="بستن"
                >
                    ×
                </button>

            </div>


            <div
                class="modal-body"
                id="appModalBody"
            ></div>


            <div
                class="modal-footer"
                id="appModalFooter"
            ></div>

        </div>

    `;


    document.body.appendChild(
        modal
    );


    bindModalEvents();


    return modal;

}


function openModal(
    title,
    body,
    footer = ""
){

    const modal =
        ensureModal();


    const titleElement =
        $("#appModalTitle", modal);


    const bodyElement =
        $("#appModalBody", modal);


    const footerElement =
        $("#appModalFooter", modal);


    if(titleElement){

        titleElement.textContent =
            title || "";

    }


    if(bodyElement){

        bodyElement.innerHTML =
            body || "";

    }


    if(footerElement){

        footerElement.innerHTML =
            footer || "";

    }


    modal.hidden =
        false;


    modal.classList.add(
        "open"
    );


    document.body.classList.add(
        "modal-open"
    );


    initializeJalaliDatepickers(
        modal
    );


    window.requestAnimationFrame(
        () => {

            const firstFocusable =
                modal.querySelector(
                    "input:not([type='hidden']), select, textarea, button"
                );


            if(firstFocusable){

                firstFocusable.focus();

            }

        }
    );

}


function closeModal(){

    const modal =
        $("#appModal");


    if(!modal){

        return;

    }


    modal.classList.remove(
        "open"
    );


    modal.hidden =
        true;


    document.body.classList.remove(
        "modal-open"
    );

}


/* ============================================================
   COLLECTION STATE
============================================================ */

function ensureStateCollection(
    key
){

    if(
        !Object.prototype.hasOwnProperty.call(
            STATE,
            key
        )
    ){

        STATE[key] =
            [];

    }


    if(
        !Array.isArray(
            STATE[key]
        )
    ){

        STATE[key] =
            [];

    }


    return STATE[key];

}


function findCollectionItem(
    key,
    id
){

    const collection =
        ensureStateCollection(
            key
        );


    return collection.find(
        item =>
            String(item?.id) ===
            String(id)
    ) || null;

}


/* ============================================================
   COLLECTION LOADING
============================================================ */

async function loadCollection(
    key,
    endpoint,
    label = ""
){

    if(
        !key ||
        !endpoint
    ){

        throw new Error(
            "اطلاعات درخواست ناقص است."
        );

    }


    try{

        const result =
            await apiRequest(
                endpoint,
                {
                    method:"GET",
                    silent:true
                }
            );


        const data =
            extractCollectionData(
                result
            );


        STATE[key] =
            data;


        STATE.loaded =
            STATE.loaded ||
            {};


        STATE.loaded[key] =
            true;


        return data;

    }

    catch(error){

        const normalized =
            normalizeApiError(
                error,
                label
                    ? `دریافت ${label} انجام نشد.`
                    : "دریافت اطلاعات انجام نشد."
            );


        throw normalized;

    }

}


function extractCollectionData(
    result
){

    if(Array.isArray(result)){

        return result;

    }


    if(
        Array.isArray(
            result?.data
        )
    ){

        return result.data;

    }


    if(
        Array.isArray(
            result?.items
        )
    ){

        return result.items;

    }


    if(
        Array.isArray(
            result?.results
        )
    ){

        return result.results;

    }


    return [];

}


async function ensureCollectionLoaded(
    key,
    endpoint,
    label = ""
){

    STATE.loaded =
        STATE.loaded ||
        {};


    if(
        STATE.loaded[key] === true &&
        Array.isArray(
            STATE[key]
        )
    ){

        return STATE[key];

    }


    return loadCollection(
        key,
        endpoint,
        label
    );

}

async function renderEntityView(
    key
){

    const config =
        ENTITY_CONFIG[key];


    if(!config){

        console.error(
            "Unknown entity:",
            key
        );

        return;

    }


    const mainContent =
        $("#mainContent");


    if(!mainContent){

        console.error(
            "mainContent element is missing."
        );

        return;

    }


    const data =
        ensureStateCollection(
            key
        );


    mainContent.innerHTML = `

        ${pageHeader(
            config.title,
            config.description,
            data.length
        )}


        <section class="card">

            <div class="card-header">

                <div class="card-header-main">

                    <h2 class="card-title">
                        ${escapeHtml(
                            config.title
                        )}
                    </h2>

                </div>


                <div class="card-header-actions">

                    <button
                        type="button"
                        class="btn"
                        data-create-entity="${escapeHtml(key)}"
                    >
                        + افزودن
                    </button>

                </div>

            </div>


            <div class="card-body">

                <div
                    class="table-container"
                    id="entityTableContainer"
                >

                    ${buildTable(
                        config.columns,
                        data,
                        {
                            actions:true,
                            empty:
                                `هنوز ${config.title} ثبت نشده است.`
                        }
                    )}

                </div>

            </div>

        </section>

    `;


    bindEntityActions(
        key
    );

}


function bindEntityActions(
    key
){

    const config =
        ENTITY_CONFIG[key];


    if(!config){

        return;

    }


    $$(
        "[data-create-entity]"
    ).forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    if(
                        typeof config.create ===
                        "function"
                    ){

                        config.create();

                    }

                }
            );

        }
    );


    const table =
        $("#entityTableContainer");


    if(!table){

        return;

    }


    table.addEventListener(
        "click",
        async event => {

            const button =
                event.target.closest(
                    "[data-action]"
                );


            if(!button){

                return;

            }


            const action =
                button.dataset.action;


            const id =
                button.dataset.id;


            if(!id){

                return;

            }


            if(action === "edit"){

                const item =
                    findCollectionItem(
                        key,
                        id
                    );


                if(!item){

                    showMessage(
                        "رکورد موردنظر پیدا نشد.",
                        "error"
                    );

                    return;

                }


                if(
                    typeof config.create ===
                    "function"
                ){

                    config.create(
                        item
                    );

                }

                return;

            }


            if(action === "delete"){

                await deleteEntity(
                    key,
                    id
                );

            }

        }
    );

}


/* ============================================================
   ENTITY DELETE
============================================================ */

async function deleteEntity(
    key,
    id
){

    const config =
        ENTITY_CONFIG[key];


    if(!config){

        return;

    }


    const item =
        findCollectionItem(
            key,
            id
        );


    const displayName =
        item?.name ||
        item?.code ||
        "این مورد";


    const confirmed =
        window.confirm(
            `آیا از حذف «${displayName}» مطمئن هستید؟`
        );


    if(!confirmed){

        return;

    }


    try{

        const result =
            await apiRequest(
                `${config.endpoint}/${encodeURIComponent(id)}`,
                {
                    method:"DELETE",
                    loadingText:
                        "در حال حذف..."
                }
            );


        showMessage(
            result.message ||
            "رکورد با موفقیت حذف شد.",
            "success"
        );


        STATE.loaded =
            STATE.loaded ||
            {};


        STATE.loaded[key] =
            false;


        await loadCollection(
            key,
            config.endpoint,
            config.title
        );


        await renderEntityView(
            key
        );

    }

    catch(error){

        console.error(
            `Delete ${key} failed:`,
            error
        );


        showMessage(
            error.message ||
            "حذف رکورد انجام نشد.",
            "error"
        );

    }

}


/* ============================================================
   FINAL API ADAPTER
============================================================ */

async function apiRequest(
    url,
    options = {}
){

    const {

        method = "GET",

        body = undefined,

        headers = {},

        silent = false,

        loadingText = ""

    } = options;


    if(
        typeof url !== "string" ||
        !url.trim()
    ){

        throw new Error(
            "آدرس API نامعتبر است."
        );

    }


    const requestHeaders = {

        Accept:
            "application/json",

        ...headers

    };


    const fetchOptions = {

        method:
            String(method)
                .toUpperCase(),

        credentials:
            "include",

        headers:
            requestHeaders

    };


    if(
        body !== undefined &&
        body !== null
    ){

        requestHeaders[
            "Content-Type"
        ] =
            "application/json";


        fetchOptions.body =
            JSON.stringify(body);

    }


    if(
        !silent &&
        loadingText
    ){

        beginRequest();

    }


    try{

        const response =
            await fetch(
                url,
                fetchOptions
            );


        const contentType =
            response.headers.get(
                "content-type"
            ) || "";


        let payload;


        if(
            contentType.includes(
                "application/json"
            )
        ){

            payload =
                await response.json();

        }

        else{

            const text =
                await response.text();


            payload =
                text
                    ? { data:text }
                    : {};

        }


        if(
            !response.ok
        ){

            const message =
                payload?.message ||
                payload?.error ||
                (
                    response.status === 401
                        ? "نیاز به ورود مجدد دارید."
                        : response.status === 403
                            ? "دسترسی شما مجاز نیست."
                            : response.status === 404
                                ? "منبع موردنظر پیدا نشد."
                                : "درخواست با خطا مواجه شد."
                );


            const error =
                new Error(
                    message
                );


            error.status =
                response.status;


            error.payload =
                payload;


            throw error;

        }


        return payload || {};

    }

    catch(error){

        const normalized =
            normalizeApiError(
                error
            );


        if(
            normalized.status === 401
        ){

            clearAuthenticationState();

        }


        throw normalized;

    }

    finally{

        if(
            !silent &&
            loadingText
        ){

            endRequest();

        }

    }

}


/* ============================================================
   DATEPICKER INITIALIZATION
============================================================ */

function initializeJalaliDatepickers(
    root = document
){

    if(!root){

        return;

    }


    const elements = [

        ...(
            typeof root.matches ===
            "function" &&
            root.matches(
                ".jalali-date, [data-date-type='jalali']"
            )
                ? [root]
                : []
        ),

        ...(
            typeof root.querySelectorAll ===
            "function"
                ? Array.from(
                    root.querySelectorAll(
                        ".jalali-date, [data-date-type='jalali']"
                    )
                )
                : []
        )

    ];


    elements.forEach(
        initializeSingleJalaliDatepicker
    );

}


function initializeSingleJalaliDatepicker(
    input
){

    if(
        !input ||
        input.nodeType !== 1
    ){

        return;

    }


    if(
        input.dataset.jalaliInitialized ===
        "true"
    ){

        return;

    }


    /*
     * The application deliberately does not
     * call an unknown datepicker API.
     *
     * If the repository's loaded Persian
     * datepicker exposes the standard jQuery
     * datepicker interface, initialize it.
     */

    if(
        window.jQuery &&
        typeof window.jQuery.fn?.datepicker ===
        "function"
    ){

        const $input =
            window.jQuery(input);


        try{

            if(
                typeof $input.hasClass ===
                "function" &&
                $input.hasClass(
                    "hasDatepicker"
                )
            ){

                input.dataset.jalaliInitialized =
                    "true";

                return;

            }


            $input.datepicker({

                dateFormat:
                    "yy/mm/dd",

                changeMonth:
                    true,

                changeYear:
                    true,

                showButtonPanel:
                    true

            });


            input.dataset.jalaliInitialized =
                "true";

        }

        catch(error){

            console.error(
                "Jalali datepicker initialization failed:",
                error,
                input
            );

        }

    }

}


/* ============================================================
   GENERIC FORM FOCUS / VALIDATION
============================================================ */

document.addEventListener(
    "input",
    event => {

        const target =
            event.target;


        if(
            !target ||
            !target.closest
        ){

            return;

        }


        if(
            target.classList?.contains(
                "is-invalid"
            )
        ){

            target.classList.remove(
                "is-invalid"
            );


            target.removeAttribute(
                "aria-invalid"
            );


            const form =
                target.closest(
                    "form"
                );


            const name =
                target.name;


            if(
                form &&
                name
            ){

                const errorElement =
                    form.querySelector(
                        `[data-error-for="${CSS.escape(name)}"]`
                    );


                if(errorElement){

                    errorElement.textContent =
                        "";

                }

            }

        }

    }
);

     * protected by applicationStarted.
     *

     * cannot remain uninitialized when this block
     * is evaluated after DOM creation.
     */

        "loading"
    ){

        if(
            typeof initializeApplication ===
            "function"
        ){

        }

    }

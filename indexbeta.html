<!doctype html>
<html lang="fa" dir="rtl">

<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>

<meta
    name="theme-color"
    content="#2563eb"
>

<meta
    name="description"
    content="سامانه مدیریت تولید، BOM و انبار نی‌نی‌تو"
>

<title>
    داشبورد | سامانه نی‌نی‌تو
</title>


<link
    rel="stylesheet"
    href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css"
>

<link
    rel="stylesheet"
    href="css/bootstrap-datepicker.min.css"
/>


<style>

/* =========================================================
   THEME
========================================================= */

:root{

    --bg:#f4f7fb;

    --surface:#ffffff;

    --surface-2:#f8fafc;

    --text:#172033;

    --muted:#64748b;

    --border:#e2e8f0;

    --primary:#2563eb;

    --primary-hover:#1d4ed8;

    --success:#16a34a;

    --warning:#d97706;

    --danger:#dc2626;

    --info:#0284c7;

    --shadow:
        0 8px 28px rgba(15,23,42,.08);

    --radius:14px;

    --sidebar-width:240px;

}


:root[data-theme="dark"]{

    --bg:#0f172a;

    --surface:#1e293b;

    --surface-2:#172033;

    --text:#f8fafc;

    --muted:#94a3b8;

    --border:#334155;

    --primary:#60a5fa;

    --primary-hover:#93c5fd;

    --success:#4ade80;

    --warning:#fbbf24;

    --danger:#f87171;

    --info:#38bdf8;

    --shadow:
        0 8px 28px rgba(0,0,0,.25);

}


/* =========================================================
   RESET
========================================================= */

*{

    box-sizing:border-box;

}


html{

    scroll-behavior:smooth;

}


body{

    margin:0;

    min-height:100vh;

    background:var(--bg);

    color:var(--text);

    font-family:
        Tahoma,
        "Segoe UI",
        Arial,
        sans-serif;

}


button,
input,
select,
textarea{

    font:inherit;

}


button{

    cursor:pointer;

}


button:disabled{

    cursor:not-allowed;

    opacity:.55;

}


/* =========================================================
   HEADER
========================================================= */

.header{

    position:sticky;

    top:0;

    z-index:100;

    background:var(--surface);

    border-bottom:
        1px solid var(--border);

}


.header-inner{

    max-width:1600px;

    margin:auto;

    padding:
        11px 18px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

}


.brand{

    display:flex;

    align-items:center;

    gap:11px;

    min-width:0;

}


.logo{

    width:44px;

    height:44px;

    flex:none;

    display:grid;

    place-items:center;

    border-radius:12px;

    background:var(--primary);

    color:#fff;

    font-size:22px;

    font-weight:900;

}


.brand-text{

    min-width:0;

}


.brand-title{

    font-weight:900;

    font-size:16px;

}


.brand-subtitle{

    margin-top:3px;

    color:var(--muted);

    font-size:11px;

}


.header-actions{

    display:flex;

    align-items:center;

    gap:7px;

    flex-wrap:wrap;

}


.current-user{

    padding:
        8px 11px;

    border:
        1px solid var(--border);

    border-radius:10px;

    background:var(--surface-2);

    color:var(--muted);

    font-size:12px;

}


.current-user strong{

    color:var(--text);

}


/* =========================================================
   LAYOUT
========================================================= */

.app-layout{

    max-width:1600px;

    margin:auto;

    padding:18px;

    display:grid;

    grid-template-columns:
        var(--sidebar-width)
        minmax(0,1fr);

    gap:18px;

}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{

    position:sticky;

    top:82px;

    align-self:start;

    background:var(--surface);

    border:
        1px solid var(--border);

    border-radius:var(--radius);

    box-shadow:var(--shadow);

    padding:9px;

}


.sidebar-title{

    padding:
        8px 10px;

    color:var(--muted);

    font-size:11px;

    font-weight:700;

}


.nav-button{

    width:100%;

    display:flex;

    align-items:center;

    gap:8px;

    border:0;

    background:transparent;

    color:var(--text);

    text-align:right;

    padding:
        10px 11px;

    border-radius:9px;

    margin-bottom:2px;

}


.nav-button:hover{

    background:
        rgba(37,99,235,.08);

}


.nav-button.active{

    background:
        rgba(37,99,235,.13);

    color:var(--primary);

    font-weight:800;

}


.nav-icon{

    width:22px;

    text-align:center;

}


/* =========================================================
   MAIN
========================================================= */

.main{

    min-width:0;

}


.page-head{

    display:flex;

    align-items:flex-start;

    justify-content:space-between;

    gap:15px;

    margin-bottom:15px;

}


.page-title{

    margin:0;

    font-size:24px;

}


.page-description{

    margin:
        4px 0 0;

    color:var(--muted);

    font-size:13px;

}


.connection-status{

    flex:none;

    padding:
        7px 11px;

    border-radius:999px;

    background:
        rgba(22,163,74,.12);

    color:var(--success);

    font-size:11px;

    font-weight:800;

}


.connection-status.bad{

    background:
        rgba(220,38,38,.12);

    color:var(--danger);

}


/* =========================================================
   CARD
========================================================= */

.card{

    background:var(--surface);

    border:
        1px solid var(--border);

    border-radius:var(--radius);

    box-shadow:var(--shadow);

    overflow:hidden;

    margin-bottom:15px;

}


.card-header{

    padding:
        13px 15px;

    border-bottom:
        1px solid var(--border);

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

}


.card-title{

    margin:0;

    font-size:15px;

    font-weight:800;

}


.card-body{

    padding:15px;

}


/* =========================================================
   STAT
========================================================= */

.stats{

    display:grid;

    grid-template-columns:
        repeat(5,minmax(0,1fr));

    gap:12px;

    margin-bottom:15px;

}


.stat-card{

    background:var(--surface);

    border:
        1px solid var(--border);

    border-radius:var(--radius);

    box-shadow:var(--shadow);

    padding:15px;

}


.stat-label{

    color:var(--muted);

    font-size:11px;

}


.stat-value{

    display:block;

    margin-top:5px;

    font-size:25px;

    font-weight:900;

}


/* =========================================================
   BUTTON
========================================================= */

.btn{

    min-height:38px;

    border:0;

    border-radius:9px;

    padding:
        8px 13px;

    background:var(--primary);

    color:#fff;

    font-weight:700;

}


.btn:hover{

    background:var(--primary-hover);

}


.btn.secondary{

    background:var(--surface);

    color:var(--text);

    border:
        1px solid var(--border);

}


.btn.success{

    background:var(--success);

}


.btn.warning{

    background:var(--warning);

}


.btn.danger{

    background:var(--danger);

}


.btn.small{

    min-height:32px;

    padding:
        5px 9px;

    font-size:11px;

}


.toolbar{

    display:flex;

    flex-wrap:wrap;

    gap:7px;

}


/* =========================================================
   FORM
========================================================= */

.form-grid{

    display:grid;

    grid-template-columns:
        repeat(3,minmax(0,1fr));

    gap:13px;

}


.form-group{

    min-width:0;

}


.form-group.full{

    grid-column:
        1 / -1;

}


.form-label{

    display:block;

    margin-bottom:6px;

    font-size:12px;

    font-weight:800;

}


.required{

    color:var(--danger);

}


.form-control{

    width:100%;

    min-height:40px;

    padding:
        8px 10px;

    border:
        1px solid var(--border);

    border-radius:9px;

    outline:none;

    background:var(--surface-2);

    color:var(--text);

}


.form-control:focus{

    border-color:var(--primary);

    box-shadow:
        0 0 0 3px
        rgba(37,99,235,.12);

}


textarea.form-control{

    min-height:90px;

    resize:vertical;

}


.form-help{

    display:block;

    margin-top:4px;

    color:var(--muted);

    font-size:10px;

}


.form-error{

    display:block;

    margin-top:4px;

    color:var(--danger);

    font-size:11px;

}


.number-words{

    margin-top:5px;

    min-height:17px;

    color:var(--muted);

    font-size:10px;

}


/* =========================================================
   TABLE
========================================================= */

.table-container{

    width:100%;

    overflow-x:auto;

}


.data-table{

    width:100%;

    min-width:760px;

    border-collapse:collapse;

}


.data-table th,
.data-table td{

    padding:
        9px 10px;

    border-bottom:
        1px solid var(--border);

    text-align:right;

    white-space:nowrap;

    font-size:12px;

}


.data-table th{

    background:var(--surface-2);

    color:var(--muted);

    font-size:11px;

}

.data-table tbody tr:hover{

    background:
        rgba(37,99,235,.035);

}


/* =========================================================
   BADGE
========================================================= */

.badge{

    display:inline-flex;

    align-items:center;

    padding:
        4px 8px;

    border-radius:999px;

    font-size:10px;

    font-weight:800;

}


.badge.success{

    background:
        rgba(22,163,74,.12);

    color:var(--success);

}


.badge.warning{

    background:
        rgba(217,119,6,.12);

    color:var(--warning);

}


.badge.danger{

    background:
        rgba(220,38,38,.12);

    color:var(--danger);

}


.badge.info{

    background:
        rgba(2,132,199,.12);

    color:var(--info);

}


/* =========================================================
   EMPTY / LOADING
========================================================= */

.empty-state{

    padding:35px 15px;

    text-align:center;

    color:var(--muted);

    font-size:13px;

}


.loading-state{

    padding:30px 15px;

    text-align:center;

    color:var(--muted);

}


.spinner{

    width:28px;

    height:28px;

    margin:
        0 auto 10px;

    border:
        3px solid var(--border);

    border-top-color:
        var(--primary);

    border-radius:50%;

    animation:
        spin .8s linear infinite;

}


@keyframes spin{

    to{

        transform:
            rotate(360deg);

    }

}


/* =========================================================
   MODAL
========================================================= */

.modal-backdrop{

    position:fixed;

    inset:0;

    z-index:1000;

    display:none;

    align-items:center;

    justify-content:center;

    padding:15px;

    background:
        rgba(15,23,42,.55);

}


.modal-backdrop.show{

    display:flex;

}


.modal{

    width:
        min(900px,100%);

    max-height:
        calc(100vh - 30px);

    overflow:auto;

    background:var(--surface);

    color:var(--text);

    border:
        1px solid var(--border);

    border-radius:var(--radius);

    box-shadow:
        0 25px 70px
        rgba(15,23,42,.25);

}


.modal-header{

    position:sticky;

    top:0;

    z-index:2;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    padding:
        13px 15px;

    background:var(--surface);

    border-bottom:
        1px solid var(--border);

}


.modal-header h2{

    margin:0;

    font-size:16px;

}


.modal-close{

    width:34px;

    height:34px;

    border:0;

    border-radius:8px;

    background:var(--surface-2);

    color:var(--text);

    font-size:20px;

}


.modal-body{

    padding:15px;

}


.modal-footer{

    display:flex;

    justify-content:flex-start;

    gap:7px;

    padding:
        12px 15px;

    border-top:
        1px solid var(--border);

}


/* =========================================================
   MESSAGE
========================================================= */

.message-container{

    position:fixed;

    left:15px;

    bottom:15px;

    z-index:2000;

    width:
        min(420px,calc(100% - 30px));

}


.message{

    display:none;

    padding:
        11px 13px;

    border-radius:10px;

    border:
        1px solid var(--border);

    background:var(--surface);

    color:var(--text);

    box-shadow:var(--shadow);

    font-size:12px;

}


.message.show{

    display:block;

}


.message.success{

    border-color:
        rgba(22,163,74,.35);

}


.message.error{

    border-color:
        rgba(220,38,38,.35);

}


.message.warning{

    border-color:
        rgba(217,119,6,.35);

}


/* =========================================================
   GLOBAL LOADER
========================================================= */

.global-loader{

    position:fixed;

    inset:0;

    z-index:3000;

    display:none;

    align-items:center;

    justify-content:center;

    background:
        rgba(15,23,42,.28);

    backdrop-filter:
        blur(2px);

}


.global-loader.show{

    display:flex;

}


.loader-box{

    min-width:220px;

    padding:20px;

    border-radius:14px;

    background:var(--surface);

    color:var(--text);

    box-shadow:var(--shadow);

    text-align:center;

}


.loader-box .spinner{

    margin-bottom:12px;

}


/* =========================================================
   FOOTER
========================================================= */

.footer{

    max-width:1600px;

    margin:auto;

    padding:
        0 18px 20px;

    color:var(--muted);

    font-size:10px;

    text-align:center;

}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1200px){

    .stats{

        grid-template-columns:
            repeat(3,minmax(0,1fr));

    }

}


@media(max-width:900px){

    .app-layout{

        grid-template-columns:
            1fr;

    }


    .sidebar{

        position:static;

        display:grid;

        grid-template-columns:
            repeat(2,minmax(0,1fr));

        gap:4px;

    }


    .sidebar-title{

        grid-column:
            1 / -1;

    }


    .form-grid{

        grid-template-columns:
            repeat(2,minmax(0,1fr));

    }

}


@media(max-width:600px){

    .header-inner{

        align-items:flex-start;

        flex-direction:column;

    }


    .header-actions{

        width:100%;

    }


    .current-user{

        flex:1;

    }


    .app-layout{

        padding:10px;

    }


    .page-head{

        flex-direction:column;

    }


    .stats{

        grid-template-columns:
            repeat(2,minmax(0,1fr));

    }


    .form-grid{

        grid-template-columns:
            1fr;

    }


    .form-group.full{

        grid-column:auto;

    }


    .sidebar{

        grid-template-columns:
            1fr 1fr;

    }


    .nav-button{

        font-size:11px;

    }


    .page-title{

        font-size:20px;

    }

}


@media(max-width:380px){

    .stats{

        grid-template-columns:1fr;

    }


    .sidebar{

        grid-template-columns:1fr;

    }

}


/* =========================================================
   JALALI DATE INPUT
========================================================= */

.jalali-date{

    direction:ltr;

    text-align:right;

}


.jalali-date::placeholder{

    color:var(--muted);

}


/* =========================================================
   UTILITY
========================================================= */

.hidden{

    display:none !important;

}


.text-muted{

    color:var(--muted);

}


.text-success{

    color:var(--success);

}


.text-danger{

    color:var(--danger);

}


.text-warning{

    color:var(--warning);

}


.text-center{

    text-align:center;

}


.mt-1{

    margin-top:8px;

}


.mt-2{

    margin-top:15px;

}


.mb-1{

    margin-bottom:8px;

}


.mb-2{

    margin-bottom:15px;

}


.flex{

    display:flex;

}


.items-center{

    align-items:center;

}


.justify-between{

    justify-content:space-between;

}


.gap-1{

    gap:8px;

}


.gap-2{

    gap:15px;

}


/* =========================================================
   BOM / DYNAMIC ROWS
========================================================= */

.dynamic-row{

    display:grid;

    grid-template-columns:
        minmax(0,2fr)
        minmax(120px,1fr)
        auto;

    gap:8px;

    align-items:end;

    margin-bottom:8px;

}


.dynamic-row .remove-row{

    min-width:38px;

}


@media(max-width:600px){

    .dynamic-row{

        grid-template-columns:1fr;

    }

}


/* =========================================================
   PRINT
========================================================= */

@media print{

    .header,
    .sidebar,
    .footer,
    .toolbar,
    .btn{

        display:none !important;

    }


    .app-layout{

        display:block;

        max-width:none;

        padding:0;

    }


    .card{

        box-shadow:none;

        border:
            1px solid #ccc;

    }

}

</style>

</head>


<body>

<header class="header">

    <div class="header-inner">

        <div class="brand">

            <div class="logo">
                ن
            </div>

            <div class="brand-text">

                <div class="brand-title">
                    سامانه نی‌نی‌تو
                </div>

                <div class="brand-subtitle">
                    مدیریت تولید، BOM و انبار
                </div>

            </div>

        </div>


        <div class="header-actions">

            <div class="current-user">

                کاربر:

                <strong id="currentUser">
                    -
                </strong>

            </div>


            <button
                type="button"
                class="btn secondary"
                id="themeButton"
            >
                تم شب
            </button>


            <button
                type="button"
                class="btn danger"
                id="logoutButton"
            >
                خروج
            </button>

        </div>

    </div>

</header>


<div class="app-layout">


    <aside
        class="sidebar"
        aria-label="منوی سامانه"
    >

        <div class="sidebar-title">
            منوی سامانه
        </div>


        <button
            type="button"
            class="nav-button active"
            data-view="dashboard"
        >

            <span
                class="nav-icon"
                aria-hidden="true"
            >
                ⌂
            </span>

            داشبورد

        </button>


        <button
            type="button"
            class="nav-button"
            data-view="units"
        >

            <span
                class="nav-icon"
                aria-hidden="true"
            >
                ◈
            </span>

            واحدها

        </button>


        <button
            type="button"
            class="nav-button"
            data-view="products"
        >

            <span
                class="nav-icon"
                aria-hidden="true"
            >
                ▣
            </span>

            محصولات

        </button>


        <button
            type="button"
            class="nav-button"
            data-view="parts"
        >

            <span
                class="nav-icon"
                aria-hidden="true"
            >
                ◆
            </span>

            قطعات

        </button>


        <button
            type="button"
            class="nav-button"
            data-view="warehouses"
        >

            <span
                class="nav-icon"
                aria-hidden="true"
            >
                ▤
            </span>

            انبارها

        </button>


        <button
            type="button"
            class="nav-button"
            data-view="boms"
        >

            <span
                class="nav-icon"
                aria-hidden="true"
            >
                ⊞
            </span>

            BOM

        </button>


        <button
            type="button"
            class="nav-button"
            data-view="planning"
        >

            <span
                class="nav-icon"
                aria-hidden="true"
            >
                ◷
            </span>

            برنامه تولید

        </button>


        <button
            type="button"
            class="nav-button"
            data-view="production"
        >

            <span
                class="nav-icon"
                aria-hidden="true"
            >
                ⚙
            </span>

            ثبت تولید

        </button>


        <button
            type="button"
            class="nav-button"
            data-view="inventory"
        >

            <span
                class="nav-icon"
                aria-hidden="true"
            >
                ▥
            </span>

            موجودی انبار

        </button>


        <button
            type="button"
            class="nav-button"
            data-view="barcode"
        >

            <span
                class="nav-icon"
                aria-hidden="true"
            >
                ▥
            </span>

            بارکد

        </button>

    </aside>


    <main
        class="main"
        id="mainContent"
    >

        <section class="page-head">

            <div>

                <h1
                    class="page-title"
                    id="pageTitle"
                >
                    داشبورد
                </h1>

                <p
                    class="page-description"
                    id="pageDescription"
                >
                    در حال بارگذاری...
                </p>

            </div>


            <span
                class="connection-status"
                id="connectionStatus"
                role="status"
                aria-live="polite"
            >
                بررسی اتصال
            </span>

        </section>


        <section
            class="card"
            id="initialContent"
        >

            <div class="card-body">

                <div class="loading-state">

                    <div class="spinner"></div>

                    <div>
                        در حال آماده‌سازی سامانه...
                    </div>

                </div>

            </div>

        </section>

    </main>

</div>


<footer class="footer">

    نی‌نی‌تو — سامانه مدیریت تولید، BOM و انبار

</footer>


<div
    class="message-container"
    aria-live="polite"
    aria-atomic="true"
>

    <div
        id="appMessage"
        class="message"
        role="alert"
    ></div>

</div>


<div

function escapeHtml(
    value
){

    return String(
        value ?? ""
    ).replace(
        /[&<>"']/g,
        character => ({

            "&":
                "&amp;",

            "<":
                "&lt;",

            ">":
                "&gt;",

            '"':
                "&quot;",

            "'":
                "&#039;"

        }[character])
    );

}


function normalizeDigits(
    value
){

    return String(
        value ?? ""
    )
        .replace(
            /[۰-۹]/g,
            character =>
                String(
                    "۰۱۲۳۴۵۶۷۸۹"
                        .indexOf(
                            character
                        )
                )
        );

}


function toNumber(
    value
){

    const normalized =
        normalizeDigits(
            value
        )
            .replace(
                /,/g,
                ""
            )
            .replace(
                /٬/g,
                ""
            )
            .replace(
                /،/g,
                ""
            )
            .trim();


    if(
        normalized === ""
    ){

        return 0;

    }


    const number =
        Number(
            normalized
        );


    return Number.isFinite(
        number
    )
        ? number
        : 0;

}


function formatNumber(
    value
){

    return toNumber(
        value
    ).toLocaleString(
        "fa-IR"
    );

}

function setLoading(

){

    const loaderText =

            .removeAttribute(

        $("#themeButton");

        document.documentElement
            .getAttribute(
                "data-theme"

        current === "dark"
            ? "light"
            : "dark";


    try{

            CONFIG.THEME_KEY,
            next
        );

    }

    catch(error){

        console.error(
            "Unable to save theme:",
            error
        );

    }


    applyTheme();

/* =========================================================
   API ERROR NORMALIZATION
========================================================= */

function normalizeApiError(
    data,
    status
){

    if(
        data &&
        data.error
    ){

        return {

            code:
                data.error.code ||
                "API_ERROR",

            message:
                data.error.message ||
                "خطایی در سامانه رخ داد.",

            status

        };

    }


    const messages = {

        400:
            "درخواست ارسال‌شده معتبر نیست.",

        401:
            "نشست شما معتبر نیست. لطفاً دوباره وارد شوید.",

        403:
            "شما مجوز انجام این عملیات را ندارید.",

        404:
            "اطلاعات موردنظر پیدا نشد.",

        409:
            "اطلاعات با داده‌های موجود تداخل دارد.",

        422:
            "اطلاعات واردشده معتبر نیست.",

        500:
            "خطای داخلی سامانه رخ داده است.",

        502:
            "پاسخ معتبر از Worker دریافت نشد.",

        503:
            "سرویس موقتاً در دسترس نیست."

    };


    return {

        code:
            "HTTP_" +
            String(
                status ||
                "UNKNOWN"
            ),

        message:
            messages[status] ||
            "عملیات انجام نشد.",

        status

    };

}


/* =========================================================
   API REQUEST
========================================================= */

async function apiRequest(
    path,
    options = {}
){

    const method =
        options.method ||
        "GET";


    const requiresAuth =
        options.auth !== false;


    const token =
        STATE.token ||
        getStoredToken();


    const headers = {

        Accept:
            "application/json"

    };


    if(
        options.body !== undefined &&
        options.body !== null
    ){

        headers[
            "Content-Type"
        ] =
            "application/json";

    }


    if(
        requiresAuth &&
        token
    ){

        headers.Authorization =
            "Bearer " +
            token;

    }


    const controller =
        new AbortController();


    const timeout =
        setTimeout(
            () =>
                controller.abort(),
            CONFIG.TIMEOUT
        );


    setLoading(
        true,
        options.loadingText ||
        "در حال ارتباط با سامانه..."
    );


    try{

        const response =
            await fetch(
                CONFIG.API +
                path,
                {

                    method,

                    headers,

                    body:
                        options.body === undefined ||
                        options.body === null

                            ? undefined

                            : JSON.stringify(
                                options.body
                            ),

                    signal:
                        controller.signal,

                    cache:
                        "no-store"

                }
            );


        let data =
            null;


        try{

            data =
                await response.json();

        }

        catch{

            data =
                null;

        }


        if(
            response.status === 401
        ){

            clearAuth();


            if(
                options.redirectOn401 !== false
            ){

                showMessage(
                    "نشست شما منقضی شده است.",
                    "error"
                );


                setTimeout(
                    () => {

                        window.location.href =
                            CONFIG.LOGIN_PAGE;

                    },
                    600
                );

            }


            throw normalizeApiError(
                data,
                401
            );

        }


        if(
            !response.ok
        ){

            throw normalizeApiError(
                data,
                response.status
            );

        }


        if(
            data &&
            data.success === false
        ){

            throw {

                code:
                    data.error?.code ||
                    "API_ERROR",

                message:
                    data.error?.message ||
                    "عملیات انجام نشد.",

                status:
                    response.status

            };

        }


        return data || {};

    }

    catch(error){

        if(
            error &&
            error.code
        ){

            throw error;

        }


        if(
            error &&
            error.name ===
                "AbortError"
        ){

            throw {

                code:
                    "TIMEOUT",

                message:
                    "زمان پاسخ‌گویی سامانه به پایان رسید.",

                status:
                    0

            };

        }


        console.error(
            "API REQUEST ERROR:",
            path,
            error
        );


        throw {

            code:
                "NETWORK_ERROR",

            message:
                "ارتباط با Worker برقرار نشد.",

            status:
                0,

            original:
                error

        };

    }

    finally{

        clearTimeout(
            timeout
        );

        setLoading(
            false
        );

    }

}

/* ============================================================

============================================================ */

function populateSelect(
    selector,
    items,
    valueField,
    labelFunction,
    placeholder = "انتخاب کنید"
){

    const selects =
        $$(selector);


    selects.forEach(
        select => {

            const oldValue =
                select.value;


            select.innerHTML =
                "";


            const first =
                document.createElement(
                    "option"
                );


            first.value =
                "";


            first.textContent =
                placeholder;


            select.appendChild(
                first
            );


            items.forEach(
                item => {

                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        item[valueField];


                    option.textContent =
                        labelFunction(item);


                    select.appendChild(
                        option
                    );

                }
            );


            if(oldValue){

                select.value =
                    oldValue;

            }

        }
    );

}

/* ============================================================
   DATE UTILITIES
============================================================ */

function pad2(value){

    return String(value)
        .padStart(
            2,
            "0"
        );

}


function gregorianToJalali(
    gy,
    gm,
    gd
){

    const gdm = [

        0,
        31,
        59,
        90,
        120,
        151,
        181,
        212,
        243,
        273,
        304,
        334

    ];


    let jy;


    if(gy > 1600){

        jy = 979;

        gy -= 1600;

    }

    else{

        jy = 0;

        gy -= 621;

    }


    const gy2 =
        gm > 2
            ? gy + 1
            : gy;


    let days =
        (
            365 * gy
        )
        +
        Math.floor(
            (gy2 + 3) / 4
        )
        -
        Math.floor(
            (gy2 + 99) / 100
        )
        +
        Math.floor(
            (gy2 + 399) / 400
        )
        -
        80
        +
        gd
        +
        gdm[gm - 1];


    jy +=
        33 *
        Math.floor(
            days / 12053
        );


    days %=
        12053;


    jy +=
        4 *
        Math.floor(
            days / 1461
        );


    days %=
        1461;


    if(days > 365){

        jy +=
            Math.floor(
                (days - 1) / 365
            );


        days =
            (days - 1) % 365;

    }


    const jm =
        days < 186
            ? 1 +
              Math.floor(
                  days / 31
              )
            : 7 +
              Math.floor(
                  (days - 186) / 30
              );


    const jd =
        1 +
        (
            days < 186
                ? days % 31
                : (days - 186) % 30
        );


    return {
        jy,
        jm,
        jd
    };

}


function jalaliToGregorian(
    jy,
    jm,
    jd
){

    jy =
        Number(jy);

    jm =
        Number(jm);

    jd =
        Number(jd);


    let gy;


    if(jy > 979){

        gy = 1600;

        jy -= 979;

    }

    else{

        gy = 621;

    }


    let days =
        365 * jy
        +
        Math.floor(
            jy / 33
        ) * 8
        +
        Math.floor(
            (
                jy % 33 +
                3
            ) / 4
        )
        +
        78
        +
        jd
        +
        (
            jm < 7
                ? (jm - 1) * 31
                : (jm - 7) * 30 + 186
        );


    gy +=
        400 *
        Math.floor(
            days / 146097
        );


    days %=
        146097;


    if(days > 36524){

        gy +=
            100 *
            Math.floor(
                --days / 36524
            );


        days %=
            36524;


        if(days >= 365){
            days++;
        }

    }


    gy +=
        4 *
        Math.floor(
            days / 1461
        );


    days %=
        1461;


    if(days > 365){

        gy +=
            Math.floor(
                (days - 1) / 365
            );


        days =
            (days - 1) % 365;

    }


    let gd =
        days + 1;


    const leap =
        (
            gy % 4 === 0 &&
            gy % 100 !== 0
        )
        ||
        gy % 400 === 0;


    const monthDays = [

        0,
        31,
        leap ? 29 : 28,
        31,
        30,
        31,
        30,
        31,
        31,
        30,
        31,
        30,
        31

    ];


    let gm =
        1;


    while(
        gd >
        monthDays[gm]
    ){

        gd -=
            monthDays[gm];

        gm++;

    }


    return {
        gy,
        gm,
        gd
    };

}


/* ============================================================
   DATE PARSE
============================================================ */

function normalizeDateDigits(
    value
){

    return String(
        value || ""
    )
        .replace(/۰/g, "0")
        .replace(/۱/g, "1")
        .replace(/۲/g, "2")
        .replace(/۳/g, "3")
        .replace(/۴/g, "4")
        .replace(/۵/g, "5")
        .replace(/۶/g, "6")
        .replace(/۷/g, "7")
        .replace(/۸/g, "8")
        .replace(/۹/g, "9");

}


function jalaliDisplayToApi(
    value
){

    value =
        normalizeDateDigits(
            value
        )
        .replace(
            /\//g,
            "-"
        );


    if(
        !/^\d{4}-\d{1,2}-\d{1,2}$/.test(
            value
        )
    ){

        return "";

    }


    const parts =
        value
            .split("-")
            .map(Number);


    const g =
        jalaliToGregorian(
            parts[0],
            parts[1],
            parts[2]
        );


    return [
        g.gy,
        pad2(g.gm),
        pad2(g.gd)
    ].join("-");

}


function apiDateToJalali(
    value
){

    if(!value){
        return "";
    }


    const match =
        String(value)
            .match(
                /^(\d{4})-(\d{1,2})-(\d{1,2})/
            );


    if(!match){
        return String(value);
    }


    const g =
        gregorianToJalali(
            Number(match[1]),
            Number(match[2]),
            Number(match[3])
        );


    return [
        g.jy,
        pad2(g.jm),
        pad2(g.jd)
    ].join("/");

}


/* ============================================================
   PERSIAN DATEPICKER
============================================================ */

function initPersianDatePickers(){

    if(
        typeof window.jQuery ===
        "undefined"
    ){
        return;
    }


    if(
        typeof jQuery.fn.pDatepicker !==
        "function"
    ){
        return;
    }


    const inputs = [

        ...$(".jalali-date"),

        ...$$(
            'input[data-date-type="jalali"]'
        ),

        ...$$(
            'input[name*="date" i]'
        ),

        ...$$(
            'input[id*="date" i]'
        )

    ];


    const uniqueInputs =
        [...new Set(inputs)];


    uniqueInputs.forEach(
        input => {

            if(
                !input ||
                input.tagName !== "INPUT" ||
                input.type !== "text"
            ){
                return;
            }


            if(
                input.dataset
                    .persianDateReady === "1"
            ){
                return;
            }


            input.classList.add(
                "jalali-date"
            );


            input.setAttribute(
                "autocomplete",
                "off"
            );


            const jq =
                window.jQuery;


            jq(input).pDatepicker({

                format:
                    "YYYY/MM/DD",

                autoClose:
                    true,

                initialValue:
                    false,

                persianDigit:
                    true,

                calendarType:
                    "persian",

                observer:
                    true,

                responsive:
                    true

            });


            input.dataset
                .persianDateReady =
                    "1";

        }
    );

}

function clearFormErrors(
    form
){

    form.querySelectorAll(
        ".form-error"
    ).forEach(
        element => {

            element.textContent =
                "";

        }
    );


    form.querySelectorAll(
        ".has-error"
    ).forEach(
        element => {

            element.classList.remove(
                "has-error"
            );

        }
    );

}


function setFieldError(
    form,
    fieldName,
    message
){

    const field =
        form.elements[fieldName];


    if(field){

        field.classList.add(
            "has-error"
        );

    }


    const error =
        form.querySelector(
            `[data-error-for="${fieldName}"]`
        );


    if(error){

        error.textContent =
            message;

    }

}


function requiredValue(
    form,
    fieldName,
    label
){

    const field =
        form.elements[fieldName];


    if(!field){
        return null;
    }


    const value =
        String(
            field.value ?? ""
        ).trim();


    if(!value){

        setFieldError(
            form,
            fieldName,
            `${label} الزامی است.`
        );


        return null;

    }


    return value;

}


/* ============================================================
   FORM VALUE
============================================================ */

function numericValue(
    form,
    fieldName
){

    const field =
        form.elements[fieldName];


    if(!field){
        return 0;
    }


    return toNumber(
        field.value
    );

}


function selectNumericValue(
    form,
    fieldName
){

    const field =
        form.elements[fieldName];


    if(
        !field ||
        !field.value
    ){
        return null;
    }


    const value =
        Number(
            field.value
        );


    return Number.isFinite(value)
        ? value
        : null;

}


/* ============================================================
   DATE VALUE
============================================================ */

function dateValue(
    form,
    fieldName,
    required = false
){

    const field =
        form.elements[fieldName];


    if(!field){
        return null;
    }


    const value =
        field.value.trim();


    if(
        required &&
        !value
    ){

        setFieldError(
            form,
            fieldName,
            "تاریخ الزامی است."
        );


        return null;

    }


    if(!value){
        return null;
    }


    const apiDate =
        jalaliDisplayToApi(
            value
        );


    if(!apiDate){

        setFieldError(
            form,
            fieldName,
            "تاریخ واردشده معتبر نیست."
        );


        return null;

    }


    return apiDate;

}


/* ============================================================
   FORM DATA OBJECT
============================================================ */

function formObject(
    form
){

    const result = {};


    Array.from(
        form.elements
    ).forEach(
        element => {

            if(
                !element.name ||
                element.disabled
            ){
                return;
            }


            if(
                element.type ===
                "checkbox"
            ){

                result[
                    element.name
                ] =
                    element.checked;

            }

            else if(
                element.type ===
                "radio"
            ){

                if(element.checked){

                    result[
                        element.name
                    ] =
                        element.value;

                }

            }

            else{

                result[
                    element.name
                ] =
                    element.value;

            }

        }
    );


    return result;

}

/* ============================================================
   TABLE BUILDER
============================================================ */

function buildTable(
    columns,
    rows,
    options = {}
){

    if(!rows.length){

        return emptyState(
            options.empty ||
            "اطلاعاتی ثبت نشده است."
        );

    }


    let html = `

        <div class="table-container">

            <table class="data-table">

                <thead>

                    <tr>

    `;


    columns.forEach(
        column => {

            html += `
                <th>
                    ${escapeHtml(
                        column.label
                    )}
                </th>
            `;

        }
    );


    if(options.actions){

        html += `
            <th>
                عملیات
            </th>
        `;

    }


    html += `

                    </tr>

                </thead>

                <tbody>

    `;


    rows.forEach(
        row => {

            html += "<tr>";


            columns.forEach(
                column => {

                    let value;


                    if(
                        typeof column.value ===
                        "function"
                    ){

                        value =
                            column.value(
                                row
                            );

                    }

                    else{

                        value =
                            row[
                                column.value
                            ];

                    }


                    if(
                        column.type ===
                        "number"
                    ){

                        value =
                            formatNumber(
                                value
                            );

                    }


                    if(
                        column.type ===
                        "date"
                    ){

                        value =
                            apiDateToJalali(
                                value
                            );

                    }


                    if(
                        column.type ===
                        "badge"
                    ){

                        value =
                            statusBadge(
                                value
                            );

                    }


                    html += `

                        <td>

                            ${
                                column.raw
                                    ? String(
                                        value ??
                                        ""
                                      )
                                    : escapeHtml(
                                        value ??
                                        "-"
                                      )
                            }

                        </td>

                    `;

                }
            );


            if(options.actions){

                html += `

                    <td>

                        <div class="toolbar">

                            <button
                                type="button"
                                class="btn small secondary"
                                data-action="edit"
                                data-id="${row.id}"
                            >
                                ویرایش
                            </button>

                            <button
                                type="button"
                                class="btn small danger"
                                data-action="delete"
                                data-id="${row.id}"
                            >
                                حذف
                            </button>

                        </div>

                    </td>

                `;

            }


            html += "</tr>";

        }
    );


    html += `

                </tbody>

            </table>

        </div>

    `;


    return html;

}


/* ============================================================
   STATUS BADGE
============================================================ */

function statusBadge(
    status
){

    const value =
        String(
            status ||
            ""
        );


    let type =
        "info";


    if(
        /فعال|active|completed|complete|done|approved/i
            .test(value)
    ){

        type =
            "success";

    }

    else if(
        /غیرفعال|inactive|cancel|rejected|error/i
            .test(value)
    ){

        type =
            "danger";

    }

    else if(
        /pending|در انتظار|draft|پیش‌نویس/i
            .test(value)
    ){

        type =
            "warning";

    }


    return `

        <span class="badge ${type}">

            ${escapeHtml(
                value ||
                "-"
            )}

        </span>

    `;

}

async function renderEntityView(

){

    const config =

        ];


    if(!config){
        return;
    }


    const rows =
        STATE[
            entityName
        ] || [];


    $("#mainContent").innerHTML = `

        ${pageHeader(
            config.title,
            config.description,
            rows.length
        )}


        <section class="card">

            <div class="card-header">

                <h2 class="card-title">
                    ${escapeHtml(
                        config.title
                    )}

                <div class="toolbar">

                    <button
                        type="button"
                        class="btn secondary small"
                        data-action-create="${entityName}"
                    >
                        + ثبت جدید
                    </button>


                    <button
                        type="button"
                        class="btn secondary small"
                        data-action-refresh="${entityName}"
                    >
                        بروزرسانی
                    </button>

                </div>

            </div>


            <div class="card-body">

                <div
                    class="search"
                    style="
                        display:flex;
                        gap:7px;
                        margin-bottom:12px;

                        type="search"
                        class="form-control"

                        config.columns,
                        rows,
                        {
                            actions:true,
                            empty:
                                "اطلاعاتی ثبت نشده است."
                        }
                    )}

                </div>

            </div>

        </section>

    `;


    const search =
        $("#gridSearch");


    if(search){

        search.addEventListener(
            "input",
            () => {

                const query =
                    search.value
                        .trim()
                        .toLowerCase();


                const filtered =
                    query
                        ? rows.filter(
                            row =>
                                Object
                                    .values(row)
                                    .some(
                                        value =>
                                            String(
                                                value ??
                                                ""
                                            )
                                            .toLowerCase()
                                            .includes(
                                                query
                                            )
                                    )
                          )
                        : rows;


                $("#entityGrid").innerHTML =
                    buildTable(
                        config.columns,
                        filtered,
                        {
                            actions:true,
                            empty:

        "[data-action-refresh]"
    ).forEach(
        button => {

            button.addEventListener(
                "click",
                async () => {

                    await loadCollection(
                        entityName,
                        config.endpoint,
                        config.title
                    );


                    renderEntityView(
                        entityName
                    );

                }
            );

        }
    );


    bindEntityGridActions(
        entityName

/* ============================================================
   DELETE ENTITY
============================================================ */

async function deleteEntity(
    entityName,
    id
){

    const config =
        ENTITY_CONFIG[
            entityName
        ];


    if(!config){
        return;
    }


    const item =
        STATE[
            entityName
        ].find(
            x =>
                Number(x.id) ===
                Number(id)
        );


    const name =
        item?.name ||
        item?.code ||
        id;


    if(
        !window.confirm(
            `آیا از حذف «${name}» اطمینان دارید؟`
        )
    ){
        return;
    }


    try{

        await apiRequest(
            `${config.endpoint}/${encodeURIComponent(id)}`,
            {
                method:
                    "DELETE",

                loadingText:
                    "در حال حذف اطلاعات..."
            }
        );


        showMessage(
            "اطلاعات با موفقیت حذف شد.",
            "success"
        );


        await loadCollection(
            entityName,
            config.endpoint,
            config.title
        );


        await openView(
            entityName
        );

    }

    catch(error){

        showMessage(
            error.message ||
            "حذف اطلاعات انجام نشد.",
            "error"
        );

    }

}

        requiredValue(
            form,
            "code",

        requiredValue(
            form,
            "name",
            "نام قطعه"
        );


    const unitId =
        selectNumericValue(

        );


    if(unitId === null){

        setFieldError(
            form,

            "واحد را انتخاب کنید."

    const minStock =
        numericValue(
            form,
            "min_stock"
        );


    const reorderPoint =
        numericValue(
            form,
            "reorder_point"

        !code ||
        !name ||
        unitId === null ||
        minStock < 0 ||
        reorderPoint < 0
    ){
        return;
    }


    const data = {

        code,
        name,

        unit_id:
            unitId,

        barcode:
            form.elements.barcode.value
                .trim(),

        min_stock:
            minStock,

        reorder_point:
            reorderPoint,

        status:
            form.elements.status.value ||

        const id =
            form.elements.id.value;


        const result =
            await apiRequest(

                editing
                    ? `/api/parts/${encodeURIComponent(id)}`
                    : "/api/parts",

                {

                    method:
                        editing
                            ? "PUT"
                            : "POST",

                        data,

                    loadingText:
                        editing
                            ? "در حال ویرایش قطعه..."
                            : "در حال ثبت قطعه..."

                editing

            "قطعات"
        );


        refreshAllDropdowns();


        renderEntityView(
            "parts"
        );

    }

    catch(error){

        showMessage(
            error.message ||
            "ذخیره قطعه انجام نشد.",
            "error"
        );

    }

}

function bindBomActions(){

    $$("#bomGrid [data-action='edit']")
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        const id =
                            Number(
                                button.dataset.id
                            );


                        const item =
                            STATE.boms.find(
                                row =>
                                    Number(row.id) ===
                                    id
                            );


                        if(item){

                            openBomForm(
                                item
                            );

                        }

                    }
                );

            }
        );


    $$("#bomGrid [data-action='delete']")
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () =>
                        deleteBom(
                            Number(
                                button.dataset.id
                            )
                        )
                );

            }
        );

}

============================================================ */

async function submitBomForm(
    event,
    editing
){

    event.preventDefault();


    const form =
        event.currentTarget;


    clearFormErrors(form);


    const code =
        requiredValue(
            form,
            "code",
            "کد BOM"
        );


    const productId =
        selectNumericValue(
            form,
            "product_id"
        );


    if(productId === null){

        setFieldError(
            form,
            "product_id",
            "محصول را انتخاب کنید."
        );

    }


    const version =
        Number(
            form.elements.version.value
        );


    if(
        !Number.isInteger(version) ||
        version < 1
    ){

        setFieldError(
            form,
            "version",
            "نسخه BOM باید یک عدد صحیح مثبت باشد."
        );

    }


    const effectiveDate =
        dateValue(
            form,
            "effective_date",
            false
        );


    const rows =
        [
            ...form.querySelectorAll(
                ".bom-item-row"
            )
        ];


    const items = [];


    rows.forEach(
        row => {

            const partId =
                Number(
                    row.querySelector(
                        '[name="part_id"]'
                    )?.value
                );


            const quantity =
                toNumber(
                    row.querySelector(
                        '[name="quantity"]'
                    )?.value
                );


            const wastePercent =
                toNumber(
                    row.querySelector(
                        '[name="waste_percent"]'
                    )?.value
                );


            if(
                Number.isFinite(partId) &&
                partId > 0
            ){

                items.push({

                    part_id:
                        partId,

                    quantity,

                    waste_percent:
                        wastePercent

                });

            }

        }
    );


    if(!items.length){

        setFieldError(
            form,
            "items",
            "حداقل یک قطعه برای BOM انتخاب کنید."
        );

    }


    if(
        !code ||
        productId === null ||
        !Number.isInteger(version) ||
        version < 1 ||
        !items.length
    ){
        return;
    }


    const data = {

        code,

        product_id:
            productId,

        version,

        effective_date:
            effectiveDate,

        status:
            form.elements.status.value ||
            "draft",

        items

    };


    try{

        const id =
            form.elements.id.value;


        const result =
            await apiRequest(

                editing
                    ? `/api/boms/${encodeURIComponent(id)}`
                    : "/api/boms",

                {

                    method:
                        editing
                            ? "PUT"
                            : "POST",

                    body:
                        data,

                    loadingText:
                        editing
                            ? "در حال ویرایش BOM..."
                            : "در حال ثبت BOM..."

                }

            );


        showMessage(
            result.message ||
            (
                editing
                    ? "BOM با موفقیت ویرایش شد."
                    : "BOM با موفقیت ثبت شد."
            )
        );


        closeModal();


        await loadCollection(
            "boms",
            "/api/boms",
            "BOMها"
        );


        refreshAllDropdowns();


        renderBomsView();

    }

    catch(error){

        showMessage(
            error.message ||
            "ذخیره BOM انجام نشد.",
            "error"
        );

    }

}

/* ============================================================
   PRODUCTION SUBMIT
============================================================ */

async function submitProductionForm(
    event,
    editing
){

    event.preventDefault();


    const form =
        event.currentTarget;


    clearFormErrors(form);


    const productionDate =
        dateValue(
            form,
            "production_date",
            true
        );


    const planningId =
        selectNumericValue(
            form,
            "planning_id"
        );


    const quantity =
        numericValue(
            form,
            "quantity"
        );


    if(
        quantity <= 0
    ){

        setFieldError(
            form,
            "quantity",
            "مقدار تولید باید بیشتر از صفر باشد."
        );

    }


    if(
        !productionDate ||
        quantity <= 0
    ){
        return;
    }


    const data = {

        production_date:
            productionDate,

        planning_id:
            planningId,

        quantity,

        status:
            form.elements.status.value ||
            "completed"

    };


    try{

        const id =
            form.elements.id.value;


        const result =
            await apiRequest(

                editing
                    ? `/api/production/${encodeURIComponent(id)}`
                    : "/api/production",

                {

                    method:
                        editing
                            ? "PUT"
                            : "POST",

                    body:
                        data,

                    loadingText:
                        editing
                            ? "در حال ویرایش تولید..."
                            : "در حال ثبت تولید..."

                }

            );


        showMessage(
            result.message ||
            (
                editing
                    ? "ثبت تولید ویرایش شد."
                    : "تولید با موفقیت ثبت شد."
            )
        );


        closeModal();


        await loadCollection(
            "production",
            "/api/production",
            "سوابق تولید"
        );


        renderProductionView();

    }

    catch(error){

        showMessage(
            error.message ||
            "ذخیره تولید انجام نشد.",
            "error"
        );

    }

}

============================================================ */

async function openView(
    view
){

    STATE.currentView =
        view;


    updateNavigationState(
        view
    );


    if(view === "dashboard"){

        renderDashboard();
        return;

    }


    if(
        ENTITY_CONFIG[
            view
        ]
    ){

        await ensureCollectionLoaded(
            view
        );


        renderEntityView(
            view
        );

        return;

    }


    switch(view){

        case "boms":

            await ensureCollectionLoaded(
                "boms"
            );

            renderBomsView();

            break;


        case "planning":

            await ensureCollectionLoaded(
                "planning"
            );

            renderPlanningView();

            break;


        case "production":

            await ensureCollectionLoaded(
                "production"
            );

            renderProductionView();

            break;


        case "inventory":

            await ensureCollectionLoaded(
                "inventory"
            );

            renderInventoryView();

            break;


        default:

            renderDashboard();

            break;

    }

}

/* ============================================================
   GLOBAL JALALI OBSERVER
============================================================ */

function observeJalaliInputs(){

    if(
        typeof MutationObserver ===
        "undefined"
    ){
        return;
    }


    const root =
        document.body;


    if(!root){
        return;
    }


    const observer =
        new MutationObserver(
            mutations => {

                let hasNewInput =
                    false;


                for(
                    const mutation
                    of mutations
                ){

                    if(
                        mutation.type !==
                        "childList"
                    ){
                        continue;
                    }


                    for(
                        const node
                        of mutation.addedNodes
                    ){

                        if(
                            node.nodeType !==
                            1
                        ){
                            continue;
                        }


                        if(
                            node.matches?.(
                                ".jalali-date, input[data-date-type='jalali']"
                            )
                            ||
                            node.querySelector?.(
                                ".jalali-date, input[data-date-type='jalali']"
                            )
                        ){

                            hasNewInput =
                                true;

                            break;

                        }

                    }


                    if(hasNewInput){
                        break;
                    }

                }


                if(hasNewInput){

                    initPersianDatePickers();

                }

            }
        );


    observer.observe(
        root,
        {
            childList:true,
            subtree:true
        }
    );

}

async function renderEntityView(
    entityName
){

    const config =
        ENTITY_CONFIG[
            entityName
        ];


    if(!config){

        return;

    }


    const rows =
        STATE[
            entityName
        ] || [];


    const mainContent =
        $("#mainContent");


    if(!mainContent){

        return;

    }


    mainContent.innerHTML = `

        ${pageHeader(
            config.title,
            config.description,
            rows.length
        )}


        <section class="card">

            <div class="card-header">

                <h2 class="card-title">
                    ${escapeHtml(
                        config.title
                    )}
                </h2>


                <div class="toolbar">

                    <button
                        type="button"
                        class="btn secondary small"
                        data-action-create="${entityName}"
                    >
                        + ثبت جدید
                    </button>


                    <button
                        type="button"
                        class="btn secondary small"
                        data-action-refresh="${entityName}"
                    >
                        بروزرسانی
                    </button>

                </div>

            </div>


            <div class="card-body">

                <div
                    class="search"
                    style="
                        display:flex;
                        gap:7px;
                        margin-bottom:12px;
                    "
                >

                    <input
                        type="search"
                        class="form-control"
                        id="gridSearch"
                        placeholder="جستجو در اطلاعات..."
                    >

                </div>


                <div id="entityGrid">

                    ${buildTable(
                        config.columns,
                        rows,
                        {

                            actions:true,

                            empty:
                                "اطلاعاتی ثبت نشده است."

                        }
                    )}

                </div>

            </div>

        </section>

    `;


    const search =
        $("#gridSearch");


    if(search){

        search.addEventListener(
            "input",
            () => {

                const query =
                    normalizeDigits(
                        search.value
                    )
                    .trim()
                    .toLowerCase();


                const filtered =
                    query
                        ? rows.filter(
                            row =>
                                Object
                                    .values(row)
                                    .some(
                                        value =>
                                            normalizeDigits(
                                                String(
                                                    value ??
                                                    ""
                                                )
                                            )
                                            .toLowerCase()
                                            .includes(
                                                query
                                            )
                                    )
                          )
                        : rows;


                const grid =
                    $("#entityGrid");


                if(grid){

                    grid.innerHTML =
                        buildTable(
                            config.columns,
                            filtered,
                            {

                                actions:true,

                                empty:
                                    "نتیجه‌ای پیدا نشد."

                            }
                        );


                    bindEntityGridActions(
                        entityName
                    );

                }

            }
        );

    }


    $$(
        "[data-action-create]"
    ).forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    openEntityForm(
                        entityName
                    );

                }
            );

        }
    );


    $$(
        "[data-action-refresh]"
    ).forEach(
        button => {

            button.addEventListener(
                "click",
                async () => {

                    try{

                        await loadCollection(
                            entityName,
                            config.endpoint,
                            config.title
                        );


                        await renderEntityView(
                            entityName
                        );

                    }

                    catch(error){

                        showMessage(
                            error.message ||
                            "دریافت اطلاعات انجام نشد.",
                            "error"
                        );

                    }

                }
            );

        }
    );


    bindEntityGridActions(
        entityName
    );

}

/* ============================================================
   DELETE ENTITY
============================================================ */

async function deleteEntity(
    entityName,
    id
){

    const config =
        ENTITY_CONFIG[
            entityName
        ];


    if(!config){

        return;

    }


    const items =
        STATE[
            entityName
        ] || [];


    const item =
        items.find(
            x =>
                Number(x.id) ===
                Number(id)
        );


    const name =
        item?.name ||
        item?.code ||
        id;


    if(
        !window.confirm(
            `آیا از حذف «${name}» اطمینان دارید؟`
        )
    ){

        return;

    }


    try{

        await apiRequest(
            `${config.endpoint}/${encodeURIComponent(id)}`,
            {

                method:"DELETE",

                loadingText:
                    "در حال حذف اطلاعات..."

            }
        );


        showMessage(
            "اطلاعات با موفقیت حذف شد.",
            "success"
        );


        await loadCollection(
            entityName,
            config.endpoint,
            config.title
        );


        await openView(
            entityName
        );

    }

    catch(error){

        showMessage(
            error.message ||
            "حذف اطلاعات انجام نشد.",
            "error"
        );

    }

}

============================================================ */

function openModal(
    title,
    body,
    footer = ""
){

    const modal =
        $("#appModal");

    const titleElement =
        $("#modalTitle");

    const bodyElement =
        $("#modalBody");

    const footerElement =
        $("#modalFooter");


    if(
        !modal ||
        !titleElement ||
        !bodyElement ||
        !footerElement
    ){

        console.error(
            "Modal elements are missing."
        );

        return;

    }


    titleElement.textContent =
        title || "";


    bodyElement.innerHTML =
        body || "";


    footerElement.innerHTML =
        footer || "";


    modal.classList.add(
        "show"
    );


    document.body.classList.add(
        "modal-open"
    );

}


function closeModal(){

    const modal =
        $("#appModal");

    const body =
        $("#modalBody");

    const footer =
        $("#modalFooter");


    if(modal){

        modal.classList.remove(
            "show"
        );

    }


    if(body){

        body.innerHTML =
            "";

    }


    if(footer){

        footer.innerHTML =
            "";

    }


    document.body.classList.remove(
        "modal-open"
    );

}

/* ============================================================
   GENERIC FORM HELPERS
============================================================ */

function requiredValue(
    form,
    fieldName,
    label
){

    const field =
        form?.elements?.[fieldName];


    if(!field){

        console.error(
            `Missing form field: ${fieldName}`
        );

        return "";

    }


    const value =
        normalizeDigits(
            field.value || ""
        ).trim();


    if(!value){

        setFormError(
            form,
            fieldName,
            `${label} الزامی است.`
        );

        field.focus();

        return "";

    }


    return value;

}


function numericValue(
    value
){

    const normalized =
        normalizeDigits(
            String(value ?? "")
        ).trim();


    if(normalized === ""){

        return null;

    }


    const number =
        Number(normalized);


    if(
        !Number.isFinite(number) ||
        number < 0
    ){

        return null;

    }


    return number;

}


function setFormError(
    form,
    fieldName,
    message
){

    const errorElement =
        form?.querySelector(
            `[data-error-for="${CSS.escape(fieldName)}"]`
        );


    if(errorElement){

        errorElement.textContent =
            message || "";

    }


    const field =
        form?.elements?.[fieldName];


    if(field){

        field.classList.toggle(
            "is-invalid",
            Boolean(message)
        );

        field.setAttribute(
            "aria-invalid",
            message
                ? "true"
                : "false"
        );

    }

}


function clearFormErrors(
    form
){

    if(!form){

        return;

    }


    form.querySelectorAll(
        ".form-error"
    ).forEach(
        element => {

            element.textContent =
                "";

        }
    );


    form.querySelectorAll(
        ".is-invalid"
    ).forEach(
        element => {

            element.classList.remove(
                "is-invalid"
            );

            element.removeAttribute(
                "aria-invalid"
            );

        }
    );

}


/* ============================================================
   SELECT HELPERS
============================================================ */

function populateSelect(
    selector,
    items,
    valueKey,
    labelResolver,
    placeholder
){

    const selects =
        typeof selector === "string"
            ? $$(selector)
            : [];


    selects.forEach(
        select => {

            const currentValue =
                select.value;


            select.innerHTML = "";


            const firstOption =
                document.createElement(
                    "option"
                );


            firstOption.value =
                "";

            firstOption.textContent =
                placeholder ||
                "انتخاب کنید";


            select.appendChild(
                firstOption
            );


            (Array.isArray(items)
                ? items
                : []
            ).forEach(
                item => {

                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        item?.[valueKey] ??
                        "";


                    option.textContent =
                        labelResolver
                            ? labelResolver(item)
                            : String(
                                item?.[valueKey] ??
                                ""
                              );


                    select.appendChild(
                        option
                    );

                }
            );


            if(
                currentValue !==
                ""
            ){

                select.value =
                    currentValue;

            }

        }
    );

}

    );

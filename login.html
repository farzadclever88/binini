<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#2563eb"
>

<title>
ورود | سامانه نی‌نی‌تو
</title>

<style>

:root{

    --bg:#f4f7fb;
    --card:#ffffff;
    --text:#172033;
    --muted:#64748b;
    --border:#e2e8f0;
    --primary:#2563eb;
    --primary-dark:#1d4ed8;
    --danger:#dc2626;

}

*{
    box-sizing:border-box;
}

html,
body{

    margin:0;
    padding:0;

    width:100%;
    min-height:100%;

}

body{

    background:var(--bg);

    color:var(--text);

    font-family:
        Tahoma,
        "Segoe UI",
        Arial,
        sans-serif;

    display:flex;

    align-items:center;

    justify-content:center;

    min-height:100vh;

}

.login-wrapper{

    width:100%;

    max-width:430px;

    padding:20px;

}

.login-card{

    background:var(--card);

    border:1px solid var(--border);

    border-radius:20px;

    padding:32px;

    box-shadow:
        0 15px 45px rgba(15,23,42,.08);

}

.logo{

    width:70px;

    height:70px;

    margin:0 auto 18px;

    border-radius:20px;

    background:var(--primary);

    color:white;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:34px;

    font-weight:900;

}

.title{

    text-align:center;

    margin-bottom:6px;

    font-size:23px;

    font-weight:900;

}

.subtitle{

    text-align:center;

    color:var(--muted);

    font-size:13px;

    margin-bottom:28px;

}

.form-group{

    margin-bottom:17px;

}

label{

    display:block;

    margin-bottom:7px;

    font-size:13px;

    font-weight:700;

}

input{

    width:100%;

    padding:13px 14px;

    border:1px solid var(--border);

    border-radius:10px;

    background:#fff;

    color:var(--text);

    outline:none;

    font:inherit;

}

input:focus{

    border-color:var(--primary);

    box-shadow:
        0 0 0 3px rgba(37,99,235,.10);

}

.login-button{

    width:100%;

    border:0;

    border-radius:10px;

    padding:13px;

    background:var(--primary);

    color:#fff;

    cursor:pointer;

    font-weight:800;

    font-size:14px;

    margin-top:5px;

}

.login-button:hover{

    background:var(--primary-dark);

}

.login-button:disabled{

    opacity:.6;

    cursor:not-allowed;

}

.error{

    display:none;

    margin-bottom:15px;

    padding:12px;

    border-radius:10px;

    background:#dc262615;

    color:var(--danger);

    border:1px solid #dc262630;

    font-size:13px;

    line-height:1.8;

}

.error.show{

    display:block;

}

.loader{

    display:none;

    position:fixed;

    inset:0;

    z-index:100;

    background:rgba(0,0,0,.35);

    align-items:center;

    justify-content:center;

}

.loader.show{

    display:flex;

}

.loader-box{

    background:white;

    border-radius:15px;

    padding:25px 35px;

    text-align:center;

}

.spinner{

    width:34px;

    height:34px;

    margin:0 auto 12px;

    border:4px solid #e2e8f0;

    border-top-color:#2563eb;

    border-radius:50%;

    animation:
        spin .8s linear infinite;

}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}

.footer{

    text-align:center;

    color:var(--muted);

    font-size:11px;

    margin-top:18px;

}

</style>

</head>

<body>

<div class="login-wrapper">

    <div class="login-card">

        <div class="logo">
            ن
        </div>

        <div class="title">
            سامانه نی‌نی‌تو
        </div>

        <div class="subtitle">
            مدیریت تولید، BOM و انبار
        </div>

        <div
            id="error"
            class="error"
        ></div>

        <form id="loginForm">

            <div class="form-group">

                <label for="username">
                    نام کاربری
                </label>

                <input
                    id="username"
                    name="username"
                    type="text"
                    autocomplete="username"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">
                    رمز عبور
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >

            </div>

            <button
                id="loginButton"
                class="login-button"
                type="submit"
            >
                ورود به سامانه
            </button>

        </form>

    </div>

    <div class="footer">
        نی‌نی‌تو — Cloudflare Worker + D1
    </div>

</div>


<div
    id="loader"
    class="loader"
>

    <div class="loader-box">

        <div class="spinner"></div>

        <div>
            در حال ورود به سامانه...
        </div>

    </div>

</div>


<script>

"use strict";


/* =========================================================
   CONFIG
========================================================= */

const CONFIG = {

    API:
        "https://ninitoapp.farzadclever88.workers.dev",

    TOKEN_KEY:
        "ninito_token",

    USER_KEY:
        "ninito_user",

    INDEX_PAGE:
        "index.html",

    TIMEOUT:
        20000

};


/* =========================================================
   DOM
========================================================= */

const form =
    document.getElementById(
        "loginForm"
    );

const username =
    document.getElementById(
        "username"
    );

const password =
    document.getElementById(
        "password"
    );

const button =
    document.getElementById(
        "loginButton"
    );

const errorBox =
    document.getElementById(
        "error"
    );

const loader =
    document.getElementById(
        "loader"
    );


/* =========================================================
   ERROR
========================================================= */

function showError(message){

    errorBox.textContent =
        message ||
        "خطایی در ورود رخ داد.";

    errorBox.classList.add(
        "show"
    );

}


function hideError(){

    errorBox.textContent =
        "";

    errorBox.classList.remove(
        "show"
    );

}


/* =========================================================
   LOADING
========================================================= */

function setLoading(state){

    loader.classList.toggle(
        "show",
        state
    );

    button.disabled =
        state;

}


/* =========================================================
   LOGIN
========================================================= */

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        hideError();

        const user =
            username.value.trim();

        const pass =
            password.value;

        if(!user){

            showError(
                "نام کاربری را وارد کنید."
            );

            username.focus();

            return;

        }

        if(!pass){

            showError(
                "رمز عبور را وارد کنید."
            );

            password.focus();

            return;

        }


        setLoading(true);


        const controller =
            new AbortController();

        const timer =
            setTimeout(
                () =>
                    controller.abort(),
                CONFIG.TIMEOUT
            );


        try{

            const response =
                await fetch(

                    CONFIG.API +
                    "/api/login",

                    {

                        method:
                            "POST",

                        headers:{

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                username:
                                    user,

                                password:
                                    pass

                            }),

                        signal:
                            controller.signal,

                        cache:
                            "no-store"

                    }

                );


            clearTimeout(timer);


            let data;

            try{

                data =
                    await response.json();

            }

            catch{

                throw new Error(
                    "پاسخ Worker معتبر نیست."
                );

            }


            if(!response.ok){

                throw new Error(

                    data?.error?.message ||

                    data?.message ||

                    "نام کاربری یا رمز عبور صحیح نیست."

                );

            }


            if(
                data?.success === false
            ){

                throw new Error(

                    data?.error?.message ||

                    data?.message ||

                    "ورود انجام نشد."

                );

            }


            if(!data?.token){

                throw new Error(
                    "توکن ورود از Worker دریافت نشد."
                );

            }


            localStorage.setItem(

                CONFIG.TOKEN_KEY,

                data.token

            );


            if(data.user){

                localStorage.setItem(

                    CONFIG.USER_KEY,

                    JSON.stringify(
                        data.user
                    )

                );

            }


            /*
             * بسیار مهم:
             *
             * index.html در همان پوشه login.html است.
             */

            window.location.replace(
                CONFIG.INDEX_PAGE
            );

        }

        catch(error){

            clearTimeout(timer);

            console.error(
                "LOGIN ERROR:",
                error
            );


            if(
                error.name ===
                "AbortError"
            ){

                showError(
                    "زمان اتصال به Worker تمام شد."
                );

            }

            else{

                showError(

                    error.message ||

                    "ارتباط با Worker برقرار نشد."

                );

            }

        }

        finally{

            setLoading(false);

        }

    }

);


/* =========================================================
   AUTO REDIRECT
========================================================= */

if(
    localStorage.getItem(
        CONFIG.TOKEN_KEY
    )
){

    /*
     * اگر قبلاً وارد شده است،
     * Login دوباره نمایش داده نمی‌شود.
     */

    window.location.replace(
        CONFIG.INDEX_PAGE
    );

}

</script>

</body>
</html>
